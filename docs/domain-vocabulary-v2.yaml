schema_version: "2.0"
document: arclint-domain-vocabulary
status: implemented  # switchover completed 2026-08-17; this model is now the live domain

domain:
  name: ArcLint
  definition: >-
    A repository linter and architectural-conformance system. ArcLint evaluates
    Rules against Files, Folders, and Modules, then reports what it could prove,
    what it suspects, and what it could not determine.
  supported_programming_languages:
    - go
    - typescript
    - python
  core_model:
    aggregate_roots:
      - Rule
    statement: >-
      Rule is the sole aggregate root. Other domain concepts are immutable
      values, evaluation results, roles, operations, or distribution constructs.
  authority:
    statement: >-
      This document records the desired ArcLint domain. Existing code is
      migration evidence rather than design authority.

source_checklist:
  - source: docs/agents/refactoring.md
    informed:
      - every term has an owner, invariants, lifecycle, construction rules, and intended methods
      - invalid domain values must not be constructible
  - source: internal/patterns/builtin/ddd-flat/rules.yaml
    informed:
      - domain contains aggregate roots, entities, values, and repository ports
      - application use cases coordinate domain objects through ports
      - infrastructure contains outbound technology adapters
      - delivery contains inbound adapters
      - composition roots select and connect concrete adapters
  - source: ArcLint domain grilling and follow-up modeling
    informed:
      - Pattern is the distributable form of a collection of Rules
      - Rule Type is a finite ArcLint-owned enum
      - Extensions do not create new Rule Types
      - Baseline is a point-in-time snapshot rather than an aggregate
      - Rule is the only accepted aggregate root
  - source: current ArcLint implementation
    status: migration-evidence-only
    informed:
      - existing Rule evaluation, language-fact, diagnostic, extension, and baseline behavior
    consulted_facts:
      - fact: a Module membership glob that names a directory claims the directory's whole subtree
        from: internal/engine/context.go (matchAny)
        why: the v2 documents state Module membership selectors without defining subtree semantics
      - fact: a consumes allow-list implicitly permits the Rule's own Module; Go import targets resolve through the target directory's file-module union
        from: internal/engine/rules_consumes.go, internal/engine/context.go
        why: rules.v2.yaml consumes contracts are only coherent under these semantics, which no v2 document spells out
      - fact: layers order highest first; protection is importer-centric over any of the importer's Modules; cycles are strongly connected components
        from: internal/engine/rules_consumes.go
        why: the v2 documents name the kinds but not their evaluation mechanics
      - fact: the naming case vocabulary is kebab-case, snake_case, camelCase, PascalCase, plus regex alternatives (ls-lint convention)
        from: internal/engine/rules_invariants.go
        why: rules.v2.yaml uses only snake_case; the finite published vocabulary needed a source
      - fact: baseline entries carry counts for duplicate identical findings and no timestamps, so regeneration diffs only when findings change
        from: internal/engine/baseline.go
        why: the v2 Baseline term requires stable identities but is silent on duplicates and determinism
      - fact: exit codes are 0 clean, 1 error-severity findings, 2 configuration or usage error
        from: cmd/arclint/main.go
        why: the v2 documents do not define the CLI exit contract
      - fact: the walker always skips .git, .hg, .svn, .arclint, vendor, node_modules, and testdata unless included, and never follows symlinks
        from: internal/tree/tree.go
        why: the v2 scan policy lists user excludes only, not the built-in skip set
      - fact: Go import classification follows toolchain semantics — embedded `go list std` table, module-path ownership, replace directives (go.work over go.mod), require coverage, longest-prefix match
        from: internal/lang/golang/resolver.go
        why: Language Facts must classify honestly; the mechanics belong to the Go toolchain, not to either ArcLint architecture
      - fact: the published expression vocabulary is `file` with path, name, stem, ext, dir, module, lines, size, imports, type-checked to a bool at compile time
        from: internal/exprenv/exprenv.go
        why: rules.v2.yaml attests only `file.lines`; the full attribute set is the expression language repositories already write against

language_policy:
  capitalization: Canonical domain terms are capitalized when used with the meanings below.
  rules:
    - Say Rule when referring to one independently identifiable lint rule.
    - Say Pattern when referring to Rules dressed for distribution.
    - Say File, Folder, or Module instead of repository artifact.
    - Communicate Severity independently from Assurance and Evidence Method.
    - Never report conformance when evaluation was unsupported, undetermined, or failed.
  noncanonical_terms:
    - term: Ruleset
      replacement: Pattern or Rules
      reason: A distributed collection is a Pattern; otherwise they are simply Rules.
    - term: Architecture aggregate
      replacement: Rule, Pattern, Module, and Applicability
      reason: Architecture is useful prose but is not an ArcLint aggregate or entity.
    - term: Repository Configuration aggregate
      replacement: configured Rules, Modules, and vocabulary
      reason: Configuration is an external representation, not a domain object with identity and lifecycle.
    - term: Rule Type Registry
      replacement: Rule Type
      reason: Rule Type is a finite enum owned by ArcLint, not an extensible aggregate.
    - term: Pattern Application
      replacement: Pattern, Rule, Module, and Applicability
      reason: Applying Rules does not create another domain object.
    - term: Rule Selection
      replacement: configured Rules
      reason: ArcLint does not model a separate selection object.
    - term: Repository Artifact
      replacement: File, Folder, or Module
      reason: It hides the concrete Rule Subject.
    - term: Architecture Contract
      replacement: Rule or Claim
      reason: Contract is not the accepted core term.
    - term: Exception
      replacement: Rule Exclusion, Diagnostic Suppression, Rule Disablement, or Baseline
      reason: Exception combines decisions with different effects.

actors:
  - name: ArcLint Maintainer
    responsibilities:
      - owns the finite Rule Type enum and common Rule Schema
      - owns normalized Language Facts and deterministic evaluation behavior
  - name: Rule Author
    responsibilities:
      - defines a Rule, its Claim, Applicability, parameters, enforcement, and tests
      - may keep a Rule repository-local or distribute it in a Pattern
  - name: Pattern Author
    responsibilities:
      - packages tested Rules, Extensions, coverage, and vocabulary for distribution
  - name: Pattern Consumer
    aliases:
      - Repository Owner
    responsibilities:
      - chooses and configures Rules
      - maps Files and Folders into Modules
      - owns exclusions, suppressions, disablements, Baselines, and Project Vocabulary
  - name: Extension Author
    responsibilities:
      - supplies enforcement logic through the shared Extension SDK
      - does not add new values to the Rule Type enum
  - name: Contributor
    responsibilities:
      - changes repository code and responds to ArcLint Diagnostics
  - name: Coding Agent
    responsibilities:
      - consumes the same context and Diagnostics available to humans
      - may draft code or Rule configuration but cannot approve architectural decisions

terms:
  - name: Rule
    kind: Aggregate Root
    owner: Rule Author
    definition: >-
      One independently identifiable lint rule that states a Claim and defines
      where and how ArcLint attempts to evaluate it.
    owns:
      - Rule ID
      - Rule Type
      - Claim
      - Applicability
      - Severity
      - Rule parameters
      - Rule Schema
      - Enforcement descriptions
      - Rule Tests
      - Rule Exclusions
      - Diagnostic Suppressions
      - Rule Disablement
      - Pattern provenance when distributed
    invariants:
      - Every Rule has an explicit stable Rule ID.
      - Rule Type is one value from ArcLint's finite enum.
      - Claim states one coherent architectural proposition.
      - Applicability is explicit and inspectable.
      - Parameters validate for the Rule Type.
      - Severity is independent from Assurance and Evidence Method.
      - Enforcement declares supported languages, required facts, assurance, and limitations.
      - Unsupported or undetermined evaluation never becomes implicit conformance.
      - A material Claim change requires a new Rule ID.
    lifecycle:
      - defined
      - validated
      - enabled and evaluated repeatedly
      - optionally configured, excluded, suppressed, or disabled
      - optionally distributed in a Pattern
      - deprecated or replaced
    construction_rules:
      - Require Rule ID, Rule Type, Claim, Applicability, Severity, and valid parameters.
      - Require tested enforcement or explicit advisory behavior.
      - Reject the complete Rule when any owned value is invalid.
    intended_methods:
      - name: applies_to
        intent: Decide whether a File, Folder, or Module is a Rule Subject.
      - name: validate
        intent: Prove that the complete Rule satisfies its invariants.
      - name: configure
        intent: Produce a valid repository-specific Rule without changing its identity.
      - name: exclude
        intent: Remove selected subjects from Applicability.
      - name: suppress
        intent: Retain matching Violations while changing their reporting or gate effect.
      - name: disable
        intent: Prevent evaluation of this Rule for the repository.

  - name: Rule ID
    kind: Value Object
    owner: Rule
    definition: The stable identity of one Rule.
    invariants:
      - Is non-empty and collision-safe within its namespace.
      - Never derives durable identity from array position.
      - Does not include Pattern version.
    lifecycle:
      - assigned when the Rule is defined
      - retained while the Claim remains materially the same
      - replaced when the Claim becomes a different Rule
    construction_rules:
      - Supply an explicit local identity and namespace when distributed.
    intended_methods:
      - name: qualifies
        intent: Return the namespaced identity when provenance requires it.
      - name: equals
        intent: Compare Rule identity without comparing mutable configuration.

  - name: Rule Type
    kind: Enum
    owner: ArcLint Maintainer
    definition: >-
      One value from the finite ArcLint-owned set of supported Rule shapes.
      Pattern and Extension authors configure existing values; they do not add new ones.
    invariants:
      - The allowed set is finite and published by ArcLint.
      - Each value has deterministic parameter validation and schema generation.
      - Extension behavior uses an ArcLint-defined Rule Type rather than registering a new type.
    lifecycle:
      - introduced by an ArcLint release
      - used by Rules
      - evolved compatibly or deprecated by ArcLint
    construction_rules:
      - Accept only a published enum value.
    intended_methods:
      - name: accepts
        intent: Decide whether parameters are valid for this Rule Type.
      - name: schema
        intent: Return the complete schema contribution for this Rule Type.

  - name: Rule Schema
    kind: Value Object
    owner: Rule
    definition: >-
      The machine-readable description used to configure, validate, inspect,
      and autocomplete a complete Rule.
    invariants:
      - Covers common Rule fields and Rule-Type-specific parameters.
      - Runtime validation and published editor schema accept the same values.
      - Declares which fields may be configured or overridden.
    lifecycle:
      - derived from ArcLint's Rule model and finite Rule Type
      - exposed to editors, humans, and agents
      - replaced when the accepted Rule shape changes
    construction_rules:
      - Include required fields, defaults, enum values, and configuration permissions.
    intended_methods:
      - name: validate
        intent: Validate a complete Rule representation.
      - name: describe
        intent: Explain accepted Rule configuration.

  - name: Claim
    kind: Value Object
    owner: Rule
    definition: The architectural proposition a Rule attempts to evaluate.
    invariants:
      - States one coherent proposition in domain language.
      - Describes required truth rather than parser or traversal mechanics.
    lifecycle:
      - stated with the Rule
      - evaluated repeatedly without mutation
      - replaced only when the Rule meaning changes
    construction_rules:
      - Require a non-empty, intention-revealing statement.
    intended_methods:
      - name: describe
        intent: Explain what the Rule requires.

  - name: Applicability
    kind: Value Object
    owner: Rule
    definition: >-
      Composable criteria selecting the Files, Folders, or Modules evaluated by a Rule.
    invariants:
      - May select an entire repository, a language, a file type, paths, Modules, or available code facts.
      - Different selector dimensions intersect unless explicitly defined otherwise.
      - Multiple values in one selector dimension form a union.
      - Rule Exclusions remove only their selected subjects.
    lifecycle:
      - defined with the Rule
      - optionally narrowed through configuration or exclusion
      - evaluated without mutation
    construction_rules:
      - Use only selectors supported by the Rule Schema.
      - Remain inspectable and explainable.
    intended_methods:
      - name: selects
        intent: Decide whether a candidate is a Rule Subject.
      - name: excluding
        intent: Return Applicability with selected subjects removed.

  - name: Rule Subject
    kind: Role
    owner: Rule
    definition: A concrete File, Folder, or Module selected by Rule Applicability.
    invariants:
      - Is always one concrete File, Folder, or Module.
      - A Programming Language filters Applicability but is not a Rule Subject.
      - May be evaluated by many Rules and belong to multiple Modules.
    lifecycle:
      - selected
      - evaluated or explicitly not evaluated
      - referenced by resulting Diagnostics
    construction_rules:
      - Require a repository-relative path or Module name.
    intended_methods:
      - name: identity
        intent: Return the stable value used in evaluations and diagnostics.

  - name: Module
    kind: Value Object
    owner: Pattern Consumer
    definition: A named logical grouping of Files, Folders, and optionally other Modules.
    invariants:
      - Uses a non-empty repository-local name.
      - May overlap other Modules.
      - Membership does not imply exclusive ownership.
      - Module containment is acyclic.
    lifecycle:
      - defined in repository configuration
      - resolved during a check
      - replaced when its definition changes
    construction_rules:
      - Supply a name and at least one membership selector.
      - Reject cyclic containment.
    intended_methods:
      - name: contains
        intent: Determine direct or transitive membership.

  - name: Programming Language
    kind: Enum
    owner: ArcLint Maintainer
    definition: A source language ArcLint recognizes and can analyze.
    invariants:
      - Recognition does not imply coverage by every Rule.
      - Each value declares which normalized Language Facts ArcLint can provide.
    lifecycle:
      - added by an ArcLint release
      - observed during repository analysis
      - evolved through fact capabilities
    construction_rules:
      - Accept only a language supported by the running ArcLint version.
    intended_methods:
      - name: available_facts
        intent: Report facts available for the language.

  - name: Language Facts
    kind: Value Object
    owner: ArcLint Maintainer
    definition: >-
      An immutable normalized description of source declarations, imports, and
      related code facts available to Rule enforcement.
    invariants:
      - Shared concepts use the same shape across supported languages.
      - A language reports only facts it can support honestly.
      - Parse failure is distinguishable from a genuine empty result.
      - Facts describe observed code and never intended architecture.
    lifecycle:
      - derived from a File
      - consumed during evaluation
      - discarded or cached without changing meaning
    construction_rules:
      - Identify the File and Programming Language.
      - Record unavailable facts and analysis failures explicitly.
    intended_methods:
      - name: supports
        intent: State whether a requested fact is available.
      - name: declarations
        intent: Return normalized declarations.
      - name: imports
        intent: Return normalized imports when available.

  - name: Enforcement
    kind: Value Object
    owner: Rule
    definition: >-
      A description of how one Rule is evaluated for declared programming
      languages using stated facts, evidence, assurance, and limitations.
    invariants:
      - Belongs to exactly one Rule.
      - Declares supported languages and required Language Facts.
      - Declares Evidence Method, Assurance, and limitations independently from Severity.
      - Missing prerequisites cannot produce conformance.
    lifecycle:
      - authored with the Rule
      - validated and tested
      - selected when compatible
      - used to perform evaluations
    construction_rules:
      - Require language coverage, fact requirements, evidence, assurance, and behavior reference.
    intended_methods:
      - name: supports
        intent: Determine compatibility with a language and available facts.
      - name: evaluate
        intent: Produce one evidence-qualified Rule Evaluation.

  - name: Extension
    kind: Enforcement Mechanism
    owner: Extension Author
    definition: >-
      TypeScript enforcement logic used by configured Rules through ArcLint's
      shared Extension SDK. An Extension does not create a new Rule Type.
    invariants:
      - Uses the same SDK for Go, TypeScript, Python, and future languages.
      - Operates only through deterministic host capabilities.
      - Cannot bypass Rule validation or diagnostic truthfulness.
      - Declares required Language Facts and known limitations.
    lifecycle:
      - authored
      - referenced by a Rule
      - validated and tested
      - executed when compatible
    construction_rules:
      - Use ArcLint's Extension SDK and a finite ArcLint Rule Type.
      - Supply the Rule-specific schema and enforcement metadata required by that Rule Type.
    intended_methods:
      - name: evaluate
        intent: Evaluate its Rule without ambient repository mutation.

  - name: Evidence Method
    kind: Value Object
    owner: Enforcement
    definition: How Enforcement obtained the evidence used for an evaluation.
    invariants:
      - Is independent from Severity and Assurance.
      - Names the actual evidence without overstating semantic knowledge.
    lifecycle:
      - declared with Enforcement
      - copied into evaluations and Diagnostics
      - replaced when the enforcement approach changes
    construction_rules:
      - Identify the actual evidence source.
    intended_methods:
      - name: describe
        intent: Explain how ArcLint reached its conclusion.

  - name: Assurance
    kind: Enum
    owner: Enforcement
    definition: The strength of conclusion justified by Enforcement evidence.
    values:
      exact: Fully decides the Claim within a documented analysis limit.
      partial: Reported Violations are trustworthy but some may be unobservable.
      heuristic: May produce false positives or false negatives.
      advisory: Communicates guidance without automated truth judgment.
    invariants:
      - Is independent from Rule Severity.
      - Unsupported is an Evaluation Outcome rather than an Assurance value.
    lifecycle:
      - declared with Enforcement
      - attached to evaluations and Diagnostics
      - replaced when evidence strength changes
    construction_rules:
      - Choose the weakest value consistent with known limitations.
    intended_methods:
      - name: permits_conformance
        intent: Decide whether absence of a Violation can justify conformance.

  - name: Severity
    kind: Enum
    owner: Rule
    definition: The configured linter importance of a Rule Violation.
    values:
      error: Fails the configured gate.
      warning: Requires attention without failing the default gate.
      info: Communicates lower-priority guidance.
    invariants:
      - Is independent from Assurance and Evidence Method.
      - Contains only error, warning, or info.
    lifecycle:
      - assigned to a Rule
      - optionally configured when permitted
      - attached to Violations
    construction_rules:
      - Accept only a defined enum value.
    intended_methods:
      - name: fails_gate
        intent: Decide whether an active Violation fails the gate.

  - name: Rule Test
    kind: Value Object
    owner: Rule
    definition: >-
      A deterministic fixture scenario and complete expected Diagnostics for one Rule.
    invariants:
      - Identifies its Rule.
      - Asserts the complete result rather than one convenient Diagnostic.
      - Includes conforming and violating cases when the Rule can decide both.
    lifecycle:
      - authored with a Rule
      - run during Rule and Pattern validation
      - replaced when intended behavior changes
    construction_rules:
      - Supply inputs, configuration, and complete expected Diagnostics.
    intended_methods:
      - name: compare
        intent: Detect missing, unexpected, or duplicate Diagnostics.

  - name: Pattern
    kind: Distribution Construct
    owner: Pattern Author
    definition: >-
      A named, versioned, namespaced, and tested collection of Rules dressed for distribution.
    contains:
      - Rules
      - Rule Tests
      - declared language coverage
      - optional Extensions
      - optional vocabulary
      - optional Module suggestions
    invariants:
      - A published version is immutable.
      - Every included Rule retains its own Rule ID.
      - Declared language coverage reflects actual Enforcement.
      - Required Rule Tests pass before distribution.
      - Pattern order creates no implicit Rule precedence.
    lifecycle:
      - assembled from valid Rules
      - validated and tested
      - versioned and distributed
      - referenced or replaced by a later version
    construction_rules:
      - Require namespace, name, version, and at least one valid Rule.
      - Record coverage, tests, provenance, and dependencies.
    intended_methods:
      - name: rules
        intent: Return the Rules carried by the Pattern.
      - name: validate
        intent: Validate identity, Rules, tests, coverage, and dependencies.

  - name: Pattern Reference
    kind: Value Object
    owner: Pattern Consumer
    definition: An exact repository-owned reference to one distributed Pattern version.
    invariants:
      - Includes namespace, name, and version.
      - Resolves deterministically.
    lifecycle:
      - declared
      - resolved
      - replaced explicitly when the desired version changes
    construction_rules:
      - Require namespace, name, and exact or deterministically resolvable version.
    intended_methods:
      - name: resolve
        intent: Identify the exact Pattern.

  - name: Rule Override
    kind: Value Object
    owner: Pattern Consumer
    definition: A repository-local permitted change to a Pattern-supplied Rule.
    invariants:
      - Preserves Rule ID and published Pattern content.
      - Changes only fields allowed by the Rule Schema.
    lifecycle:
      - declared
      - validated and applied during Rule configuration
      - replaced or removed explicitly
    construction_rules:
      - Identify the Rule and changed fields.
    intended_methods:
      - name: apply
        intent: Produce a valid configured Rule.

  - name: Rule Exclusion
    kind: Value Object
    owner: Pattern Consumer
    definition: A decision removing selected Files, Folders, or Modules from one Rule's Applicability.
    invariants:
      - Applies to exactly one Rule.
      - Does not affect unrelated subjects or Rules.
      - Produces not-applicable rather than a Violation.
    lifecycle:
      - declared
      - applied before evaluation
      - replaced or removed explicitly
    construction_rules:
      - Identify one Rule and at least one concrete subject selector.
    intended_methods:
      - name: excludes
        intent: Decide whether a candidate is outside Rule Applicability.

  - name: Diagnostic Suppression
    kind: Value Object
    owner: Pattern Consumer
    definition: >-
      A decision retaining a produced Violation while removing its configured
      reporting or gate effect for selected subjects.
    invariants:
      - Does not change Applicability or Evaluation Outcome.
      - Does not turn a Violation into conformance.
      - Does not affect unrelated Rules or subjects.
    lifecycle:
      - declared
      - matched after evaluation
      - replaced or removed explicitly
    construction_rules:
      - Identify the Rule and diagnostic scope.
    intended_methods:
      - name: matches
        intent: Decide whether a Violation is suppressed.

  - name: Rule Disablement
    kind: Value Object
    owner: Pattern Consumer
    definition: A decision preventing one Rule from being evaluated for the repository.
    invariants:
      - Identifies exactly one Rule.
      - Keeps the Rule and Pattern provenance inspectable.
    lifecycle:
      - declared
      - applied before evaluation
      - replaced or removed explicitly
    construction_rules:
      - Identify one existing Rule.
    intended_methods:
      - name: disables
        intent: Decide whether the Rule must be skipped.

  - name: Baseline
    kind: Snapshot Value Object
    owner: Pattern Consumer
    definition: >-
      An immutable point-in-time record of the Rules applied and the Violations
      observed during one Conformance Check, used to distinguish existing findings from later ones.
    contains:
      - captured Rule identities
      - Baseline Entries for observed Violations
      - capture identity or timestamp
    invariants:
      - Records which Rules produced the captured findings.
      - Never adds later Violations automatically.
      - Never changes Rule Applicability or architectural truth.
      - A finding identity does not depend solely on source line.
    lifecycle:
      - captured from one completed Conformance Check
      - compared with later assessments
      - replaced explicitly by another snapshot
    construction_rules:
      - Capture the applied Rule identities and existing Violations together.
      - Reject partial or ambiguous finding identities.
    intended_methods:
      - name: covers
        intent: Decide whether a current Violation was present in this snapshot.
      - name: stale_entries
        intent: Return captured findings absent from a later assessment.

  - name: Baseline Entry
    kind: Value Object
    owner: Baseline
    definition: The stable fingerprint of one Violation captured in a Baseline.
    invariants:
      - Identifies Rule, subject, and message meaning.
      - Does not depend solely on source line.
    lifecycle:
      - captured in a Baseline
      - matched or found stale during comparison
      - discarded with its Baseline
    construction_rules:
      - Require Rule ID, subject identity, and stable message identity.
    intended_methods:
      - name: matches
        intent: Decide whether a current Violation is the captured finding.

  - name: Conformance Check
    kind: Domain Operation
    owner: ArcLint Maintainer
    definition: >-
      The deterministic operation that evaluates applicable enabled Rules against repository observations.
    invariants:
      - Evaluates every applicable enabled Rule or records why it could not.
      - Applies Rule Exclusions before evaluation.
      - Applies suppressions and Baseline comparison after evaluation.
      - Does not write or refactor application source code.
      - Produces deterministic ordering.
    lifecycle:
      - receives configured Rules and repository observations
      - evaluates Rules
      - produces one Conformance Assessment
      - ends
    construction_rules:
      - Require valid Rules and deterministic observations.
    intended_methods:
      - name: run
        intent: Produce one complete Conformance Assessment.

  - name: Rule Evaluation
    kind: Value Object
    owner: Conformance Check
    definition: One evidence-qualified attempt to evaluate a Rule for one Rule Subject.
    invariants:
      - Identifies exactly one Rule and one Rule Subject.
      - Has exactly one Evaluation Outcome.
      - Records Evidence Method, Assurance, limitations, and Diagnostics.
    lifecycle:
      - created during a check
      - completed with one outcome
      - retained in the resulting assessment
    construction_rules:
      - Require Rule ID, subject, Enforcement, evidence, and outcome.
    intended_methods:
      - name: diagnostics
        intent: Return Diagnostics produced by the evaluation.

  - name: Evaluation Outcome
    kind: Enum
    owner: Rule Evaluation
    definition: The honest conclusion of one Rule Evaluation.
    values:
      conforms: Sufficient evaluation found no violation within its declared limit.
      violates: Sufficient evidence proves the Claim is broken.
      suspected_violation: Heuristic evidence indicates a possible violation.
      undetermined: Available evidence cannot justify conformance or violation.
      unsupported: Required enforcement or Language Facts are unavailable.
      not_applicable: Applicability or exclusion removes the subject.
      failed: Evaluation could not complete correctly.
    invariants:
      - Exactly one value completes an evaluation.
      - Only sufficient evidence may produce conforms or violates.
    lifecycle:
      - assigned when evaluation completes
      - immutable thereafter
    construction_rules:
      - Derive only from actual evidence and declared Assurance.
    intended_methods:
      - name: requires_diagnostic
        intent: Decide whether the outcome must be surfaced.

  - name: Diagnostic
    kind: Value Object
    owner: ArcLint Maintainer
    definition: A user-visible result produced while loading, evaluating, or explaining conformance.
    variants:
      - Violation
      - operational
      - coverage
    invariants:
      - Identifies its kind, message, and provenance.
      - Uses warning only as a Severity value.
      - Provides enough context to understand cause and effect.
    lifecycle:
      - produced
      - reported
      - absent from a later assessment when its cause disappears
    construction_rules:
      - Require kind, stable message identity, and available provenance.
    intended_methods:
      - name: explain
        intent: Describe cause, evidence, impact, and remediation context.

  - name: Violation
    kind: Diagnostic Value
    owner: Rule Evaluation
    definition: >-
      A Diagnostic reporting that a Rule Claim is violated or suspected to be violated for one subject.
    invariants:
      - References exactly one Rule and one Rule Subject.
      - Carries Severity independently from Assurance.
      - Remains a Violation when suppressed or covered by a Baseline.
    lifecycle:
      - produced by an evaluation
      - reported as active, suppressed, or baselined
      - absent when a later evaluation no longer produces it
    construction_rules:
      - Require Rule ID, subject, outcome, Severity, evidence, assurance, and message.
    intended_methods:
      - name: fingerprint
        intent: Produce stable identity for suppression and Baseline comparison.

  - name: Conformance Assessment
    kind: Result Value
    owner: Conformance Check
    definition: >-
      The immutable complete result of one Conformance Check.
    contains:
      - Rule Evaluations
      - Diagnostics
      - applied Rule identities
      - suppression and Baseline status
    invariants:
      - Preserves unsupported, undetermined, not-applicable, and failed evaluations.
      - Preserves Rule and Pattern provenance.
      - Passing the gate does not imply every Rule conformed.
      - Ordering is deterministic.
    lifecycle:
      - produced by one check
      - rendered or inspected
      - replaced by a later assessment
    construction_rules:
      - Include every relevant evaluation and Diagnostic.
      - Record the applied Rule identities.
    intended_methods:
      - name: has_errors
        intent: Decide whether active error-severity Violations fail the gate.
      - name: diagnostics
        intent: Return all Diagnostics with their status.

  - name: Architectural Context
    kind: Projection Value
    owner: ArcLint Maintainer
    definition: >-
      A human- and agent-readable view of the Rules, Modules, vocabulary,
      applicability reasons, and known conformance state for a selected scope.
    invariants:
      - Uses the same facts for humans and coding agents.
      - Distinguishes intended Rules from observed code.
      - Explains why each Rule applies.
    lifecycle:
      - projected for a selected scope
      - inspected
      - replaced when inputs change
    construction_rules:
      - Require a concrete scope and the Rules and Modules relevant to it.
    intended_methods:
      - name: explain
        intent: Explain applicable Rules and their reasons.

  - name: Vocabulary
    kind: Value Object
    owner: ArcLint Maintainer, Pattern Author, or Pattern Consumer
    definition: >-
      A scoped collection of canonical terms and meanings used by ArcLint,
      a Pattern, or one repository.
    scopes:
      - product
      - pattern
      - project
    invariants:
      - Every term has one canonical meaning within its scope.
      - Pattern vocabulary cannot silently redefine product vocabulary.
      - Project vocabulary belongs to the repository owner.
    lifecycle:
      - authored
      - validated and shared
      - revised explicitly as language changes
    construction_rules:
      - Require scope, canonical term, definition, and owner.
    intended_methods:
      - name: define
        intent: Add or replace a term explicitly within the vocabulary scope.
      - name: explain
        intent: Return the canonical meaning of a term.
