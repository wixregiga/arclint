schema_version: "1.0"
document: arclint-codebase-scaffold
status: implemented  # switchover completed 2026-08-17; this scaffold is now the live layout

references:
  domain_vocabulary: docs/domain-vocabulary-v2.yaml
  executable_rules: rules.v2.yaml
  pattern_source: internal/patterns/builtin/ddd-flat/rules.yaml

purpose: >-
  Define the target package scaffold and mechanically enforceable rules for a
  future ArcLint refactor without treating the current package layout as design authority.

model:
  aggregate_roots:
    - name: Rule
      package: internal/domain/rule
      root_file: internal/domain/rule/root.go
  non_aggregate_domain_values:
    - Baseline
    - Conformance Assessment
    - Module
    - Pattern
  decisions:
    - Rule is the sole aggregate root.
    - Rule Type is a finite ArcLint-owned enum.
    - Pattern is a versioned distribution construct containing Rules.
    - Baseline is an immutable point-in-time snapshot.
    - Conformance Assessment is an immutable result.
    - Extensions provide enforcement logic and never add Rule Type enum values.

modules:
  domain:
    paths:
      - internal/domain/**
    description: Rule aggregate and domain values used to evaluate repository conformance.
    may_import:
      internal: []
      external: []
      standard_library: true
    rules:
      - Only Rule is an aggregate root.
      - Invalid Rules cannot be constructed.
      - Domain code contains no delivery, infrastructure, filesystem, parser, or serialization technology.

  application:
    paths:
      - internal/application/**
    description: Action-named use cases coordinating domain objects through ports.
    may_import:
      internal:
        - domain
      external: []
      standard_library: true
    rules:
      - Each source file is named for an application action.
      - Use cases accept ports rather than constructing outbound Adapters.
      - Use cases accept plain request values and return plain result values.
      - Use cases do not import delivery or infrastructure.
      - A port begins beside the use case that owns its requirements.
      - A port is promoted only after multiple use cases need the same Interface.

  infrastructure:
    paths:
      - internal/infrastructure/**
    description: Outbound technology Adapters for application and domain ports.
    may_import:
      internal:
        - application
        - domain
      external: any
      standard_library: true
    rules:
      - Contains outbound Adapters only.
      - Does not import delivery.
      - Does not own Rule invariants or application orchestration.
      - Translates technology representations into values owned inward.

  delivery:
    paths:
      - internal/delivery/**
    description: Inbound Adapters translating CLI input into application use-case requests.
    may_import:
      internal:
        - application
        - domain
      external: any
      standard_library: true
    rules:
      - Contains inbound Adapters only.
      - Does not import infrastructure.
      - Does not contain Rule invariants or application orchestration.
      - Cobra types never cross the sealed CLI Interface.

  composition:
    paths:
      - cmd/**
    description: Process entrypoints selecting and connecting concrete inbound and outbound Adapters.
    may_import:
      internal:
        - delivery
        - infrastructure
        - application
        - domain
      external: any
      standard_library: true
    rules:
      - Selects concrete Adapters and supplies them to use cases.
      - Contains no Rule behavior or use-case orchestration.
      - Is the only Module allowed to import general infrastructure packages.

dependency_direction:
  source_imports:
    - from: application
      to: domain
    - from: infrastructure
      to: application
    - from: infrastructure
      to: domain
    - from: delivery
      to: application
    - from: delivery
      to: domain
    - from: composition
      to: delivery
    - from: composition
      to: infrastructure
    - from: composition
      to: application
    - from: composition
      to: domain
  forbidden:
    - domain importing application, infrastructure, delivery, or composition
    - application importing infrastructure, delivery, or composition
    - infrastructure importing delivery or composition
    - delivery importing infrastructure or composition
    - cycles between any declared Modules

scaffold:
  - path: internal/domain/rule/root.go
    package: rule
    responsibility: Rule aggregate root, validated construction, and aggregate-level behavior.
  - path: internal/domain/rule/id.go
    package: rule
    responsibility: Stable Rule ID value.
  - path: internal/domain/rule/type.go
    package: rule
    responsibility: Finite Rule Type enum and type-specific validation dispatch.
  - path: internal/domain/rule/schema.go
    package: rule
    responsibility: Complete Rule Schema value and validation behavior.
  - path: internal/domain/rule/claim.go
    package: rule
    responsibility: Intention-revealing Claim value.
  - path: internal/domain/rule/applicability.go
    package: rule
    responsibility: Composable Rule Subject selection.
  - path: internal/domain/rule/severity.go
    package: rule
    responsibility: Error, warning, and info Severity enum.
  - path: internal/domain/rule/enforcement.go
    package: rule
    responsibility: Language support, fact requirements, evidence, assurance, and limitations.
  - path: internal/domain/rule/exclusion.go
    package: rule
    responsibility: Rule Exclusion and Rule Disablement values.
  - path: internal/domain/rule/suppression.go
    package: rule
    responsibility: Diagnostic Suppression value.
  - path: internal/domain/rule/test.go
    package: rule
    responsibility: Deterministic Rule Test fixtures and expected Diagnostics.
  - path: internal/domain/rule/pattern.go
    package: rule
    responsibility: Versioned Pattern distribution construct containing Rules.
  - path: internal/domain/rule/repository.go
    package: rule
    responsibility: Domain-owned persistence port for complete Rule aggregates.

  - path: internal/domain/baseline/snapshot.go
    package: baseline
    responsibility: Immutable Baseline snapshot of applied Rules and observed Violations.
  - path: internal/domain/baseline/entry.go
    package: baseline
    responsibility: Stable Baseline Entry fingerprint value.

  - path: internal/domain/conformance/check.go
    package: conformance
    responsibility: Deterministic Rule evaluation operation over supplied observations.
  - path: internal/domain/conformance/assessment.go
    package: conformance
    responsibility: Immutable complete Conformance Assessment result.
  - path: internal/domain/conformance/evaluation.go
    package: conformance
    responsibility: Evidence-qualified Rule Evaluation value.
  - path: internal/domain/conformance/outcome.go
    package: conformance
    responsibility: Finite Evaluation Outcome enum.
  - path: internal/domain/conformance/diagnostic.go
    package: conformance
    responsibility: Immutable Diagnostic value and diagnostic kind.
  - path: internal/domain/conformance/violation.go
    package: conformance
    responsibility: Violation value and stable fingerprint behavior.

  - path: internal/application/list_rules.go
    package: application
    responsibility: List available configured Rules through a read port.
  - path: internal/application/show_rule.go
    package: application
    responsibility: Show one Rule, its schema, provenance, and enforcement limitations.
  - path: internal/application/assess_conformance.go
    package: application
    responsibility: Coordinate observations, configured Rules, Baseline, and Conformance Check.
  - path: internal/application/explain_rule.go
    package: application
    responsibility: Explain a Rule in human- and agent-readable form.
  - path: internal/application/capture_baseline.go
    package: application
    responsibility: Capture a Baseline from one completed assessment through an output port.
  - path: internal/application/refresh_baseline.go
    package: application
    responsibility: Replace a Baseline after explicit comparison with a later assessment.
  - path: internal/application/list_patterns.go
    package: application
    responsibility: List available Pattern distribution packages through a source port.
  - path: internal/application/load_pattern.go
    package: application
    responsibility: Resolve and validate one Pattern distribution package.
  - path: internal/application/initialize_repository.go
    package: application
    responsibility: Draft repository Rule and Module configuration from explicit choices.
  - path: internal/application/get_architectural_context.go
    package: application
    responsibility: Project Rules, reasons, Modules, vocabulary, and known results for one scope.

  - path: internal/infrastructure/rule/yaml/
    package: yamlrule
    responsibility: Load and save complete Rule aggregates using YAML representations.
  - path: internal/infrastructure/pattern/embedded/
    package: embeddedpattern
    responsibility: Supply built-in Pattern packages embedded in the binary.
  - path: internal/infrastructure/pattern/filesystem/
    package: filesystempattern
    responsibility: Supply local Pattern packages from the filesystem.
  - path: internal/infrastructure/baseline/json/
    package: jsonbaseline
    responsibility: Load and write immutable Baseline snapshots as JSON.
  - path: internal/infrastructure/language/golang/
    package: golang
    responsibility: Produce normalized Language Facts for Go.
  - path: internal/infrastructure/language/typescript/
    package: typescript
    responsibility: Produce normalized Language Facts for TypeScript and TSX.
  - path: internal/infrastructure/language/python/
    package: python
    responsibility: Produce normalized Language Facts for Python.
  - path: internal/infrastructure/extension/sobek/
    package: sobekextension
    responsibility: Execute TypeScript Rule enforcement through the Extension SDK.

  - path: internal/delivery/cli/cli.go
    package: cli
    responsibility: ArcLint-owned CLI Interface, Invocation, Outcome, and Adapter selector.
  - path: internal/delivery/cli/command.go
    package: cli
    responsibility: Framework-neutral command descriptions and handler shapes.
  - path: internal/delivery/cli/rules.go
    package: cli
    responsibility: Adapt Rule use cases into CLI commands.
  - path: internal/delivery/cli/conformance.go
    package: cli
    responsibility: Adapt conformance use cases and presentations into CLI commands.
  - path: internal/delivery/cli/baseline.go
    package: cli
    responsibility: Adapt Baseline use cases into CLI commands.
  - path: internal/delivery/cli/factory/factory.go
    package: clifactory
    responsibility: Select a sealed CLI Adapter by ArcLint-owned selector.
  - path: internal/delivery/cli/adapters/cobra/cobra.go
    package: cobraadapter
    responsibility: The only package importing Cobra; translate neutral commands to Cobra.

  - path: cmd/arclint/main.go
    package: main
    responsibility: Select concrete Adapters, construct use cases, select CobraCLI, and run the process.

seams:
  rule_repository:
    interface_owner: internal/domain/rule/repository.go
    adapters:
      - internal/infrastructure/rule/yaml/
    rule: Repository returns complete valid Rule aggregates, never representation structs.
  repository_observation:
    interface_owner: internal/application/assess_conformance.go
    adapters:
      - internal/infrastructure/language/golang/
      - internal/infrastructure/language/typescript/
      - internal/infrastructure/language/python/
    rule: Use case requests normalized observations without selecting parser technology.
  pattern_source:
    interface_owner: internal/application/load_pattern.go
    adapters:
      - internal/infrastructure/pattern/embedded/
      - internal/infrastructure/pattern/filesystem/
    rule: Pattern sources return validated distribution values.
  baseline_output:
    interface_owner: internal/application/capture_baseline.go
    adapters:
      - internal/infrastructure/baseline/json/
    rule: Output Adapter persists a complete immutable Baseline.
  cli:
    interface_owner: internal/delivery/cli/cli.go
    adapters:
      - internal/delivery/cli/adapters/cobra/
    selection_owner: cmd/arclint/main.go
    rule: Cobra types and imports remain sealed inside the Cobra Adapter.

architecture_rules:
  - id: arclint:domain/rule-is-sole-aggregate
    severity: error
    capability: structural
    statement: Rule is the only aggregate root under internal/domain.
    enforcement: rules.v2.yaml structure invariant plus semantic review of aggregate declarations.
  - id: arclint:domain/stdlib-only
    severity: error
    capability: exact
    statement: Domain imports only the Go standard library.
    enforcement: rules.v2.yaml consumes policy.
  - id: arclint:application/use-cases-through-ports
    severity: error
    capability: structural
    statement: Application use cases coordinate domain objects through accepted ports.
    enforcement: dependency rules plus semantic Rule tests for constructor dependencies.
  - id: arclint:application/action-file-names
    severity: warning
    capability: advisory
    statement: Application source filenames describe actions rather than domain nouns or technical roles.
    enforcement: code review until an intention-aware naming Rule exists.
  - id: arclint:infrastructure/outbound-only
    severity: error
    capability: structural
    statement: Infrastructure contains outbound technology Adapters and never imports delivery.
    enforcement: rules.v2.yaml consumes policy.
  - id: arclint:delivery/inbound-only
    severity: error
    capability: structural
    statement: Delivery contains inbound Adapters and never imports infrastructure.
    enforcement: rules.v2.yaml consumes policy.
  - id: arclint:delivery/cobra-sealed
    severity: error
    capability: structural
    statement: Only internal/delivery/cli/adapters/cobra may import Cobra.
    enforcement: protected Cobra Adapter module plus import Rule test.
  - id: arclint:composition/selects-adapters
    severity: error
    capability: structural
    statement: cmd entrypoints select and connect concrete Adapters without domain behavior.
    enforcement: dependency rules plus semantic review of command implementation.
  - id: arclint:dependencies/acyclic
    severity: error
    capability: exact
    statement: Declared Module dependencies contain no cycle.
    enforcement: rules.v2.yaml acyclic dependency rule.
