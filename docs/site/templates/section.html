{% extends "base.html" %}
{% block title %}{{ section.title }} · {{ config.title }}{% endblock %}
{% block body %}
<div class="layout">
<aside class="toc">
{% for p in section.pages %}<a href="{{ p.permalink }}">{{ p.title }}</a>
{% endfor %}
</aside>
<main>
{{ section.content | safe }}
<table>
{% for p in section.pages %}<tr><td><a href="{{ p.permalink }}">{{ p.title }}</a></td><td>{{ p.description }}</td></tr>
{% endfor %}
</table>
</main>
</div>
{% endblock %}
