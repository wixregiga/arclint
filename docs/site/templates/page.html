{% extends "base.html" %}
{% block title %}{{ page.title }} · {{ config.title }}{% endblock %}
{% block body %}
<div class="layout">
<aside class="toc">
{% set docs = get_section(path="docs/_index.md") %}
{% for p in docs.pages %}<a {% if p.permalink == page.permalink %}class="current" {% endif %}href="{{ p.permalink }}">{{ p.title }}</a>
{% endfor %}
</aside>
<main>
<h1>{{ page.title }}</h1>
{{ page.content | safe }}
</main>
</div>
{% endblock %}
