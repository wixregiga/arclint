version: "2"
run:
  tests: false
linters:
  enable:
    - bodyclose
    - exhaustive
    - goconst
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
  exclusions:
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # Schema construction intentionally repeats published field names
      # and JSON Schema keywords; constants would obscure the declaration.
      - path: internal/domain/rule/schema.go
        linters:
          - goconst
      # Same rationale for the ubiquitous-language schema declaration.
      - path: internal/domain/vocab/schema.go
        linters:
          - goconst
      # The caller-selected repository root is this adapter's intended
      # write boundary; AGENTS.md is joined beneath it before writing.
      - path: internal/infrastructure/agents/markdown/markdown.go
        text: 'G703:'
        linters:
          - gosec
    generated: lax
    presets:
      - common-false-positives
  settings:
    exhaustive:
      default-signifies-exhaustive: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
