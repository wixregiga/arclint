version: "2"
run:
  tests: false
linters:
  enable:
    - bodyclose
    - exhaustive
    - goconst
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
    - iface
    - containedctx
    - contextcheck
    - nolintlint
  exclusions:
    rules:
      - text: '(slog|log)\.\w+'
        linters:
          - noctx
      # Schema construction intentionally repeats published field names
      # and JSON Schema keywords; constants would obscure the declaration.
      - path: internal/domain/rule/schema.go
        linters:
          - goconst
      # Same rationale for the ubiquitous-language schema declaration.
      - path: internal/domain/vocab/schema.go
        linters:
          - goconst
      # The caller-selected repository root is this adapter's intended
      # write boundary; AGENTS.md is joined beneath it before writing.
      - path: internal/infrastructure/agents/markdown/markdown.go
        text: 'G703:'
        linters:
          - gosec
    generated: lax
    presets:
      - common-false-positives
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    iface:
      enable:
        - identical # Identifies interfaces in the same package that have identical method sets.
        - unused # Identifies interfaces that are not used anywhere in the same package where the interface is defined.
        - opaque # Identifies functions that return interfaces, but the actual returned value is always a single concrete implementation.
        - unexported # Identifies interfaces that are not exported but are used in exported functions or methods.
        - unusedmethod # Detects interface methods that are never used anywhere in the same package where they are defined.
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
