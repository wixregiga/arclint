# domain-librarian core reference: DDD vocabulary, distillation rules, clarification protocol.
version: 1

vocabulary:
  domain: Sphere of knowledge/activity the software addresses.
  model: System of abstractions describing selected domain aspects.
  ubiquitous_language: Language structured around the model.
  context: The setting that determines a statement's meaning.
  bounded_context: Explicit boundary within which one model applies.
  context_map: Inventory of all bounded_contexts and their relations.
  core_domain: The business-differentiating heart of the model; keep small.
  generic_subdomain: Supporting area with no differentiation; factor out.
  big_ball_of_mud: Boundary-less mixed-model region; wall it off.
  context_relation: {partnership: succeed/fail together, shared_kernel: small jointly-owned subset, customer_supplier: upstream plans for downstream, conformist: downstream adopts upstream model, anticorruption_layer: downstream translates defensively, open_host_service: upstream exposes one protocol, published_language: shared interchange language, separate_ways: no integration}
  entity: Object defined by identity that persists across attribute change.
  value_object: Immutable, identity-less object describing a characteristic.
  invariant: Consistency rule that must hold at all times within its owner's boundary.
  assertion: Statement of a post-condition of an operation or an invariant.
  aggregate: Cluster of entities + value_objects changed as one unit.
  aggregate_root: The single entry-point entity of an aggregate.
  repository: Collection-like abstraction over storage/retrieval of aggregate roots.
  factory: Encapsulates complex creation.
  domain_service: Stateless domain operation spanning aggregates.
  application_service: Use-case orchestration + transaction boundary; no domain rules.
  domain_event: Record of something that happened, past-tense expert language.
  module: Cohesive package telling the story of one model area.
  business_rule: Umbrella term; always resolves to invariant or assertion, owned by entity/aggregate root (behavior) or value_object (construction).

distillation_rules:
  - {id: identity-test, rule: "Concept keeps its business identity while attributes change -> entity.", example: "order keeps its number when status changes"}
  - {id: value-test, rule: "Two instances with identical values are interchangeable -> value_object.", example: "any two USD 10 amounts are the same money"}
  - {id: invariant-ownership, rule: "Every must-always/must-never statement -> invariant (or assertion); assign exactly one owner.", example: "total = sum of lines -> owner Order root"}
  - {id: transaction-boundary, rule: "Smallest cluster consistent in one transaction -> one aggregate; everything else by ID, eventually.", example: "reject: customer and all orders save together"}
  - {id: homeless-operation, rule: "Logic spanning aggregates or needing external domain knowledge -> domain_service.", example: "DiscountCalculator over Order+Customer"}
  - {id: event-detection, rule: "State change experts say in past tense -> domain_event; technical changes are not events.", example: "OrderConfirmed yes, RowUpdated no"}
  - {id: context-split, rule: "Same word, materially different meaning per team -> separate bounded_contexts + relation.", example: "Product: price in Catalog, weight in Shipping"}
  - {id: language-fidelity, rule: "Record terms exactly as experts say them; reject developer jargon.", example: "policy renewal, not ContractUpdateManager"}
  - {id: synonym-collapse, rule: "One meaning, one canonical term per context; synonyms become aliases.", example: "client/customer/account -> customer"}
  - {id: repository-gate, rule: "Repositories only for aggregate roots; inner entity wanting one = wrong boundary.", example: "reject OrderLineRepository"}
  - {id: minimal-evidence, rule: "Classify on the fewest deciding facts; two plausible kinds -> ask, never guess.", example: "'we track shipments' alone decides nothing -> ask"}

clarification_questions:
  insufficient_info:
    - {q: "Does <X> have an identity that survives attribute changes, or are two <X> with the same values interchangeable?", decides: entity vs value_object}
    - {q: "What must never be violated about <X>, even for an instant?", decides: invariants and owner}
    - {q: "When <X> changes, what else must change in the same transaction?", decides: aggregate boundary}
    - {q: "Does the business care about <X>'s lifecycle (created, changed, closed)?", decides: entity vs value_object vs domain_event}
    - {q: "Which people/teams use the term <X>, and do they mean the same thing?", decides: bounded_context assignment}
  conflict:
    - {q: "<X> is already defined as <def> in context <C>: (a) same concept, (b) different concept needing its own context, or (c) a correction?", decides: reuse vs split vs update}
    - {q: "This change breaks invariant <rule> owned by <owner>. Is the invariant wrong, or is this a different concept?", decides: revision vs new term}
  policy: Ask the single question that unblocks; batch only when several concepts block at once; never ask what the input already answers.

library_file:
  purpose: One YAML file per project, sole custody of the librarian; humans review and edit, the librarian writes.
  json_schema: library.schema.json  # ships beside this file; gives human editors descriptions and validation
  header: "# yaml-language-server: $schema=<relative path to library.schema.json, or its canonical $id URL when the schema file is not nearby>"  # first line of every written library file
  shape: |  # human-readable summary; library.schema.json is authoritative — on any divergence, the schema wins
    version: 1
    contexts:
      - name: <context>
        entities: [{name, definition, aggregate: true?, aliases: []?}]
        value_objects: [{name, definition, aliases: []?}]
        invariants: [{statement, owner}]
        events: [{name, definition}]
    relations: [{from, to, kind}]   # kind = one context_relation key; omit when single context
  rules:
    - Every term carries a definition; no definition, no entry.
    - A term lives in exactly one context; same word elsewhere is a second term.
    - Aliases point at the canonical term; never duplicate definitions.
    - Unresolved classifications are never written; ask first, record after.
