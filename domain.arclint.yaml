# yaml-language-server: $schema=.arclint/schemas/domain.arclint.schema.json
version: 1
project: arclint
description: >-
  The Ubiquitous Language of arclint itself: what a Rule is, how a
  repository adopts Rules a Pattern distributes, how conformance is
  judged, and how Patterns travel between repositories.
contexts:
  vocabulary:
    definition: >-
      The recorded Ubiquitous Language of a project and the meta-model
      it is checked against: the building blocks a domain file may
      record, the invariants each block carries, and the sources those
      invariants cite. The rule context reads it to expand a Rule, and
      the conformance context reads it to judge code against the
      block invariants.
  rule:
    definition: >-
      The rule bounded context: the Rule aggregate's home, holding
      everything a Rule is made of and everything it names.
    aggregates:
      Rule:
        definition: >-
          One enforceable architecture claim configured in
          rules.arclint.yaml. A Rule keeps its RuleID while everything
          human-facing about it can be renamed. Aggregate evidence,
          from the rules.arclint.yaml header: "Rule is the sole
          aggregate". A Rule's identity, its Claim, its scope, and its
          Severity change together in one edit of rules.arclint.yaml.
        identity: RuleID
        entities:
          Zone:
            definition: >-
              A named group of folders and files an architecture speaks
              about, such as domain or delivery. A Zone keeps its
              ZoneName while the paths that belong to it change: a
              Rule says "on: domain" and never repeats a folder. A
              Pattern lists its Zones with descriptions and no paths;
              a repository ruleset gives every Zone its paths, either
              directly or through a Binding. Recorded inside the Rule
              aggregate because rules.arclint.yaml makes Rule the sole
              aggregate and Zone lives in its home.
            identity: ZoneName
          Pattern:
            definition: >-
              A named, namespaced collection of Rules and Zones
              published for other repositories to extend, with a
              documentation link and the Languages it covers. A Pattern
              keeps its namespace and name across versions; a
              repository always extends one exact version through a
              PatternReference. Every Rule a Pattern distributes carries
              the Pattern's namespace in its RuleID. Recorded inside the
              Rule aggregate because rules.arclint.yaml makes Rule the
              sole aggregate and Pattern lives in its home.
            identity: PatternReference
        invariants:
          expansion-only-as-structure: >-
            A Rule may carry an Expansion only as a structure Rule, and
            its parameters must be exactly the Expansion's resolution
            against the recorded language. When nothing is recorded the
            parameters are empty and the Claim says so.
          exactly-one-assertion: >-
            A Rule carries exactly one Assertion; a Rule written with
            two assertion keys, or with none and no Override target, is
            rejected at load.
          unique-qualified-id: >-
            Two Rules with the same qualified RuleID cannot both exist
            in one repository; a repository Rule spelled with the
            RuleID of a Rule an extended Pattern distributes is
            rejected at load.
          zone-has-a-path: >-
            A Zone in a repository ruleset has at least one path; a
            Zone written with no paths is legal only in a Pattern
            file, where a Binding supplies them later.
          pattern-lists-zones-without-paths: >-
            A Pattern lists its Zones without paths, and every Rule
            the Pattern distributes names only Zones the Pattern
            lists.
    value_objects:
      RuleID:
        definition: >-
          The stable identity of a Rule, spelled explicitly in
          rules.arclint.yaml. A repository Rule's RuleID is local; a
          Rule a Pattern distributes is qualified by that Pattern's
          namespace/name, spelled namespace/name:local, so two Patterns
          may distribute the same local identity and both apply under
          distinct RuleIDs. Every record arclint keeps about a Rule
          over time keys on it, so it outlives renames of anything else
          about the Rule, and it never carries a version.
        invariants:
          qualified-by-full-pattern-name: >-
            A distributed Rule's RuleID is qualified by the full
            namespace/name of its Pattern, never by the namespace
            alone, so Patterns that share a namespace may distribute
            the same local identity without colliding.
      ZoneName:
        definition: >-
          The lowercase name a ruleset spells for a Zone, the only
          way a Rule, a Binding, or an Exclusion refers to one.
      Claim:
        definition: >-
          The architectural proposition a Rule states, either written
          by the author or derived from the Rule's parameters. The
          Claim of an expanded Rule says what it derives from, and
          says plainly when the vocabulary records nothing yet.
        aliases: [description]
      Assertion:
        definition: >-
          The one checkable proposition a Rule carries, written in
          rules.arclint.yaml as exactly one assertion key with its
          parameters: imports, structure, naming, invariants, layers,
          imported_by, independent, acyclic, content, or uses. The key
          alone decides how the Rule is evaluated; a Rule never carries
          two.
      Severity:
        definition: >-
          Gate importance of a finding: error, warning, or info.
          Described entirely by its value and validated at
          construction. Two equal spellings are interchangeable.
        invariants:
          closed-set: >-
            A Severity must be one of error, warning, or info; any
            other spelling is rejected at construction, never stored.
      Language:
        definition: >-
          A source language arclint recognizes and can analyze: go,
          typescript, or python. A repository ruleset states which
          Languages it runs under runtime, and a Pattern states which
          Languages it covers. Recognition does not promise that every
          Rule covers the Language.
      PatternReference:
        definition: >-
          The exact spelling namespace/name@version by which a
          repository extends one published version of a Pattern. A
          Rule a Pattern distributes carries the PatternReference as
          its provenance, and two references with the same spelling
          resolve to the same Pattern version.
      Expansion:
        definition: >-
          How a structure Rule's globs derive from one recorded
          vocabulary collection: an ExpansionSource plus authored
          globs whose {name:<case>} placeholders resolve once per
          recorded term. It is pure substitution, with no predicates,
          filters, or joins. Logic beyond substitution belongs in an
          extension. The Rule stays the sole aggregate: an expanded
          Rule is one Rule stating one universally quantified Claim.
        invariants:
          well-formed: >-
            An Expansion must name a published ExpansionSource, declare
            at least one require or forbid glob, and use braces only as
            {name:<case>} placeholders with a published TermCase.
            Anything else is rejected at construction, never loaded.
      ExpansionSource:
        definition: >-
          The recorded collection an Expansion derives from, one of
          the closed set domain.aggregates, domain.entities,
          domain.value_objects, domain.events, domain.contexts,
          domain.invariants, domain.assertions,
          domain.specifications. A new source is a deliberate design
          act, never a syntax feature.
      TermCase:
        definition: >-
          One published rendering of a recorded term as a path or
          identifier segment: flatcase, snake_case, kebab-case,
          camelCase, or PascalCase. One producing implementation
          serves both surfaces, the rules.arclint.yaml {name:<case>}
          placeholders and the extension SDK's ctx.caseTerm, so
          whatever the ruleset grammar expresses an extension can
          see. A CaseSpec checks names; a TermCase produces them.
        invariants:
          never-empty-segment: >-
            A TermCase never renders an empty segment: a term without
            letters or digits is rejected at resolution.
      CaseSpec:
        definition: >-
          The finite case vocabulary a naming Rule matches file stems
          against in rules.arclint.yaml: kebab-case, snake_case,
          camelCase, PascalCase, or a regex, combined as alternatives.
    questions:
      pattern-holds-rules: >-
        In code a Pattern carries the Rules it distributes, which reads
        like a boundary of its own, while rules.arclint.yaml keeps Rule
        the sole aggregate and forbids a pattern home. Is Pattern a
        member of the Rule aggregate, as recorded here, or an aggregate
        whose members are Rules?
  adoption:
    definition: >-
      How one repository takes on Rules a Pattern distributes: binding
      the Pattern's Zones to paths and deciding, per Rule, what to
      disable, exclude, or suppress.
    value_objects:
      Binding:
        definition: >-
          The paths an adopting repository gives to one Zone of a
          Pattern it extends, spelled under bind as one glob or a list
          of globs. A Binding is the only place a Pattern Zone's
          paths live; the Pattern's Rules never change when the folders
          do.
        invariants:
          names-a-listed-zone: >-
            A Binding names a Zone the extended Pattern lists and
            gives it at least one path; a Binding for a Zone the
            Pattern does not list is rejected at load.
          every-zone-bound: >-
            Every Zone an extended Pattern lists has a Binding before
            the Pattern's Rules evaluate; a Zone left unbound is
            rejected at load.
      Override:
        definition: >-
          One adopting repository's decision applied onto a Rule an
          extended Pattern distributes, keyed by the Rule's qualified
          RuleID. An Override is not a second Rule: it only disables
          the Rule, changes its Severity, excludes subjects from it, or
          suppresses its findings.
        invariants:
          names-a-distributed-rule: >-
            An Override names a Rule an extended Pattern distributes;
            an Override whose RuleID matches no Pattern Rule is
            rejected at load.
          carries-no-assertion: >-
            An Override carries no Assertion and no Claim; adding
            either is rejected at load with the advice to add a new
            local Rule under a new RuleID.
      Disablement:
        definition: >-
          The decision to stop evaluating one Rule for the repository,
          with a reason. The Rule and its provenance stay inspectable
          and the reason is reported wherever the Rule is listed.
        invariants:
          carries-a-reason: >-
            A Disablement carries a reason; disabling without one is
            rejected at load.
      Exclusion:
        definition: >-
          The decision removing selected paths or Zones from what one
          Rule judges, with a reason. Excluded subjects are reported as
          not applicable, never silently dropped.
        invariants:
          names-a-subject-with-a-reason: >-
            An Exclusion names at least one path or Zone and carries
            a reason; an Exclusion without either is rejected at load.
      Suppression:
        definition: >-
          The decision keeping a finding one Rule produced at selected
          paths while removing its gate effect, with a reason. The
          finding is still reported as suppressed.
        invariants:
          names-a-path-with-a-reason: >-
            A Suppression names at least one path and carries a
            reason; a Suppression without either is rejected at load.
      Installation:
        definition: >-
          The decision to extend one Pattern, recorded in
          rules.arclint.yaml as one extends entry that names the
          PatternReference and carries a Binding for every Zone the
          Pattern lists, drafted from the paths the Pattern suggests.
          Installing a Pattern the binary does not embed keeps a
          VendoredPattern first, so the repository resolves the
          PatternReference offline.
        invariants:
          one-extends-per-pattern: >-
            An Installation of a Pattern whose namespace and name the
            repository already extends replaces the extended version
            and keeps every Binding; it never records a second extends
            entry for one namespace and name.
  conformance:
    definition: >-
      Judging code against Rules: every assessment derives its
      Violations fresh from the observed repository.
    value_objects:
      Violation:
        definition: >-
          One suspected breach of a Rule, anchored at a file and line
          and carrying the PatternReference of the Pattern that
          distributed the Rule when one did. It has no lifecycle: every
          assessment derives its Violations fresh, and two Violations
          with the same values are the same finding.
  distribution:
    definition: >-
      Moving published Patterns between repositories without changing
      them: what a Registry publishes, what a repository vendors, and
      how a version proves it is the one that was published.
    value_objects:
      Catalog:
        definition: >-
          Every Pattern the resolving PatternSources carry, one entry
          per PatternReference in source order, with the agreeing
          copies of one reference kept beside the first. A listing
          reads the Catalog to say where a Pattern resolves from and
          what the repository carries of it; a check resolves the
          PatternReferences it extends through the Catalog.
      Digest:
        definition: >-
          The sha256 content hash, spelled sha256:<hex>, that
          identifies the exact bytes of one PatternFile, or of a whole
          Pattern through the sorted list of its PatternFile paths and
          their Digests. Two copies of one published version share one
          Digest.
        invariants:
          deterministic: >-
            A Digest computed twice over the same PatternFiles is the
            same Digest; file order, platform, and time never enter it.
      Index:
        definition: >-
          A Registry's complete listing of the Pattern versions it
          publishes, one entry per PatternReference carrying the
          version's Digest and documentation, ordered by namespace,
          name, then version. The Index is read before any Manifest or
          PatternFile, so a Registry is listed and a Selection resolved
          without fetching a Pattern.
        invariants:
          one-entry-per-reference: >-
            An Index lists one PatternReference at most once; a listing
            that repeats a reference is rejected at construction,
            because a published version is immutable.
          fetched-digest-agrees: >-
            A Pattern fetched from a Registry must carry the Digest its
            Index records; a fetched version whose Digest disagrees
            with the Index is rejected, never vendored.
      Manifest:
        definition: >-
          The record a published Pattern version travels with: its
          PatternReference, its Digest, and the path and Digest of
          every PatternFile it ships. A Manifest is written beside a
          VendoredPattern and read from a Registry before any
          PatternFile is fetched.
        invariants:
          lists-every-file-inside-the-pattern: >-
            A Manifest lists every PatternFile of the Pattern and none
            outside the Pattern's directory; a path that is absolute,
            escapes the directory, or appears twice is rejected at
            construction.
      PatternFile:
        definition: >-
          One file a Pattern ships: a forward-slash path relative to
          the Pattern's own directory and the file's bytes. The
          pattern.yaml file is always one of them, and every Extension
          the Pattern distributes lives under extensions/.
      PatternSource:
        definition: >-
          One place arclint resolves a PatternReference from: the
          Patterns embedded in the binary, the Patterns kept under
          .arclint/patterns in the repository, or a Registry. A check
          resolves through the first two only; a Registry is read when
          a command asks to vendor or install a Pattern.
        invariants:
          sources-agree-on-a-digest: >-
            Two PatternSources that carry one PatternReference must
            agree on its Digest; a disagreement is rejected at load,
            because a published version is immutable.
      Registry:
        definition: >-
          A location, reachable by URL, that publishes Patterns by
          PatternReference: an index of every published reference and,
          per version, a Manifest beside the Pattern's files. The
          default Registry is arclint's own; a command may name
          another.
        invariants:
          never-read-during-a-check: >-
            A Registry is never read while a check runs; a check
            resolves only embedded and vendored Patterns.
      Selection:
        definition: >-
          The spelling a command accepts to name one Pattern among the
          PatternReferences a source carries: an exact
          namespace/name@version, a namespace/name meaning its highest
          version, or a bare name meaning the highest version of the
          one namespace/name that carries it.
        invariants:
          bare-name-never-ambiguous: >-
            A bare-name Selection carried by more than one
            namespace/name is rejected as ambiguous, with every
            matching reference spelled out; nothing is chosen on the
            caller's behalf.
      VendoredPattern:
        definition: >-
          An exact copy of one published Pattern version kept under
          .arclint/patterns/<namespace>/<name>/ together with its
          Manifest, so the repository resolves the PatternReference
          offline. One name in one namespace has one vendored version.
        invariants:
          matches-its-manifest: >-
            A VendoredPattern whose PatternFiles no longer match its
            Manifest is rejected at load, never used silently.
relations:
  - from: vocabulary
    to: rule
    kind: conformist
    description: >-
      rule reads the recorded language as vocabulary spells it: an
      Expansion resolves against the UbiquitousLanguage without
      redefining a term, so dependence flows rule -> vocabulary and
      never back.
  - from: vocabulary
    to: conformance
    kind: conformist
    description: >-
      conformance judges code against the block invariants exactly as
      vocabulary records them, so dependence flows conformance ->
      vocabulary and never back.
  - from: rule
    to: conformance
    kind: conformist
    description: >-
      conformance adopts the rule context's model as-is: assessments
      consume Rule, Severity, and the rest of the rule model directly,
      so dependence flows conformance -> rule and never back.
  - from: rule
    to: adoption
    kind: conformist
    description: >-
      adoption speaks the rule context's model unchanged: a Binding
      names a Zone, an Override names a Rule, and neither redefines
      them, so dependence flows adoption -> rule and never back.
  - from: rule
    to: distribution
    kind: conformist
    description: >-
      distribution moves Patterns around without redefining them: a
      Manifest names a PatternReference and a VendoredPattern carries a
      Pattern as the rule context spells it, so dependence flows
      distribution -> rule and never back.
  - from: distribution
    to: adoption
    kind: conformist
    description: >-
      adoption consumes the distribution model unchanged: an
      Installation keeps a VendoredPattern and resolves through
      PatternSources, so dependence flows adoption -> distribution and
      never back.
