context_relation_kinds:
  partnership: "The two contexts succeed or fail together; the teams coordinate planning and the evolution of their interfaces. Influence runs both ways."
  shared_kernel: "An explicitly bounded subset of the model, and the code and database design associated with it, that the two teams agree to share and change only in consultation. Influence runs both ways."
  customer_supplier: "The downstream team is the upstream team's customer; downstream priorities factor into upstream planning and jointly developed acceptance tests validate the interface."
  conformist: "The downstream team eliminates translation by adhering to the upstream model as it is, sharing the upstream's ubiquitous language."
  anticorruption_layer: "The downstream context isolates itself with a layer that presents the upstream's functionality in terms of the downstream's own model, translating in one or both directions."
  open_host_service: "The upstream context defines an open protocol giving access to its subsystem as a set of services, augmented by one-off translators only for idiosyncratic clients."
  published_language: "The two contexts translate through a well-documented shared language that can express the necessary domain information, often combined with an open-host service."
  separate_ways: "The two contexts have no connection at all, so each may find simple, specialized solutions within its own scope."

distillation_rules:
  - {id: identity-test, rule: "Concept keeps its business identity while attributes change -> entity.", example: "order keeps its number when status changes"}
  - {id: identity-regardless-of-history, rule: "Define a means of distinguishing each object regardless of its form or history. The model decides what sameness is. An identifier may come from outside the system, or it may be a symbol created for the system. A part that can change while the object stays the same is not part of its identity.", example: "an order keeps its id when its status changes; a username is the identity only when no operation changes it", sources: ["evans2015, p. 11, Entities (tier 1, read)"]}
  - {id: value-test, rule: "Two instances with identical values are interchangeable -> value_object.", example: "any two USD 10 amounts are the same money"}
  - {id: invariant-ownership, rule: "First establish a domain consistency rule and its capable owner; must-always/must-never wording alone does not establish one. Contributor workflow, host guarantees, delivery validation and programming guards are not automatically invariants or assertions. A justified rule holding at all observable times -> the owner's invariants, keyed; a justified guarantee of a named domain operation -> the owner's assertions, keyed, with on: the aggregate's for its command, the domain service's for its operation. A value object's key names value integrity checked at construction; an aggregate's key names the root method that enforces the cluster rule.", example: "total = sum of lines -> Order.invariants.total-is-sum-of-lines; every tier priced before Publish -> Order.assertions.tiers-priced on Publish"}
  - {id: specification-as-thing, rule: "Experts pass the predicate around as a thing -> specifications, a type with SatisfiedBy; never a flag on a value object and never an invariant.", example: "preferred customer is handed to pricing as a spec, not inlined as a must-always"}
  - {id: language-not-guards, rule: "Record only what you would say to an expert who never saw the language; programming-only guards are not domain contracts.", example: "nil receiver check is not an invariant; a Price is never negative is"}
  - {id: transaction-boundary, rule: "Smallest cluster consistent in one transaction -> one aggregate; everything else by ID, eventually.", example: "reject: customer and all orders save together"}
  - {id: thing-first, rule: "A behavior goes to the entity or value that naturally owns it before any service is considered; a service that could be a method on one root is a wrong home.", example: "Tenant.Deactivate, not TenantService.Deactivate(tenant)"}
  - {id: command-vs-query, rule: "Changes the state of one aggregate and returns no domain information -> a command of that root; changes nothing and answers a question -> a query of the root or value; never both in one operation. Neither is recorded.", example: "Tenant.Deactivate is a command; Tenant.IsRegistrationAvailableThrough is a query"}
  - {id: domain-service-when-no-owner, rule: "Does it make a business decision that no one aggregate can make alone? Yes -> domain_service, recorded under services with its contract; it may read through repositories, never commits, never publishes. ArcLint's own convention, which no cited source states: \"never commits, never publishes\".", example: "TenantProvisioningService over Tenant, User, and Role; Encrypter for knowledge no aggregate holds"}
  - {id: application-service-holds-no-rule, rule: "If I delete every step here, is any business decision lost? No -> application_service: loading, invoking, committing, publishing, notifying, translating; not recorded. Yes -> the decision is placed under its owner and reported as a finding.", example: "the ProvisionTenant use case runs the service in one unit of work and publishes; it holds no rule"}
  - {id: contract-of-a-service, rule: "A guarantee of one operation of a domain service -> the service's assertions, keyed, with on naming the operation; the set is the service's contract.", example: "TenantProvisioningService.assertions.tenant-name-unique on ProvisionTenant"}
  - {id: decide-then-carry-out, rule: "The domain decides; the application gathers what the decision needs and carries out the change. The application layer holds no business rule: it only coordinates tasks and delegates work to the domain (Eric Evans, Domain-Driven Design Reference: Definitions and Pattern Summaries (2015), p. 10, Layered Architecture, on isolating the domain (tier 1, read); Martin Fowler, AnemicDomainModel (2003-11-25), quoting Evans 2003, on no business rules or knowledge (tier 2, read); Randy Stafford, Service Layer, Kinds of Business Logic (Patterns of Enterprise Application Architecture excerpt) (2002), on application logic (tier 2, read)). When an operation of a domain service would change something outside the model, such as a file, a store or another system, its assertion goes on the operation that decides. That operation takes what the decision needs as values, changes nothing, and returns its verdict as a value; a verdict that carries a rule, such as approving only when no participant refused, is recorded as a value object whose invariant states that rule, so `value_object/constructed-through-one-door` requires it to declare a constructor. The application service gathers those values, asks for the verdict, and makes the change only with a verdict that allows it in hand. Go makes that verdict hard to forge with unexported fields and a zero value that allows nothing, TypeScript with a private constructor and a private field, and Python only by convention, with an underscore-prefixed name. An automated test proves what the domain cannot see, such as a refusal changing nothing on disk (Eric Evans, Domain-Driven Design Reference: Definitions and Pattern Summaries (2015), p. 12, Value Objects, p. 14, Services, p. 21, Side-Effect-Free Functions, p. 22, Assertions (tier 1, read); The Go Authors, The Go Programming Language Specification (language version go1.27) (2026-05-26), Exported identifiers, Struct literals (tier 2, read); Microsoft, TypeScript 2.0 release notes (2016), Private and Protected Constructors (tier 2, read); Microsoft, TypeScript Handbook: Type Compatibility (2026-10-16), Private and protected members in classes (tier 2, read); Python Software Foundation, The Python Tutorial, 9. Classes (Python 3.15.0) (2026-10-17), 9.6 Private Variables (tier 2, read)).", example: "RetirementPolicy.Decide(installations) carries no-installation-left and returns the verdict; the RetireRelease use case lists the installations, asks for the verdict, and deletes the files only when it allows; never a service that deletes them through callbacks"}
  - {id: verified-by-tests, rule: "An invariant or assertion the code cannot state in a body (an operation of a service declared as an interface or an abstract class, an effect the model cannot see) -> its verified_by, each test as path:name from the repository root; arclint checks the test exists, never that it proves the statement.", example: "Discounter.assertions.never-exceeds-total on Discount, verified_by internal/pricing/discounter_test.go:TestDiscountNeverExceedsTotal"}
  - {id: guarantee-has-one-checked-home, rule: "A guarantee of a domain service declared as an interface, an abstract class, an ABC, or a Protocol is checked once, in the model, wherever the model can state it: by a function of the context named assert followed by the key, or, when the operation returns a value the business names, by that value's invariant recorded under the same key; only what neither states is verified-by-tests. Never as a method of the interface, a callback, or prose.", example: "Encrypter.assertions.not-empty on Encrypt holds because Encrypt returns EncryptedPassword, whose constructor enforces EncryptedPassword.invariants.not-empty; never an AssertNotEmpty on the Encrypter interface", sources: ["evans2015, p. 14, Services (tier 1, read)", "evans2015, p. 21, Side-Effect-Free Functions (tier 1, read)", "evans2015, p. 22, Assertions (tier 1, read)", "vernon-iddd-samples, MD5EncryptionService, checks its argument through the shared AssertionConcern (tier 1, read)"]}
  - {id: precondition-as-assertion, rule: "A rule that holds only when one named command runs, not at every instant -> the owner's assertions with on that command; the statement stays as the expert said it and is never rewritten into a post-condition.", example: "Tenant.assertions.invites-only-while-active on OfferRegistrationInvitation, not a Tenant invariant, because a deactivated tenant is legal"}
  - {id: not-a-domain-rule, rule: "A promise about delivery (notify, export, retry, transaction control) or a programming guard -> no entry; the application service or the code does it.", example: "notify billing on TenantProvisioned is a subscriber, not an assertion"}
  - {id: intention-revealing-name, rule: "Name a service and its operations for effect and purpose in the ubiquitous language, never for the means; a name ending in Manager, Helper, Handler, or Processor is a finding to rename, not a kind. An application service's input is named for the request, never with the word command. ArcLint's own convention, which no cited source states: \"never with the word command\".", example: "TenantProvisioningService.ProvisionTenant, not TenantManager.Handle; ProvisionTenantRequest, not ProvisionTenantCommand"}
  - {id: event-detection, rule: "State change experts say in past tense -> domain_event; technical changes are not events.", example: "OrderConfirmed yes, RowUpdated no"}
  - {id: context-split, rule: "Same word, materially different meaning per team -> separate bounded_contexts + relation.", example: "Product: price in Catalog, weight in Shipping"}
  - {id: language-fidelity, rule: "Record terms exactly as experts say them; reject developer jargon.", example: "policy renewal, not ContractUpdateManager"}
  - {id: synonym-collapse, rule: "One meaning, one canonical term per context; synonyms become aliases.", example: "client/customer/account -> customer"}
  - {id: repository-gate, rule: "Repositories only for aggregate roots; inner entity wanting one = wrong boundary.", example: "reject OrderLineRepository; reject \"we must list comps, so Comp is a root\""}
  - {id: minimal-evidence, rule: "Classify on the fewest deciding facts; two plausible kinds -> ask, never guess.", example: "'we track shipments' alone decides nothing -> ask"}

source_tiers:
  1: "the canonical works: Evans 2003 and 2015, Vernon 2013 and his papers and sample code, Evans and Fowler 1997"
  2: "published books and Fowler's bliki"
  3: "practitioner blogs, which may only illustrate"

declined_rules:
  - {id: factory/required-for-every-aggregate, statement: "Every recorded aggregate names a factory.", reason: "Evans calls for a factory only \"When creation of an entire, internally consistent aggregate, or a large value object, becomes complicated or reveals too much of the internal structure\". An aggregate whose root constructs it plainly needs none. A factory an aggregate does record is still checked by factory/declared.", basis: "Eric Evans, Domain-Driven Design Reference: Definitions and Pattern Summaries (2015), p. 18, Factories <https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf> (tier 1, read)"}
  - {id: repository/required-for-every-aggregate, statement: "Every recorded aggregate names a repository.", reason: "Evans says \"Provide repositories only for aggregate roots that actually need direct access\". An aggregate that nothing looks up directly needs none. A repository an aggregate does record is still checked by repository/for-aggregate-roots-only and repository/declared.", basis: "Eric Evans, Domain-Driven Design Reference: Definitions and Pattern Summaries (2015), p. 17, Repositories <https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf> (tier 1, read)"}
  - {id: value_object/records-an-invariant, statement: "Every recorded value object records at least one invariant.", reason: "No source requires a value object to carry a rule. The pattern asks a value object to express the meaning of its attributes, to be immutable, and to offer side-effect-free functions; it asks for no rule. Assertions allow \"invariants of classes\" without requiring one. A value object may record invariants, and value_object/constructed-through-one-door checks the ones it records.", basis: "Eric Evans, Domain-Driven Design Reference: Definitions and Pattern Summaries (2015), p. 12, Value Objects <https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf> (tier 1, read); Eric Evans, Domain-Driven Design Reference: Definitions and Pattern Summaries (2015), p. 22, Assertions <https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf> (tier 1, read)"}
  - {id: assertion/owned-by-an-application-operation, statement: "An assertion is recorded on an operation of an application service.", reason: "An assertion is a business guarantee, and the application layer holds none: it \"does not contain business rules or knowledge, but only coordinates tasks and delegates work to collaborations of domain objects\" (Evans, quoted by Fowler), and its logic is what Stafford calls \"workflow logic\". Evans isolates the domain model from \"the user interface, application, and infrastructure code\". An assertion belongs to an aggregate or a domain service, and the domain file records no application service.", basis: "Eric Evans, Domain-Driven Design Reference: Definitions and Pattern Summaries (2015), p. 10, Layered Architecture <https://www.domainlanguage.com/wp-content/uploads/2016/05/DDD_Reference_2015-03.pdf> (tier 1, read); Martin Fowler, AnemicDomainModel (2003-11-25) <https://martinfowler.com/bliki/AnemicDomainModel.html> (tier 2, read); Randy Stafford, Service Layer, Kinds of Business Logic (Patterns of Enterprise Application Architecture excerpt) (2002) <https://www.informit.com/articles/article.aspx?p=1398617&seqNum=4> (tier 2, read)"}
  - {id: assertion/checked-before-any-change, statement: "An operation calls the method that checks its assertion before any call that changes state.", reason: "The check would need to know which calls change things, and no fact arclint observes says so in every language. The decision value makes the order explicit instead: the deciding operation returns its verdict as a value, and the application carries out the change only with that value in hand.", basis: "Owner decision: https://github.com/wixregiga/arclint/issues/128"}
  - {id: domain_service/no-effect-parameters, statement: "A domain operation takes no function parameter that carries out an effect.", reason: "Evans asks the domain to decide without side effects (DDD Reference 2015, p. 21) but does not name function-typed parameters; a built-in rule would rest on functional-style guidance, which belongs in a Pattern. The design review flags the callback shape instead.", basis: "Owner decision: https://github.com/wixregiga/arclint/issues/169"}
  - {id: ubiquitous_language/normative-wording-is-a-rule, statement: "A definition worded with must, always, or never is reported as a rule recorded in the wrong place.", reason: "Must-always or must-never wording alone does not establish a rule; the librarian places a rule only after establishing domain consistency and an owner, as its invariant-ownership distillation rule says. A limit on the length of definitions and statements keeps rules out of long definitions instead.", basis: "Owner decision: https://github.com/wixregiga/arclint/issues/125"}
  - {id: business_rule/waived-when-missing, statement: "A recorded term that lacks a rule it is asked to record, such as an aggregate with no invariant, carries a waiver that silences the finding.", reason: "A missing rule is reported, never waived. A finding at warning severity does not fail a check, and the owner monitors it instead. An Override still changes the severity of a built-in rule or disables it with a reason, as for every built-in rule.", basis: "Owner decision: https://github.com/wixregiga/arclint/issues/129"}
  - {id: bounded_context/checks-derived-from-ownership, statement: "Checks are derived from recorded ownership, a bounded context owning terms, their spellings, and policy values, and a Zone owning conventions and shared mechanisms.", reason: "The owner closed the design as not planned: term ownership as shown was forced and barely solved the case it was meant for, and the derived ownership checks did not look good overall. It reopens only with a different design.", basis: "Owner decision: https://github.com/wixregiga/arclint/issues/137"}

clarification_questions:
  insufficient_info:
    - {q: "Does <X> have an identity that survives attribute changes, or are two <X> with the same values interchangeable?", decides: entity vs value_object}
    - {q: "What is <Identity> made of? If any part can change while the <X> stays the same, the identity cannot be that part.", decides: identity vs attribute (entity)}
    - {q: "What must never be violated about <X>, even for an instant?", decides: invariants and owner}
    - {q: "Does <rule> hold even while nothing runs, or only when <operation> runs?", decides: invariant vs assertion}
    - {q: "Which operation guarantees <rule>, and who performs it: one aggregate, or a process that spans aggregates?", decides: assertion owner (aggregate vs domain_service)}
    - {q: "Does <operation> change anything outside the model, such as a file, a store or another system? Then record the assertion on the operation that decides, and let the application service make the change.", decides: deciding operation (domain_service) vs carrying out the change (application_service)}
    - {q: "Does <operation> return a value the business names? Then the guarantee is that value's invariant.", decides: where a declared domain_service's guarantee is checked (value invariant vs function of the context)}
    - {q: "Does <X> change anything, or does it only answer a question?", decides: command vs query}
    - {q: "Can one <Aggregate> do <X> with what it already holds, or does <X> need another aggregate or knowledge none of them holds?", decides: command vs domain_service}
    - {q: "Is <X> a result the business names, or a step the software takes to deliver one?", decides: domain_service vs application_service}
    - {q: "Do experts pass this predicate around as a thing they name, rather than as a rule that simply holds?", decides: specification vs invariant or assertion}
    - {q: "Is this a property of the value itself (constructor) or of the cluster that must stay consistent on every command?", decides: value integrity vs cluster invariant}
    - {q: "Would you say this to an expert who never saw the language?", decides: domain contract vs programming-only guard}
    - {q: "When <X> changes, what else must change in the same transaction?", decides: aggregate boundary}
    - {q: "Does the business care about <X>'s lifecycle (created, changed, closed)?", decides: entity vs value_object vs domain_event}
    - {q: "Which people/teams use the term <X>, and do they mean the same thing?", decides: bounded_context assignment}
  conflict:
    - {q: "<X> is already defined as <def> in context <C>: (a) same concept, (b) different concept needing its own context, or (c) a correction?", decides: reuse vs split vs update}
    - {q: "This change breaks invariant <rule> owned by <owner>. Is the invariant wrong, or is this a different concept?", decides: revision vs new term}
  policy: Ask the single question that unblocks; batch only when several concepts block at once; never ask what the input already answers.

