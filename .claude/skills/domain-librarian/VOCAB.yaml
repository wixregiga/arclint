library_file:
  purpose: The project's shared domain language. Learn its recording from arclint context and arclint domain; record through arclint domain define and arclint domain remove, which validate each write and let ArcLint write the format.
  shape: |  # model fields, not file syntax; optional fields marked ?
    project: name and description?
    contexts: named responsibilities, each with a definition
      aggregates: definition, identity, aliases?, repository?, factory?
        entities: definition, identity?, aliases?
        invariants: keyed statements enforced by the root, verified_by tests?
        assertions: keyed guarantees with on naming the operation, statement, verified_by tests?
      value_objects: definition, aliases?, keyed invariants with verified_by tests?
      events: definition, raised_by aggregate?
      services: definition, keyed assertions with on, statement, verified_by tests?
      specifications: definition
      questions: keyed unresolved decisions
    relations: from context, to context, kind, description?
      kind: one published context_relation_kinds key
  rules:
    - Record every entry through arclint domain define and remove entries through arclint domain remove; never hand-write the domain file.
    - Every term carries a definition; no definition, no entry.
    - A term lives in exactly one context; same word elsewhere is a second term.
    - Aliases point at the canonical term; never duplicate definitions.
    - Every entity lives under the aggregate that owns it; an aggregate names its identity; an invariant lives under the one aggregate or value object that enforces it.
    - Unresolved classifications are never written; an open question is written under `questions`, keyed, and nothing is enforced from it.
    - Definitions read as plain human sentences, without em dashes; humans own the document.
    - Established vocabulary may be explained in context definitions without tactical entries; tactical classifications require their own evidence.
    - A term matching a code object uses the code's exact spelling (TermCase, RuleID), never a prose-spaced variant.
