# domain-librarian core reference: DDD vocabulary and its sources, distillation rules, declined rules, clarification protocol, bibliography.
version: 1

vocabulary:
  # Strategic design
  domain: "A sphere of knowledge, influence, or activity. The subject area to which the user applies a program is the domain of the software."
  model: "A system of abstractions that describes selected aspects of a domain and can be used to solve problems related to that domain. A model has meaning only inside a bounded context."
  ubiquitous_language: "A language structured around the domain model and used by all team members within a bounded context to connect all the activities of the team with the software. The model is the backbone of the language; the code uses the same terms as the conversation, and a change in the language is a change to the model."
  context: "The setting in which a word or statement appears that determines its meaning. Statements about a model can only be understood in a context."
  bounded_context: "A description of a boundary, typically a subsystem or the work of a particular team, within which a particular model is defined and applicable. The boundary is set explicitly in terms of team organization, usage within specific parts of the application, and physical manifestations such as code bases and database schemas."
  context_map: "The named bounded contexts in play on a project and the points of contact between their models: the translation for any communication, what is shared, what is isolated, and which way influence runs. It maps the existing terrain; transformations come later."
  context_relation: "One point of contact on the context map, a relationship between an upstream context, whose actions affect the downstream context's success, and a downstream context, whose actions do not significantly affect the upstream. Its kind is one of the published relationship patterns."
  core_domain: "The critical core of the model, the real business asset, boiled down and kept small so it can be distinguished from the mass of supporting model and code, and where the deepest model and the best developers are invested."
  generic_subdomain: "A cohesive subdomain that is not the motivation for the project, factored out into a separate module as a generic model, kept free of the project's specialties, and developed with lower priority than the core domain."
  big_ball_of_mud: "A part of a system where models are mixed and boundaries are inconsistent, designated as such by drawing a boundary around the whole mess so that no sophisticated modeling is attempted inside it and it is kept from sprawling into other contexts."
  # Tactical design
  domain_isolation: "The expression of the domain model and the business logic kept free of any dependency on infrastructure, user interface, or application logic that is not business logic, so that the domain objects, relieved of displaying, storing, and managing themselves, can be focused on expressing the model. The key goal is isolation; a layered architecture is one way to reach it, and hexagonal and related patterns serve as well or better to the degree that they keep the model's expression free of references to other system concerns. Domain-Driven Design demands the isolation, not any one architecture around it."
  entity: "An object defined primarily by its identity rather than its attributes: a thread of identity that runs through time and often across distinct representations, whose attributes may change while it stays the same thing. The model defines what it means to be the same thing."
  value_object: "An object that describes or computes some characteristic of a thing and has no conceptual identity: it matters only as the combination of its attributes, two with the same attribute values are equal, and it is treated as immutable, with every operation a side-effect-free function."
  invariant: "A consistency rule that must hold whenever the objects it constrains can be observed: an aggregate's invariants hold at the end of every operation on the aggregate, and a value object's invariants hold for every value that exists. The aggregate root, or the value object's constructor, is responsible for enforcing it, so that a state violating it is never reachable. In the code an invariant is stated as an assertion."
  assertion: "A stated post-condition of an operation or invariant of a class or aggregate, made explicit so that the effect of an operation can be known without tracing its implementation. Assertions define the contracts of services and entity modifiers and the invariants on aggregates; where they cannot be coded directly, they are written as automated unit tests."
  specification: "A predicate-like value object that tells whether a candidate object matches some criteria, separating the statement of what kind of objects can be selected from the object that does the selecting. It answers through one operation, isSatisfiedBy, and can be combined with other specifications."
  business_rule: "A rule of the business as a domain expert states it, before the model has placed it. Once placed it is an invariant, when it must hold at all times for an aggregate or a value; an assertion, when it is a guarantee of one command of a root or one operation of a domain service; a specification, when experts pass the predicate around as a thing they name; or not a domain rule, when it is a programming guard or an application policy such as notifying or exporting. It is an intake word and is never recorded as its own section."
  aggregate: "A cluster of entities and value objects with a boundary around it, treated as a single unit for the purpose of data changes. The one boundary is three things at once. It is a consistency boundary: properties and invariants are defined for the aggregate as a whole, the root enforces them, and inside the boundary consistency rules apply synchronously while across it updates are handled asynchronously. It is a transactional boundary: the aggregate is loaded, saved, and removed whole, one transaction changes one aggregate, and transactions do not cross the boundary. It is a reference boundary: one entity is the root, external objects hold references to the root only, a member's identity is local to the aggregate, and what one aggregate keeps of another is that aggregate's identity."
  aggregate_root: "The one entity of an aggregate that external objects may hold references to, that carries the aggregate's globally unique identity, and that is responsible for enforcing the aggregate's invariants."
  command: "An operation of an aggregate root that changes the state of that one aggregate and returns no domain information, named for what it does in the ubiquitous language. It is never a setter, and it is never the request a use case receives."
  query: "An operation of an aggregate or a value object that returns a result and changes no observable state; Evans calls it a side-effect-free function. No operation is both a query and a command."
  domain_event: "A full-fledged part of the domain model representing something that happened in the domain that domain experts care about, as distinct from a system event. It is ordinarily immutable, being a record of the past, and typically carries the time it occurred and the identities of the entities involved."
  domain_service: "A standalone operation in the domain for a significant process or transformation that is not a natural responsibility of an entity or value object, given a name that is part of the ubiquitous language and a contract stated as assertions. It makes a business decision that no one aggregate or value can make alone; it may read through repositories, but it never commits and never publishes. ArcLint's own convention, which no cited source states: \"it never commits and never publishes\"."
  application_service: "An operation of the application layer that runs one use case flow: it translates the request into domain values, fetches aggregates through repositories, invokes their commands or one domain service, commits, and publishes what happened, holding application logic that is not business logic and never the domain rules themselves. Use case is the same thing seen from the request; the two words are not two kinds."
  repository: "For each type of aggregate that needs global access, a service that provides the illusion of an in-memory collection of all objects of that aggregate's root type, with methods to add and remove objects and to select them by criteria meaningful to domain experts, encapsulating the storage and query technology."
  factory: "A separate object that encapsulates the creation of an entire, internally consistent aggregate, or of a complex value object, when construction becomes complicated or would reveal too much internal structure; it creates the whole as a piece, enforcing its invariants, without requiring the client to reference the concrete classes being instantiated."
  module: "A named partition of the code that tells the story of the system and contains a cohesive set of concepts, its name part of the ubiquitous language and reflecting insight into the domain, chosen so that the concepts inside can be understood and reasoned about independently."
  # Structural vocabulary
  zone: "A named, physical partition of the codebase resolved via file paths or directory boundaries. It acts as a jurisdictional area where a specific set of architectural rules, technology constraints, and dependency rules are strictly enforced."
  question: "Something about a bounded context's model that the team has not settled, recorded in the domain file in place of a guess so that the gap is visible and can be answered. A question is never a rule; arclint enforces nothing from it and reports it only when asked what is open."

