name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pinned repository tools
        uses: jdx/mise-action@v4
        with:
          install_args: "aqua:golangci/golangci-lint gitleaks"

      # make ci is the same full gate used locally and by hk: formatting,
      # GolangCI, vet, tests, and ArcLint's repository selfcheck.
      - name: Run full repository check
        run: make ci
