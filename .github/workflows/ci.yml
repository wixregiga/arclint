name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pinned repository tools
        uses: jdx/mise-action@v4
        with:
          install_args: "node aqua:golangci/golangci-lint aqua:stoplightio/spectral gitleaks"

      - name: Install Studio test dependencies
        run: |
          make web-install
          cd web && npx playwright install --with-deps chromium

      # make ci is the same full gate used locally and by hk: formatting,
      # GolangCI, vet, tests, the Spectral schema gate, and ArcLint's
      # repository selfcheck.
      - name: Run full repository check
        run: make ci
