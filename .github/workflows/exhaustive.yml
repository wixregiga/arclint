name: Exhaustive

# The CML property sweeps and the domain-sweep lexer oracles in full. make
# ci runs a fixed sample of each so pull requests stay fast; this runs
# every case once a night and on demand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run every case of the long sweeps
        run: make test-exhaustive
