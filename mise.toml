# Repo tool pins. HK_MISE plus the postinstall hook wire git hooks
# through `mise x`, so hooks work without mise activated in the shell
# (https://hk.jdx.dev/mise_integration.html).
[tools]
hk = "1.49.0"
"aqua:golangci/golangci-lint" = "2.12.2"
goreleaser = "2.13.0"
gitleaks = "8.30.1"
zola = "0.21.0"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks]
configure-local = "make configure-local"
build = "make build"
test = "make test"
vet = "make vet"
fmt-check = "make fmt-check"
fmt = "make fmt"
lint = "make lint"
lint-fix = "make lint-fix"
generate = "make generate"
selfcheck = "make selfcheck"
verify = "make verify"
check = "make check"
bench = "make bench"
agentbench = "make agentbench"
docs = "make docs"
docs-serve = "make docs-serve"
docker = "make docker"
release = "make release"
ci = "make ci"
clean = "make clean"
