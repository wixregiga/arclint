# Repo tool pins. HK_MISE plus the postinstall hook wire git hooks
# through `mise x`, so hooks work without mise activated in the shell
# (https://hk.jdx.dev/mise_integration.html).
[tools]
hk = "1.49.0"
"aqua:golangci/golangci-lint" = "2.13.2"
"aqua:stoplightio/spectral" = "6.16.3"
goreleaser = "2.13.0"
gitleaks = "8.30.1"
zola = "0.21.0"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks]
build = "make build"
test = "make test"
vet = "make vet"
fmt = "make fmt"
lint = "make lint"
schemas = "make schemas"
lint-schema = "make lint-schema"
check = "make check"
check-ro = "make check-ro"
ci = "make ci"
release = "make release"
clean = "make clean"

# The mirror of make generate. Each --only names one generator; repeat it
# to run several. The Makefile owns the generators, their order and the
# check that a name is one of them.
[tasks.generate]
description = "Regenerate every generated file, for the root and testing/boxoffice"
usage = 'flag "--only <generator>" var=#true help="Run only this generator: go, schemas, cml, sdk, skill or agents-md; repeat for several"'
run = 'make generate ONLY="${usage_only:-}"'
