# Conforming case: dependence flows downstream to upstream; the
# conformance context imports the rule context, exactly as the
# recorded conformist relation permits. The rule under test is the
# built-in every recorded relation carries; nothing is installed.
rule: "context_relation/imports-follow-influence"
files:
  domain.arclint.yaml: |
    version: 1
    project: fixture
    contexts:
      rule:
        definition: The rules an architecture is held to.
      conformance:
        definition: The judgement of code against the rules.
    relations:
      - from: rule
        to: conformance
        kind: conformist
  go.mod: |
    module fixture

    go 1.26
  internal/domain/rule/root.go: |
    package rule

    type Rule struct{}
  internal/domain/conformance/check.go: |
    package conformance

    import "fixture/internal/domain/rule"

    type Check struct{ Rule rule.Rule }
expect: []
