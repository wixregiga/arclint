# Violating case: one recorded aggregate misses its repository file,
# another has no home at all; the one rule reports each derived glob
# no file satisfies.
rule: "domain-model/aggregate-skeleton"
files:
  domain.arclint.yaml: |
    version: 1
    project: fixture
    contexts:
      ordering:
        definition: Customers turning products into orders.
        aggregates:
          Order:
            definition: A customer's request to purchase products.
            identity: OrderID
      billing:
        definition: Turning confirmed orders into money owed.
        aggregates:
          Invoice:
            definition: The bill issued for a confirmed order.
            identity: InvoiceID
  internal/domain/order/root.go: |
    package order

    type Order struct{}
expect:
  - kind: violation
    path: internal/domain/order/repository.go
    line: 0
    message: "Zone \"domain\" is missing a required file matching \"internal/domain/order/repository.go\""
  - kind: violation
    path: internal/domain/invoice/root.go
    line: 0
    message: "Zone \"domain\" is missing a required file matching \"internal/domain/invoice/root.go\""
  - kind: violation
    path: internal/domain/invoice/repository.go
    line: 0
    message: "Zone \"domain\" is missing a required file matching \"internal/domain/invoice/repository.go\""
