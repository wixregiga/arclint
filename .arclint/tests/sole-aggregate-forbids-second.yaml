# Violating case: a second aggregate directory appears beside the Rule
# aggregate; the structure rule must report the forbidden file.
rule: "domain/rule-is-sole-aggregate"
files:
  internal/domain/rule/root.go: |
    package rule
  internal/domain/pattern/pattern.go: |
    package pattern
expect:
  - kind: violation
    path: internal/domain/pattern/pattern.go
    message: "path forbidden by structure rule \"internal/domain/pattern/**\" of Module \"domain\""
