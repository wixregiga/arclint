# Violating case: the upstream rule context imports the downstream
# conformance context, against the recorded conformist relation.
rule: "context_relation/imports-follow-influence"
files:
  domain.arclint.yaml: |
    version: 1
    project: fixture
    contexts:
      rule:
        definition: The rules an architecture is held to.
      conformance:
        definition: The judgement of code against the rules.
    relations:
      - from: rule
        to: conformance
        kind: conformist
  go.mod: |
    module fixture

    go 1.26
  internal/domain/rule/root.go: |
    package rule

    import "fixture/internal/domain/conformance"

    type Rule struct{ Check conformance.Check }
  internal/domain/conformance/check.go: |
    package conformance

    type Check struct{}
expect:
  - kind: violation
    path: internal/domain/rule/root.go
    line: 3
    message: "context rule imports context conformance (fixture/internal/domain/conformance) against the recorded conformist relation: rule is upstream of conformance, and only the downstream imports the upstream"
