# Violating case: composition imports the plain report adapter
# directly instead of selecting it through report_factory.
rule: "delivery/plain-report-factory-only"
files:
  go.mod: |
    module fixture

    go 1.26
  cmd/arclint/main.go: |
    package main

    import _ "fixture/internal/delivery/cli/adapters/report/plain"

    func main() {}
  internal/delivery/cli/adapters/report/plain/plain.go: |
    package plain
expect:
  - kind: violation
    path: cmd/arclint/main.go
    line: 3
    message: "Module \"plain_report\" is protected (importable only by [\"report_factory\"]); import of \"fixture/internal/delivery/cli/adapters/report/plain\" from Module(s) [\"composition\"]"
