# Conforming case: the domain error names its subject, so the
# content rule must stay silent; proves the pattern does not overfire
# on ErrDefinitionNotFound.
rule: "domain/errors-name-their-subject"
files:
  internal/domain/vocab/language.go: |
    package vocab

    import "errors"

    // ErrDefinitionNotFound reports that a named definition is absent
    // from the project's recorded vocabulary.
    var ErrDefinitionNotFound = errors.New("definition not found in the project domain model")
expect: []
