# Violating case: composition imports the JSON report adapter
# directly instead of selecting it through report_factory.
rule: "arclint:delivery/json-report-factory-only"
files:
  go.mod: |
    module fixture

    go 1.26
  cmd/arclint/main.go: |
    package main

    import _ "fixture/internal/delivery/cli/adapters/report/json"

    func main() {}
  internal/delivery/cli/adapters/report/json/json.go: |
    package json
expect:
  - kind: violation
    path: cmd/arclint/main.go
    line: 3
    message: "Module \"json_report\" is protected (importable only by [\"report_factory\"]); import of \"fixture/internal/delivery/cli/adapters/report/json\" from Module(s) [\"composition\"]"
