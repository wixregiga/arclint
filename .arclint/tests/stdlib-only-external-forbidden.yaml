# Violating case: a domain file imports a declared external dependency;
# the consumes rule forbids external imports for the domain Module.
rule: "arclint:domain/stdlib-only"
files:
  go.mod: |
    module fixture

    go 1.26

    require github.com/pkg/errors v0.9.1
  internal/domain/rule/thing.go: |
    package rule

    import (
        "fmt"

        "github.com/pkg/errors"
    )

    func Wrap(err error) error { return errors.Wrap(err, fmt.Sprint("wrapped")) }
expect:
  - kind: violation
    path: internal/domain/rule/thing.go
    line: 6
    message: "external import \"github.com/pkg/errors\" is forbidden for Module \"domain\""
