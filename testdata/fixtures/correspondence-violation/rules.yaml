runtime: [go]

modules:
  entities: ["internal/entities/**"]
  setup: ["internal/setup/**"]

contracts:
  entities:
    provides:
      - kind: correspondence
        of: { files: 'internal/entities/[^/]+_(?P<substrate>[a-z0-9]+)\.go', value: "{substrate}" }
        in:
          files: 'internal/setup/(?:[^/]+/)*(?P<substrate>[a-z0-9]+)\.go'
          value: "{substrate}"
        relation: subset
