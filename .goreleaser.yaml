# goreleaser configuration for arclint.
# Publishes CGO-free Linux amd64/arm64 tarballs and checksums for beta tags
# (vMAJOR.MINOR.PATCH-beta.N). Local dry-runs use `make release` /
# `mise run release` (snapshot, no publish).
version: 2

project_name: arclint

builds:
  - main: ./cmd/arclint
    binary: arclint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      # Keep in lockstep with Makefile GRAMMARS.
      - -tags=grammar_subset,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_python
    ldflags:
      - -s -w

archives:
  - formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Env.ARCLINT_VERSION }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^chore"

# Snapshot dry-runs (make release) use the authoritative version file.
snapshot:
  version_template: "{{ .Env.ARCLINT_VERSION }}-snapshot-{{ .ShortCommit }}"

release:
  github:
    owner: wixregiga
    name: arclint
  name_template: "v{{ .Env.ARCLINT_VERSION }}"
  # Every published tag is a beta; always mark the GitHub release prerelease.
  prerelease: true
  # Betas must not become the repository "latest" release.
  make_latest: false
