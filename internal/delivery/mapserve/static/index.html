<!DOCTYPE html>
<!--
ArcLint Studio: the project's recorded Ubiquitous Language as a map,
served by arclint map serve. The page loads /api/overview, the document
`arclint domain overview --format json` prints, and /api/accepted, the
same document as the remote's default branch records it, and draws them
with studio.js: a navigator of the bounded contexts, a concept map of
the active context, and an inspector of what the domain file records.
Entries are edited as drafts; Publish posts each draft to /api/define or
/api/remove, the define and remove the command line runs. New project
posts to /api/projects: the server creates the project in its own git
repository and serves it from then on, so its domain is built here.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcLint Studio</title>
<style>
  :root{
    --bg:#fff; --chrome:#fafafa; --line:#e7e7e9; --ink:#111; --muted:#6b6b72; --faint:#f1f1f3;
    --sel:#4a90ff; --selbg:#eaf2ff; --missing:#e5484d; --draft:#d97706; --proposed:#2563eb; --accepted:#16a34a;
    --c-bounded_context:#8AB4FF; --c-aggregate:#f2b705; --c-entity:#3b82f6; --c-value_object:#0ea5a4;
    --c-domain_event:#22c55e; --c-domain_service:#f97316; --c-invariant:#7c5cd6; --c-assertion:#a855f7;
    --c-specification:#64748b; --c-question:#e5484d;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font:13px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--bg);
    display:grid;grid-template:44px 1fr 24px/240px 1fr 320px;}
  .bar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--bg)}
  .bar .grow{flex:1}
  .bar .name{font-weight:600}
  .crumb b{font-weight:600} .crumb span{color:var(--muted)}
  .bar .source{color:var(--muted);font-size:11px}
  button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:#fff;color:var(--ink);cursor:pointer}
  button:hover{background:var(--faint)} button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)} button.primary:hover{background:#333}
  button.danger{color:var(--missing)}
  button.on{background:var(--selbg);border-color:var(--sel)}
  .nav{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  h4{margin:0;padding:12px 12px 8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
  h4 span{color:var(--muted);font-weight:400} h4 .grow{flex:1}
  h4 button{padding:1px 7px;font-size:11px}
  .tree{overflow:auto;min-height:0;flex:1}
  .tree div{padding:4px 12px;display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree div:hover{background:var(--faint)}
  .tree .sel{background:var(--selbg)}
  .tree .dim{opacity:.3}
  .tree .ctx{font-weight:600}
  .tree .add{color:var(--muted);font-weight:400}
  .dot{width:8px;height:8px;border-radius:99px;flex:none}
  .mark{margin-left:auto;font-size:9px;padding:0 5px;border-radius:99px;color:#fff;flex:none}
  .mark.Draft{background:var(--draft)} .mark.Proposed{background:var(--proposed)} .mark.Accepted{background:var(--accepted)} .mark.Removed{background:var(--missing)}
  .canvas{position:relative;background:var(--chrome);overflow:hidden}
  .find{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
  .find input,.find select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;color:var(--ink);outline:0}
  .find input{width:220px} .find input::placeholder{color:var(--muted);opacity:1}
  .stage{position:absolute;inset:0;transform-origin:50% 46%;transition:transform .18s ease}
  .enclosure{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:440px;height:250px;
    border:1.5px solid var(--sel);border-radius:14px;background:#fff}
  .enclosure .tag{position:absolute;top:-10px;left:12px;background:var(--sel);color:#fff;font-size:11px;padding:1px 6px;border-radius:4px}
  .node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer;
    transform:translateX(-50%);white-space:nowrap;border-radius:4px}
  .node.left,.node.right{transform:none} .node.muted{color:var(--muted)}
  .node.member{flex-direction:row;gap:6px;line-height:12px} .node.member .dot{flex:none} .node.member span.t{min-width:0}
  .node .dot{width:12px;height:12px}
  .node.Draft .dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--draft)} .node.Proposed .dot{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--proposed)}
  .node span.t{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .node.on{outline:1.5px solid var(--sel);outline-offset:3px}
  .node.dim{opacity:.22}
  svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .legend{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
  .legend span.off{opacity:.45;text-decoration:line-through}
  .zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:10px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted)}
  .zoom span[data-zoom]{cursor:pointer;user-select:none}
  .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
  .empty code{display:block;margin-top:8px;color:var(--ink)}
  .insp{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .insp .body{overflow:auto;min-height:0;flex:1}
  .insp .kind{display:flex;gap:6px;align-items:center;padding:0 12px 6px;color:var(--muted);font-size:11px}
  .sec{border-bottom:1px solid var(--line);padding-bottom:10px}
  .row{display:grid;grid-template-columns:96px 1fr;align-items:start;gap:6px;padding:3px 12px}
  .row label{color:var(--muted);padding-top:4px;overflow-wrap:anywhere}
  .row .values{display:flex;flex-wrap:wrap;gap:4px}
  .row .v{background:var(--faint);border-radius:6px;padding:4px 8px;overflow-wrap:anywhere}
  .row .v.miss{color:var(--missing);background:#fdeeee}
  .row .v.was{text-decoration:line-through;color:var(--muted);background:transparent;padding-left:0}
  .row .v.now{background:#fff7ed}
  .row input,.row textarea,.row select{font:inherit;width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff;color:var(--ink);outline:0}
  .row textarea{min-height:64px;resize:vertical}
  .row .req{color:var(--missing)}
  .row .choices{display:flex;flex-wrap:wrap;gap:4px 12px;padding-top:4px}
  .row .choices label{color:var(--ink);padding:0;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow-wrap:normal}
  .row .choices input{width:auto;margin:0}
  .actions{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
  .note{padding:4px 12px;color:var(--muted);font-size:11px}
  .note.err{color:var(--missing)}
  .change{padding:6px 12px;border-bottom:1px solid var(--faint)}
  .change .head{display:flex;gap:6px;align-items:center}
  .change .head b{font-weight:600} .change .head span{color:var(--muted)}
  .change .head button{margin-left:auto;padding:1px 7px;font-size:11px}
  .change .field{display:grid;grid-template-columns:84px 1fr;gap:6px;padding:2px 0;font-size:12px}
  .change .field label{color:var(--muted)}
  .change .field s{color:var(--muted)} .change .field ins{text-decoration:none;background:#fff7ed}
  .status{grid-column:1/-1;border-top:1px solid var(--line);padding:0 12px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .status .grow{flex:1}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <header class="bar">
    <span class="name">ArcLint Studio</span>
    <span class="crumb" id="crumb"></span>
    <span class="grow"></span>
    <button id="newProject" title="Start a new project in its own git repository">New project</button>
    <button id="changes" title="What the drafts and the domain file change">Changes</button>
    <button id="publish" class="primary" title="Record every draft in the domain file">Publish</button>
    <span class="source" id="source"></span>
  </header>
  <aside class="nav">
    <h4>Navigator <span class="grow"></span><button id="addContext" title="Draft a bounded context">+ context</button></h4>
    <div class="tree" id="tree"></div>
  </aside>
  <main class="canvas" id="canvas">
    <div class="find">
      <input id="query" placeholder="Search the context" autocomplete="off" spellcheck="false" aria-label="Search the context">
      <select id="filter" aria-label="Concept"><option value="">All concepts</option></select>
    </div>
    <div class="stage" id="stage"><div class="enclosure" id="enclosure"></div></div>
    <div class="legend" id="legend"></div>
    <div class="zoom"><span data-zoom="-1">&minus;</span><span id="zoomPct">100%</span><span data-zoom="1">+</span></div>
    <div class="empty" id="empty" hidden></div>
  </main>
  <aside class="insp">
    <h4 id="inspectorTitle">Inspector <span>(as recorded)</span></h4>
    <div class="body" id="inspector"></div>
  </aside>
  <footer class="status"><span id="path"></span><span class="grow"></span><span id="message"></span><span class="grow"></span><span id="counts"></span></footer>
<script src="studio.js"></script>
<script>
(function () {
  'use strict';
  var S = window.Studio;
  function $(id) { return document.getElementById(id); }
  var esc = S.esc;
  function colour(concept) { return 'var(--c-' + concept + ')'; }

  /* directory is the project served, beside where a new one is suggested;
     recorded is its domain file as it is; accepted the default branch's, or
     null with the reason; doc is recorded with the drafts applied, what the
     page draws. view is 'map', 'changes' or 'project'; edit is the entry
     form being filled, project the new project's. */
  var st = { directory: '', beside: '', recorded: null, accepted: null, acceptedBranch: '', acceptedReason: '', doc: null, drafts: [], publishing: false, context: null, concepts: [], sel: null,
    query: '', filter: '', hidden: {}, zoom: 1, fit: 1, view: 'map', edit: null, project: null, creating: false, message: '', results: [] };

  function selected() { return st.sel ? S.byId(st.concepts, st.sel) : null; }
  function shown(c) { return !st.hidden[c.concept] && S.matches(c, st.query, st.filter); }
  function keyOf(c) { return S.key(st.context.name, c.concept, S.ownerName(st.concepts, c), c.name); }
  function contextKey(name) { return S.key(name, 'bounded_context', '', name); }
  /* The standing of one entry: Draft when a draft touches it, else against the accepted recording. */
  function standingOf(k) {
    if (S.draftOf(st.drafts, k)) return 'Draft';
    if (!st.accepted) return '';
    return st.proposed[k] || 'Accepted';
  }

  function rebuild() {
    st.doc = S.applyDrafts(st.recorded, st.drafts);
    st.proposed = S.standing(st.accepted, st.doc);
    var name = st.context && st.context.name;
    st.context = S.context(st.doc, name);
    st.concepts = st.context ? S.conceptsOf(st.context) : [];
    if (st.sel && !S.byId(st.concepts, st.sel)) st.sel = null;
  }
  function selectContext(name) {
    st.context = S.context(st.doc, name);
    st.concepts = st.context ? S.conceptsOf(st.context) : [];
    st.sel = null; st.edit = null; st.view = 'map';
    render();
  }

  /* The standing badge: the navigator shows only what stands out, Draft
     or Proposed; the inspector names Accepted too. */
  function mark(k, full) { var s = standingOf(k); return s && (full || s !== 'Accepted') ? '<span class="mark ' + s + '">' + s + '</span>' : ''; }
  function renderNavigator() {
    var h = '';
    (st.doc.contexts || []).forEach(function (ctx) {
      var on = st.context && ctx.name === st.context.name;
      h += '<div data-ctx="' + esc(ctx.name) + '" class="ctx' + (on && !st.sel ? ' sel' : '') + '" title="' + esc(S.CONCEPT_LABEL.bounded_context + ': ' + ctx.name) + '">' +
        '<span class="dot" style="background:' + colour('bounded_context') + '"></span>' + esc(ctx.name) + mark(contextKey(ctx.name)) + '</div>';
      if (!on) return;
      S.navigator(st.concepts).forEach(function (r) {
        var c = r.c;
        h += '<div data-id="' + esc(c.id) + '" class="' + (st.sel === c.id ? 'sel' : '') + (shown(c) ? '' : ' dim') + '" style="padding-left:' + (r.depth === 1 ? 24 : 36) + 'px" title="' + esc(S.CONCEPT_LABEL[c.concept] + ': ' + c.name) + '">' +
          '<span class="dot" style="background:' + colour(c.concept) + '"></span>' + esc(c.name) + mark(keyOf(c)) + '</div>';
      });
      h += '<div data-add="1" class="add" style="padding-left:24px">+ entry</div>';
    });
    $('tree').innerHTML = h;
  }

  function nodeHTML(c, p, width) {
    var cls = ['node', p.align === 'left' ? 'left' : p.align === 'right' ? 'right' : '', st.sel === c.id ? 'on' : '', shown(c) ? '' : 'dim',
      c.concept === 'invariant' || c.concept === 'assertion' || c.concept === 'question' ? 'muted' : '', p.member ? 'member' : '', standingOf(keyOf(c))].join(' ');
    var style = 'top:' + p.y + 'px;' + (p.align === 'left' ? 'left:' + p.x + 'px;' : p.align === 'right' ? 'right:' + (width - p.x) + 'px;' : 'left:' + p.x + 'px;') +
      (p.maxWidth ? 'max-width:' + p.maxWidth + 'px;' : '');
    return '<div class="' + cls + '" style="' + style + '" data-id="' + esc(c.id) + '" title="' + esc(S.CONCEPT_LABEL[c.concept] + ': ' + S.label(c)) + '">' +
      '<span class="dot" style="background:' + colour(c.concept) + '"></span><span class="t">' + esc(c.name) + '</span></div>';
  }

  function renderCanvas() {
    var enclosure = $('enclosure');
    if (!st.context) { enclosure.hidden = true; $('legend').innerHTML = ''; return; }
    enclosure.hidden = false;
    var viewport = { width: $('canvas').clientWidth || 740, height: $('canvas').clientHeight || 500 };
    var L = S.layout(st.concepts, viewport);
    enclosure.style.width = L.width + 'px';
    enclosure.style.height = L.height + 'px';
    var h = '<span class="tag">' + esc(st.context.name) + '</span><svg viewBox="0 0 ' + L.width + ' ' + L.height + '">' +
      L.lines.map(function (l) { return '<line x1="' + l[0] + '" y1="' + l[1] + '" x2="' + l[2] + '" y2="' + l[3] + '" stroke="#c9ccd3"/>'; }).join('') + '</svg>';
    st.concepts.forEach(function (c) { var p = L.positions[c.id]; if (p) h += nodeHTML(c, p, L.width); });
    enclosure.innerHTML = h;
    st.fit = S.fit(L, viewport);
    $('stage').style.transform = 'scale(' + (st.zoom * st.fit) + ')';
    $('zoomPct').textContent = Math.round(st.zoom * st.fit * 100) + '%';
    $('legend').innerHTML = S.legend(st.concepts).map(function (k) {
      return '<span data-legend="' + k + '" class="' + (st.hidden[k] ? 'off' : '') + '"><i class="dot" style="background:' + colour(k) + '"></i>' + esc(S.CONCEPT_LABEL[k]) + '</span>';
    }).join('');
  }

  /* The accepted value of one property of the selected entry, when it differs. */
  function acceptedProperties(k) {
    if (!st.accepted) return null;
    var e = S.catalog(st.accepted).entries[k];
    return e ? e.properties : null;
  }
  function valuesHTML(r, was) {
    var h = r.missing ? '<span class="v miss">missing</span>' : r.values.length ? r.values.map(function (v) { return '<span class="v' + (was ? ' now' : '') + '">' + esc(v) + '</span>'; }).join('') : '<span class="v" style="color:var(--muted)">none</span>';
    if (was) h += '<span class="v was" title="as accepted">' + esc(Array.isArray(was) ? was.join(', ') : was) + '</span>';
    return h;
  }
  var ROW_PROPERTY = { Definition: 'definition', Statement: 'statement', On: 'on', Identity: 'identity', Aliases: 'aliases', Repository: 'repository', Factory: 'factory', 'Raised by': 'raisedBy', 'Verified by': 'verifiedBy', Text: 'text' };
  /* The entry's sections; in the first, a property the accepted recording
     holds differently shows the accepted value struck through. */
  function renderEntry(sections, k) {
    var was = acceptedProperties(k);
    var current = S.catalog(st.doc).entries[k];
    return sections.map(function (sec, i) {
      return '<div class="sec"><h4>' + esc(sec.heading) + (i === 0 ? mark(k, true) : '') + '</h4>' + (sec.kind ? '<span class="kind">' + esc(sec.kind) + '</span>' : '') +
        sec.rows.map(function (r) {
          var p = i === 0 && was && current && ROW_PROPERTY[r.field];
          var differs = p && !sameText(was[p], current.properties[p]) ? was[p] : null;
          return '<div class="row"><label>' + esc(r.field) + '</label><span class="values">' + valuesHTML(r, differs) + '</span></div>';
        }).join('') + '</div>';
    }).join('');
  }
  function sameText(a, b) { return (Array.isArray(a) ? a.join('\n') : String(a == null ? '' : a)) === (Array.isArray(b) ? b.join('\n') : String(b == null ? '' : b)); }

  function entryActions(k, concept) {
    var d = S.draftOf(st.drafts, k);
    return '<div class="actions"><button data-act="edit">Edit</button>' +
      (concept === 'bounded_context' ? '' : '<button data-act="remove" class="danger">Remove</button>') +
      (concept === 'bounded_context' ? '<button data-act="remove" class="danger">Remove context</button>' : '') +
      (d ? '<button data-act="discard">Discard draft</button>' : '') + '</div>' +
      (d && d.error ? '<div class="note err">' + esc(d.error) + '</div>' : '');
  }

  function renderForm() {
    var e = st.edit, h = '';
    var isNew = !e.properties;
    h += '<div class="sec"><h4>' + (isNew ? 'New entry' : 'Edit ' + esc(e.name)) + '</h4>';
    if (isNew) {
      h += '<div class="row"><label>Concept</label><select data-f="concept">' + S.CONCEPTS.filter(function (c) { return e.concept === 'bounded_context' ? c === 'bounded_context' : c !== 'bounded_context'; })
        .map(function (c) { return '<option value="' + c + '"' + (c === e.concept ? ' selected' : '') + '>' + esc(S.CONCEPT_LABEL[c]) + '</option>'; }).join('') + '</select></div>';
      var owners = S.ownersFor(st.concepts, e.concept);
      if (S.OWNER_CONCEPTS[e.concept]) {
        h += '<div class="row"><label>Owner <span class="req">*</span></label><select data-f="owner">' + (owners.length ? '' : '<option value="">none recorded</option>') +
          owners.map(function (o) { return '<option value="' + esc(o.name) + '"' + (o.name === e.owner ? ' selected' : '') + '>' + esc(o.name) + ' (' + esc(S.CONCEPT_LABEL[o.concept]) + ')</option>'; }).join('') + '</select></div>';
      }
      h += '<div class="row"><label>' + (S.PROPERTIES[e.concept][0].name === 'statement' || e.concept === 'question' ? 'Key' : 'Name') + ' <span class="req">*</span></label><input data-f="name" value="' + esc('name' in e.values ? e.values.name : e.name) + '" spellcheck="false"></div>';
    }
    S.form(e.concept, e.properties).forEach(function (f) {
      var v = e.values && f.name in e.values ? e.values[f.name] : f.value;
      h += '<div class="row"><label>' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + (f.list ? '<br><span style="font-size:10px">one per line</span>' : '') + '</label>' +
        (f.long || f.list ? '<textarea data-f="' + f.name + '">' + esc(v) + '</textarea>' : '<input data-f="' + f.name + '" value="' + esc(v) + '" spellcheck="false">') + '</div>';
    });
    h += '<div class="actions"><button data-act="save" class="primary">Save draft</button><button data-act="cancel">Cancel</button></div>';
    if (e.error) h += '<div class="note err">' + esc(e.error) + '</div>';
    h += '<div class="note">A draft is published through arclint domain define, which checks it; the standing shows what it changes.</div></div>';
    return h;
  }

  /* One change of the Changes view; a draft's Discard names the draft by
     its place in the list, so no key travels through the markup. */
  function changeHTML(t, index) {
    var draft = index != null;
    var h = '<div class="change"><div class="head"><span class="mark ' + (draft ? 'Draft' : 'Proposed') + '">' + (t.kind) + '</span><b>' + esc(t.name) + '</b><span>' +
      esc(S.CONCEPT_LABEL[t.concept]) + (t.owner ? ' of ' + esc(t.owner) : '') + (t.context ? ' in ' + esc(t.context) : '') + '</span>' +
      (draft && S.draftOf(st.drafts, t.key) ? '<button data-discard="' + index + '">Discard</button>' : '') + '</div>';
    t.fields.forEach(function (f) {
      var before = f.before == null ? '' : Array.isArray(f.before) ? f.before.join(', ') : f.before;
      var after = f.after == null ? '' : Array.isArray(f.after) ? f.after.join(', ') : f.after;
      h += '<div class="field"><label>' + esc(f.field) + '</label><span>' + (before ? '<s>' + esc(before) + '</s> ' : '') + (after ? '<ins>' + esc(after) + '</ins>' : '') + '</span></div>';
    });
    var d = draft ? S.draftOf(st.drafts, t.key) : null;
    if (t.unplaced) h += '<div class="note err">Nothing records ' + esc(t.owner || t.context) + ' for this draft to sit under; discard it, or draft that first.</div>';
    if (d && d.error) h += '<div class="note err">' + esc(d.error) + '</div>';
    return h + '</div>';
  }
  function renderChanges() {
    var drafts = st.draftChanges = S.transformation(st.recorded, st.doc);
    /* A draft the preview cannot place (its owner is neither recorded nor
       drafted) still gets a row, so it can be seen and discarded. */
    var placed = {};
    drafts.forEach(function (t) { placed[t.key] = true; });
    st.drafts.forEach(function (d) {
      if (!placed[d.key]) drafts.push({ key: d.key, context: d.context, concept: d.concept, owner: d.owner, name: d.name, kind: 'not placed', fields: [], unplaced: true });
    });
    var proposed = st.accepted ? S.transformation(st.accepted, st.recorded) : [];
    var h = '<div class="sec"><h4>Drafts <span>(' + drafts.length + ', not yet in ' + esc(st.recorded.source || 'the domain file') + ')</span></h4>' +
      (drafts.length ? drafts.map(function (t, i) { return changeHTML(t, i); }).join('') : '<div class="note">Edit an entry, or add one, to draft a change.</div>') + '</div>';
    h += '<div class="sec"><h4>Proposed <span>(' + proposed.length + ', in ' + esc(st.recorded.source || 'the domain file') + (st.accepted ? ', not yet accepted' : '') + ')</span></h4>';
    if (!st.accepted) h += '<div class="note" title="' + esc(st.acceptedReason) + '">There is no accepted language to compare with, so no entry shows as Accepted or Proposed.</div>';
    else h += proposed.length ? proposed.map(function (t) { return changeHTML(t, null); }).join('') : '<div class="note">The domain file records only what is accepted.</div>';
    h += '</div>';
    if (st.results.length) h += '<div class="sec"><h4>Published</h4>' + st.results.map(function (r) { return '<div class="note' + (r.error ? ' err' : '') + '">' + esc(r.text) + '</div>'; }).join('') + '</div>';
    return h;
  }

  var LANGUAGES = [['go', 'Go'], ['ts', 'TypeScript'], ['py', 'Python']];
  function renderProjectForm() {
    var p = st.project;
    var h = '<div class="sec"><h4>New project</h4>' +
      '<div class="row"><label>Directory <span class="req">*</span></label><input data-p="directory" value="' + esc(p.directory) + '" spellcheck="false"></div>' +
      '<div class="row"><label>Name</label><input data-p="name" value="' + esc(p.name) + '" placeholder="the directory\'s name" spellcheck="false"></div>' +
      '<div class="row"><label>Languages</label><span class="choices">' + LANGUAGES.map(function (l) {
        return '<label><input type="checkbox" data-lang="' + l[0] + '"' + (p.languages.indexOf(l[0]) >= 0 ? ' checked' : '') + '>' + esc(l[1]) + '</label>';
      }).join('') + '</span></div>' +
      '<div class="actions"><button data-act="create" class="primary"' + (st.creating ? ' disabled' : '') + '>' + (st.creating ? 'Creating…' : 'Create') + '</button><button data-act="cancel">Cancel</button></div>';
    if (p.error) h += '<div class="note err">' + esc(p.error) + '</div>';
    h += '<div class="note">Creates the directory with a git repository, a starter rules.arclint.yaml and an empty domain file, then shows the project here to build its domain. The directory must be new or empty.</div>';
    if (st.drafts.length) h += '<div class="note err">' + st.drafts.length + ' draft' + (st.drafts.length === 1 ? ' is' : 's are') + ' not published in ' + esc(st.doc.project || st.directory) + '; creating a project discards ' + (st.drafts.length === 1 ? 'it' : 'them') + '.</div>';
    return h + '</div>';
  }

  function renderInspector() {
    if (st.view === 'project') { $('inspectorTitle').innerHTML = 'Project <span>(a new git repository)</span>'; $('inspector').innerHTML = renderProjectForm(); return; }
    if (st.view === 'changes') { $('inspectorTitle').innerHTML = 'Changes <span>(the transformation)</span>'; $('inspector').innerHTML = renderChanges(); return; }
    $('inspectorTitle').innerHTML = 'Inspector <span>(as recorded' + (st.drafts.length ? ', with drafts' : '') + ')</span>';
    if (st.edit) { $('inspector').innerHTML = renderForm(); return; }
    if (!st.context) { $('inspector').innerHTML = ''; return; }
    var c = selected();
    var k = c ? keyOf(c) : contextKey(st.context.name);
    var sections = S.inspect(st.doc, st.context, st.concepts, c);
    $('inspector').innerHTML = renderEntry(sections, k) + entryActions(k, c ? c.concept : 'bounded_context');
  }

  function renderChrome() {
    var project = st.doc.project || '';
    $('crumb').innerHTML = st.context ? '<b>' + esc(st.context.name) + '</b> <span>/ ' + esc(project) + '</span>' : '<b>' + esc(project) + '</b>';
    $('source').textContent = st.doc.source || '';
    $('source').title = st.directory + '\n' + (st.acceptedBranch ? 'Accepted is what ' + st.acceptedBranch + ' records.' : st.acceptedReason);
    $('newProject').className = st.view === 'project' ? 'on' : '';
    $('path').innerHTML = S.path(st.context, st.concepts, selected()).map(esc).join(' <span>&rsaquo;</span> ');
    $('counts').textContent = S.countsLine(st.doc.counts);
    $('message').textContent = st.message;
    var proposed = st.accepted ? S.transformation(st.accepted, st.recorded).length : 0;
    $('changes').textContent = 'Changes' + (st.drafts.length || proposed ? ' (' + st.drafts.length + ' draft' + (st.drafts.length === 1 ? '' : 's') + (st.accepted ? ', ' + proposed + ' proposed' : '') + ')' : '');
    $('changes').className = st.view === 'changes' ? 'on' : '';
    $('publish').textContent = 'Publish' + (st.drafts.length ? ' ' + st.drafts.length : '');
    $('publish').disabled = !st.drafts.length || st.publishing;
    var filter = $('filter');
    if (filter.options.length === 1) {
      S.CONCEPTS.forEach(function (k) {
        if (k === 'bounded_context') return;
        var o = document.createElement('option'); o.value = k; o.textContent = S.CONCEPT_LABEL[k]; filter.appendChild(o);
      });
    }
  }

  function render() {
    if (!st.doc) return;
    if (st.context) showMap();
    renderChrome(); renderNavigator(); renderCanvas(); renderInspector();
  }

  function showEmpty(text, command) {
    ['stage', 'legend'].forEach(function (id) { $(id).hidden = true; });
    document.querySelector('.find').hidden = true;
    document.querySelector('.zoom').hidden = true;
    var e = $('empty');
    e.hidden = false;
    e.innerHTML = '<div>' + esc(text) + (command ? '<code>' + esc(command) + '</code>' : '') + '</div>';
  }
  function showMap() {
    ['stage', 'legend'].forEach(function (id) { $(id).hidden = false; });
    document.querySelector('.find').hidden = false;
    document.querySelector('.zoom').hidden = false;
    $('empty').hidden = true;
  }

  /* --- editing --- */
  function beginEdit() {
    var c = selected();
    if (c) st.edit = { key: keyOf(c), context: st.context.name, concept: c.concept, owner: S.ownerName(st.concepts, c), name: c.name, properties: S.propertiesOf(c), values: {} };
    else st.edit = { key: contextKey(st.context.name), context: st.context.name, concept: 'bounded_context', owner: '', name: st.context.name, properties: { definition: st.context.definition || '' }, values: {} };
    render();
  }
  function beginAdd(concept) {
    st.view = 'map';
    st.edit = { context: st.context ? st.context.name : '', concept: concept, owner: '', name: '', properties: null, values: {} };
    render();
  }
  function readForm() {
    var values = {};
    document.querySelectorAll('#inspector [data-f]').forEach(function (el) { values[el.dataset.f] = el.value; });
    return values;
  }
  function saveDraft() {
    var e = st.edit, values = readForm();
    if (!e.properties) {
      e.concept = values.concept || e.concept; e.owner = values.owner || ''; e.name = (values.name || '').trim();
      if (!e.name) { e.error = 'A name is required.'; e.values = values; return render(); }
      if (S.OWNER_CONCEPTS[e.concept] && !e.owner) { e.error = 'An owner is required: a ' + S.OWNER_CONCEPTS[e.concept].map(function (c) { return S.CONCEPT_LABEL[c].toLowerCase(); }).join(' or ') + ' of this context.'; e.values = values; return render(); }
      e.key = e.concept === 'bounded_context' ? contextKey(e.name) : S.key(e.context, e.concept, e.owner, e.name);
    }
    var change = S.changeFrom(e.concept, e.properties, values);
    var missing = S.PROPERTIES[e.concept].filter(function (p) { return p.required && (e.properties ? (p.name in change ? change[p.name] === '' : !e.properties[p.name]) : !change[p.name]); });
    if (missing.length) { e.error = 'Required: ' + missing.map(function (p) { return p.label.toLowerCase(); }).join(', ') + '.'; e.values = values; return render(); }
    if (Object.keys(change).length) {
      st.drafts = S.drafted(st.drafts, { key: e.key, action: 'define', context: e.context, concept: e.concept, owner: e.owner, name: e.name, change: change, created: !e.properties });
    }
    st.edit = null;
    rebuild();
    if (e.concept === 'bounded_context') return selectContext(e.name);
    var id = e.concept + ':' + (e.owner ? e.owner + '/' : '') + e.name;
    st.sel = S.byId(st.concepts, id) ? id : null;
    render();
  }
  function draftRemoval() {
    var c = selected();
    var d = c ? { key: keyOf(c), action: 'remove', context: st.context.name, concept: c.concept, owner: S.ownerName(st.concepts, c), name: c.name }
      : { key: contextKey(st.context.name), action: 'remove', context: st.context.name, concept: 'bounded_context', owner: '', name: st.context.name };
    st.drafts = S.drafted(st.drafts, d);
    st.sel = null;
    rebuild();
    if (!st.context) { st.context = S.context(st.doc, null); st.concepts = st.context ? S.conceptsOf(st.context) : []; }
    render();
  }
  function discard(k) {
    st.drafts = S.withoutDraft(st.drafts, k);
    rebuild(); render();
  }

  /* --- a new project: the server creates it and serves it from then on;
     the page starts over in it. --- */
  function beginProject() {
    st.edit = null;
    st.project = st.project || { directory: st.beside, name: '', languages: ['go'], error: '' };
    st.view = 'project';
    render();
    var input = document.querySelector('#inspector [data-p="directory"]');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
  }
  function createProject() {
    var p = st.project;
    if (st.creating) return;
    if (!p.directory.trim()) { p.error = 'Name the directory to create the project in.'; return render(); }
    st.creating = true; p.error = ''; render();
    return post('/api/projects', { directory: p.directory.trim(), name: p.name.trim(), languages: p.languages }).then(function (created) {
      st.creating = false;
      st.project = null;
      st.drafts = []; st.results = []; st.context = null; st.sel = null; st.edit = null; st.view = 'map';
      st.message = 'Created ' + created.project + ' at ' + created.directory;
      return load();
    }, function (err) {
      st.creating = false;
      p.error = err.message;
      render();
    });
  }

  /* --- publishing: one define or remove per draft, in order, each naming
     the project it was drafted in; a draft the server refuses stays, with
     the reason. --- */
  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      return r.text().then(function (text) {
        var doc = {};
        try { doc = JSON.parse(text); } catch (e) { doc = { error: text }; }
        if (!r.ok) throw new Error(doc.error || ('HTTP ' + r.status));
        return doc;
      });
    });
  }
  function describe(d, result) {
    var what = S.CONCEPT_LABEL[d.concept] + ' ' + d.name + (d.owner ? ' of ' + d.owner : '');
    if (d.action === 'remove') return 'Removed ' + what + (result.also && result.also.length ? '; ' + result.also.join(' ') : '') + '.';
    return (result.result === 'created' ? 'Recorded ' : result.result === 'updated' ? 'Updated ' : 'Unchanged: ') + what + (result.changed ? ' (' + result.changed.join(', ') + ')' : '') + '.';
  }
  function publish() {
    if (!st.drafts.length || st.publishing) return;
    st.publishing = true;
    st.message = 'Publishing…'; render();
    /* The queue holds keys: each is sent as drafted when its turn comes,
       so a draft discarded or edited while an earlier one publishes is
       skipped or sent as it now stands. */
    var queue = st.drafts.map(function (d) { return d.key; }), results = [];
    function next() {
      if (!queue.length) return done();
      var d = S.draftOf(st.drafts, queue.shift());
      if (!d) return next();
      return post(d.action === 'remove' ? '/api/remove' : '/api/define', Object.assign({ project: st.directory }, S.requestOf(d))).then(function (result) {
        results.push({ text: describe(d, result) });
        st.drafts = S.published(st.drafts, d);
      }, function (err) {
        results.push({ text: S.CONCEPT_LABEL[d.concept] + ' ' + d.name + ': ' + err.message, error: true });
        st.drafts = st.drafts.map(function (x) { return x === d ? Object.assign({}, x, { error: err.message }) : x; });
      }).then(next);
    }
    function done() {
      st.publishing = false;
      st.results = results;
      var failed = results.filter(function (r) { return r.error; }).length;
      st.message = failed ? (results.length - failed) + ' published, ' + failed + ' refused; see Changes' : results.length + ' published to ' + (st.recorded.source || 'the domain file');
      if (failed) st.view = 'changes';
      return load();
    }
    return next();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-ctx],[data-id],[data-legend],[data-zoom],[data-add],[data-act],[data-discard]');
    if (!t) return;
    if (t.dataset.ctx) return selectContext(t.dataset.ctx);
    if (t.dataset.legend) { st.hidden[t.dataset.legend] = !st.hidden[t.dataset.legend]; return render(); }
    if (t.dataset.zoom) { st.zoom = Math.max(0.5, Math.min(2, Math.round((st.zoom + 0.1 * +t.dataset.zoom) * 10) / 10)); return render(); }
    if (t.dataset.id) { st.sel = t.dataset.id; st.edit = null; st.view = 'map'; return render(); }
    if (t.dataset.add) return beginAdd('value_object');
    if (t.dataset.discard != null) return discard(st.draftChanges[+t.dataset.discard].key);
    switch (t.dataset.act) {
      case 'edit': return beginEdit();
      case 'remove': return draftRemoval();
      case 'discard': return discard(selected() ? keyOf(selected()) : contextKey(st.context.name));
      case 'save': return saveDraft();
      case 'create': return createProject();
      case 'cancel': st.edit = null; if (st.view === 'project') st.view = 'map'; return render();
    }
  });
  /* What is typed in the form is kept as it is typed, so a render that
     rebuilds the inspector (a resize, a publish) never loses it. */
  document.addEventListener('input', function (e) {
    if (st.edit && e.target.dataset && e.target.dataset.f && e.target.closest('#inspector')) st.edit.values[e.target.dataset.f] = e.target.value;
    if (st.project && e.target.dataset && e.target.dataset.p) st.project[e.target.dataset.p] = e.target.value;
  });
  document.addEventListener('change', function (e) {
    if (st.project && e.target.dataset && e.target.dataset.lang) {
      var lang = e.target.dataset.lang, chosen = st.project.languages.filter(function (l) { return l !== lang; });
      st.project.languages = LANGUAGES.map(function (l) { return l[0]; }).filter(function (l) { return l === lang ? e.target.checked : chosen.indexOf(l) >= 0; });
      return;
    }
    if (st.edit && !st.edit.properties && (e.target.dataset.f === 'concept' || e.target.dataset.f === 'owner')) {
      var values = readForm(); st.edit.concept = values.concept; st.edit.owner = values.owner || ''; st.edit.values = values; st.edit.name = values.name; render();
    }
  });
  $('enclosure').addEventListener('click', function (e) { if (!e.target.closest('.node')) { st.sel = null; st.edit = null; render(); } });
  $('query').addEventListener('input', function () { st.query = this.value; render(); });
  $('filter').addEventListener('change', function () { st.filter = this.value; render(); });
  $('changes').addEventListener('click', function () { st.view = st.view === 'changes' ? 'map' : 'changes'; st.edit = null; render(); });
  $('publish').addEventListener('click', publish);
  $('newProject').addEventListener('click', function () { if (st.view === 'project') { st.view = 'map'; render(); } else beginProject(); });
  $('addContext').addEventListener('click', function () { beginAdd('bounded_context'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { st.sel = null; st.edit = null; if (st.view === 'project') st.view = 'map'; render(); }
    if (e.key === 'Enter' && st.view === 'project' && e.target.dataset && e.target.dataset.p) createProject();
  });
  window.addEventListener('resize', render);
  window.addEventListener('beforeunload', function (e) { if (st.drafts.length) { e.preventDefault(); e.returnValue = ''; } });

  function getJSON(path) {
    return fetch(path, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  /* load reads the project served and both its recordings; drafts survive
     a reload, so a refused draft stays to be corrected. */
  function load() {
    return Promise.all([getJSON('/api/overview'), getJSON('/api/accepted'), getJSON('/api/project')]).then(function (docs) {
      st.recorded = docs[0];
      var accepted = docs[1];
      st.directory = docs[2].directory;
      st.beside = docs[2].beside;
      st.accepted = accepted.available ? accepted.overview : null;
      st.acceptedBranch = accepted.branch || '';
      st.acceptedReason = accepted.available ? '' : (accepted.reason || 'unknown');
      if (!st.recorded.found && !st.drafts.length) { st.doc = st.recorded; renderChrome(); return showEmpty('No recorded Ubiquitous Language at ' + (st.recorded.source || 'the domain file') + '.', 'arclint domain init'); }
      rebuild();
      showMap();
      if (!(st.doc.contexts || []).length) { render(); return showEmpty('No bounded context is recorded yet. Draft one with + context, then Publish.'); }
      if (!st.context) selectContext(st.doc.contexts[0].name); else render();
    }).catch(function (err) {
      showEmpty('The domain overview could not be loaded: ' + err.message);
    });
  }
  load();
})();
</script>
</body>
</html>
