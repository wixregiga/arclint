case: goprod-fat-interface
runtime: [go]
files:
  store/store.go: |
    package store

    import "context"

    type Store interface {
    	Get(ctx context.Context, key string) ([]byte, error)
    	Put(ctx context.Context, key string, value []byte) error
    	Delete(ctx context.Context, key string) error
    	List(ctx context.Context, prefix string) ([]string, error)
    }
expect:
  - rule: "goprod:small-interfaces"
    path: store/store.go
    line: 5
    message: "interface Store has 4 direct methods"
---
# Three direct methods pass; an embedded interface is not counted (the
# facts tier emits no embedding member, documented in the rule); fat
# interfaces in _test.go files are exempt.
case: goprod-small-embedded-and-test-exempt
runtime: [go]
files:
  store/store.go: |
    package store

    type Reader interface {
    	Get(key string) ([]byte, error)
    	Has(key string) bool
    	Len() int
    }

    type Composite interface {
    	Reader
    }
  store/store_test.go: |
    package store

    type fatFake interface {
    	A()
    	B()
    	C()
    	D()
    	E()
    }
expect: []
---
# max_members is tunable per instance: the case overrides the template
# with a limit of one and a narrowed files glob, so only the matched file
# is checked.
case: goprod-tunable-limit-and-scope
runtime: [go]
files:
  rules.yaml: |
    runtime: [go]
    modules:
      all:
        paths: ["**"]
    rules:
      - id: "goprod:small-interfaces"
        type: go-interface-size
        params:
          maxMembers: 1
          files: "api/**/*.go"
  api/api.go: |
    package api

    type Pinger interface {
    	Ping() error
    	Pong() error
    }
  internal/wide.go: |
    package internal

    type Wide interface {
    	A()
    	B()
    }
expect:
  - rule: "goprod:small-interfaces"
    path: api/api.go
    line: 3
    message: "interface Pinger has 2 direct methods; the maximum is 1"
