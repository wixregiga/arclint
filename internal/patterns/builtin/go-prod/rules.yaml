# =============================================================================
# Production Go conventions, distilled from patterns that recur across
# high-star OSS Go services. Deliberately small: a rule joins this pack
# only after it has been validated against real repositories, so every
# check here means what it claims.
#
# The checks live in .arclint/extensions/go-prod.ts, installed alongside
# this file. Run `arclint explain go-interface-size` to see the first one
# documented.
# =============================================================================

runtime: [go]

scan:
  # Imports that resolve to no manifest dependency, stdlib, or repo file
  # are surfaced instead of ignored. Tighten to `error` once clean.
  unknown_imports: warn

modules:
  all:
    paths: ["**"]
    description: "The whole tree. Split into real modules as boundaries emerge."

# Interface size is enforced by the paired extension: interfaces carry at
# most maxMembers direct named methods. Raise the limit or narrow `files`
# per repository rather than deleting the rule.
rules:
  - id: "goprod:small-interfaces"
    type: go-interface-size
    params:
      maxMembers: 3
