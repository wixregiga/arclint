# =============================================================================
# DDD Flat: tactical domain-driven design for Go services.
#
#   domain          aggregates, entities, value objects, repository ports
#   application     use cases orchestrating domain objects through ports
#   infrastructure  outbound adapters: databases, clients, brokers
#   delivery        inbound adapters: HTTP, gRPC, CLI, consumers
#   adapters        permitted alias when inbound and outbound share a root
#   composition     cmd/ roots selecting and connecting concrete adapters
#
# Requirement ids follow the ARCH-* table this pattern grew from; several
# clauses share one id when they enforce one requirement together
# (`arclint rules show ddd` lists the full set). What imports can prove
# is declarative below; Go declaration shapes (aggregates, repositories,
# value objects, function sizes) live in the paired extension, built on
# ctx.facts — parser-grade declaration facts, not regexes.
# =============================================================================

runtime: [go]

scan:
  unknown_imports: error
  exclude:
    - "**/generated/**"
    - "**/mock_*.go"

modules:
  domain:
    paths: ["domain/**", "internal/domain/**"]
    description: "Aggregates, entities, value objects, domain services, and repository ports."
  application:
    paths:
      - "application/**"
      - "app/**"
      - "usecase/**"
      - "internal/application/**"
      - "internal/app/**"
      - "internal/usecase/**"
    description: "Use cases that coordinate domain objects through ports."
  infrastructure:
    paths:
      - "infrastructure/**"
      - "infra/**"
      - "internal/infrastructure/**"
      - "internal/infra/**"
    description: "Outbound technology adapters, such as database and service clients."
  delivery:
    paths:
      - "delivery/**"
      - "transport/**"
      - "api/**"
      - "internal/delivery/**"
      - "internal/transport/**"
      - "internal/api/**"
    description: "Inbound HTTP, gRPC, CLI, and message adapters."
  adapters:
    paths:
      - "adapter/**"
      - "adapters/**"
      - "internal/adapter/**"
      - "internal/adapters/**"
    description: "A permitted adapter alias when inbound and outbound adapters share one root."
  composition:
    paths: ["cmd/**", "main.go"]
    description: "Composition roots that select and connect concrete adapters."

contracts:
  domain:
    consumes:
      id: "ddd:ARCH-001"       # domain purity: no third-party, no other layers
      internal: []
      external: forbid
      stdlib: allow
    invariants:
      - id: "ddd:ARCH-008"     # no technical suffixes on domain files
        kind: structure
        forbid:
          - "domain/**/*_entity.go"
          - "domain/**/*_model.go"
          - "internal/domain/**/*_entity.go"
          - "internal/domain/**/*_model.go"
        severity: warn
  application:
    consumes:
      id: "ddd:ARCH-002"
      internal: [domain]
      external: forbid
      stdlib: allow
  infrastructure:
    consumes:
      id: "ddd:ARCH-002"
      internal: [application, domain]
      external: allow
      stdlib: allow
  delivery:
    consumes:
      id: "ddd:ARCH-002"
      internal: [application, domain]
      external: allow
      stdlib: allow
  adapters:
    consumes:
      id: "ddd:ARCH-002"
      internal: [application, domain]
      external: allow
      stdlib: allow
  composition:
    consumes:
      id: "ddd:ARCH-002"
      internal: [delivery, adapters, infrastructure, application, domain]
      external: allow
      stdlib: allow

dependencies:
  - id: "ddd:ARCH-002"         # dependency direction: delivery -> application -> domain
    kind: layers
    layers: [application, domain]
  - id: "ddd:ARCH-002"
    kind: protected
    module: infrastructure
    allow: [composition]
  - id: "ddd:ARCH-010"         # no dependency cycles anywhere
    kind: acyclic
    modules: []

rules:
  - id: "ddd:ARCH-003"
    type: ddd-aggregate-location
    severity: error
    params:
      # Name your aggregate roots; empty means the rule stays silent
      # until configured.
      aggregates: []

  - id: "ddd:ARCH-004"
    type: ddd-repository-placement
    severity: error

  - id: "ddd:ARCH-005"
    type: ddd-handler-boundary
    severity: error
    params:
      maxBranches: 3

  - id: "ddd:ARCH-006"
    type: ddd-application-thinness
    severity: warn
    params:
      maxFunctionLines: 40

  - id: "ddd:ARCH-007"
    type: ddd-package-naming
    severity: warn

  - id: "ddd:ARCH-009"
    type: ddd-value-object-encapsulation
    severity: warn
    params:
      names: []
      suffixes: [ID, Value, Money, Date, Status]
      enforceConstructor: true

  - id: "ddd:ARCH-011"
    type: ddd-technology-isolation
    severity: error

  - id: "ddd:ARCH-012"
    type: ddd-test-location
    severity: info
