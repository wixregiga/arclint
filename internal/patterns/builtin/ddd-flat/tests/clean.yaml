case: ddd-clean
runtime: [go]
files:
  cmd/api/main.go: |
    package main

    import (
    	"test.local/case/delivery"
    	"test.local/case/infrastructure"
    )

    func main() {
    	repo := infrastructure.NewMemberRepository()
    	delivery.Mount(repo)
    }
  domain/member.go: |
    package domain

    type Member struct {
    	id MemberID
    }

    type MemberID struct {
    	raw string
    }

    func NewMemberID(raw string) (MemberID, error) {
    	return MemberID{raw: raw}, nil
    }

    type MemberRepo interface {
    	Find(id MemberID) (Member, error)
    }
  application/register.go: |
    package application

    import "test.local/case/domain"

    type RegisterMember struct {
    	members domain.MemberRepo
    }

    func (r RegisterMember) Handle(id domain.MemberID) (domain.Member, error) {
    	return r.members.Find(id)
    }
  infrastructure/member_repository.go: |
    package infrastructure

    import (
    	"database/sql"

    	"test.local/case/domain"
    )

    type MemberRepository struct {
    	db *sql.DB
    }

    func NewMemberRepository() *MemberRepository { return &MemberRepository{} }

    func (r *MemberRepository) Find(id domain.MemberID) (domain.Member, error) {
    	return domain.Member{}, nil
    }
  delivery/handler.go: |
    package delivery

    import (
    	"net/http"

    	"test.local/case/domain"
    )

    func Mount(repo domain.MemberRepo) {
    	http.HandleFunc("/members", func(w http.ResponseWriter, r *http.Request) {
    		_ = repo
    	})
    }
expect: []
