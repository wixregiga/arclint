case: slice-clean
runtime: [go]
files:
  cmd/library/main.go: |
    package main

    import "test.local/case/internal/app"

    func main() {
    	app.Run()
    }
  internal/app/app.go: |
    package app

    import (
    	"test.local/case/internal/borrowbook"
    	borrowhttp "test.local/case/internal/borrowbook/http"
    	"test.local/case/internal/member"
    	"test.local/case/internal/shared"
    )

    func Run() {
    	adapters := shared.NewAdapters()
    	var members member.Repo = adapters.Members
    	borrow := borrowbook.New(members)
    	borrowhttp.Mount(borrow)
    }
  internal/shared/adapters.go: |
    package shared

    import "test.local/case/internal/member"

    type Adapters struct {
    	Members member.Repo
    }

    func NewAdapters() Adapters { return Adapters{} }
  internal/borrowbook/command.go: |
    package borrowbook

    type Command struct {
    	MemberID string
    }
  internal/borrowbook/borrowbook.go: |
    package borrowbook

    import "test.local/case/internal/member"

    type UseCase struct {
    	members member.Repo
    }

    func New(members member.Repo) *UseCase { return &UseCase{members: members} }
  internal/borrowbook/http/handler.go: |
    package http

    import (
    	nethttp "net/http"

    	"test.local/case/internal/borrowbook"
    )

    func Mount(u *borrowbook.UseCase) {
    	nethttp.HandleFunc("/borrow", func(w nethttp.ResponseWriter, r *nethttp.Request) {})
    	_ = u
    }
  internal/member/member.go: |
    package member

    type Member struct {
    	ID string
    }
  internal/member/repo.go: |
    package member

    type Repo interface {
    	Find(id string) (Member, error)
    }
expect: []
---
