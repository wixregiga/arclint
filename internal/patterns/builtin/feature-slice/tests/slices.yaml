# The extension's open-set matrix: findings the YAML half cannot scope.
case: slice-feature-imports-feature
runtime: [go]
files:
  internal/app/app.go: |
    package app

    import (
    	_ "test.local/case/internal/borrowbook"
    	_ "test.local/case/internal/returnbook"
    )
  internal/borrowbook/command.go: |
    package borrowbook

    type Command struct{}
  internal/borrowbook/http/handler.go: |
    package http
  internal/returnbook/command.go: |
    package returnbook

    type Command struct{}
  internal/returnbook/http/handler.go: |
    package http
  internal/returnbook/grab.go: |
    package returnbook

    import _ "test.local/case/internal/borrowbook"
expect:
  - rule: "slice:repo.slices"
    path: internal/returnbook/grab.go
    line: 3
    contract: consumes
    blame: consumer
    message: imports feature
---
case: slice-concept-imports-banned-stdlib
runtime: [go]
files:
  internal/member/member.go: |
    package member

    import _ "net/http"
  internal/member/repo.go: |
    package member

    type Repo interface{}
expect:
  - rule: "slice:repo.slices"
    path: internal/member/member.go
    line: 3
    message: domain-pure
---
case: slice-concept-imports-thirdparty
runtime: [go]
files:
  go.mod: |
    module test.local/case

    go 1.24

    require example.com/lib v1.0.0
  internal/member/member.go: |
    package member

    import _ "example.com/lib"
  internal/member/repo.go: |
    package member

    type Repo interface{}
expect:
  - rule: "slice:repo.slices"
    path: internal/member/member.go
    line: 3
    message: third-party
---
case: slice-concept-missing-port
runtime: [go]
files:
  internal/loan/loan.go: |
    package loan

    type Loan struct{}
expect:
  - rule: "slice:repo.slices"
    path: internal/loan/loan.go
    contract: provides
    blame: provider
    message: no repo.go port
---
case: slice-drift
runtime: [go]
files:
  internal/orphan.go: |
    package internal
  pkg/tool.go: |
    package pkg

    func Tool() {}
expect:
  - rule: "slice:repo.slices"
    path: internal/orphan.go
    contract: invariant
    blame: provider
    message: loose Go file
  - rule: "slice:repo.slices"
    path: pkg/tool.go
    contract: invariant
    blame: provider
    message: outside the declared places
---
