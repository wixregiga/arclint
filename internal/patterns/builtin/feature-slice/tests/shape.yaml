case: slice-handler-without-command
runtime: [go]
files:
  internal/badfeat/http/handler.go: |
    package http
expect:
  - rule: "slice:repo.feature-shape"
    path: internal/badfeat/http/handler.go
    contract: provides
    blame: provider
  # The same directory is also a malformed concept in the open-set model:
  # no command.go (not a feature) and no repo.go (no port).
  - rule: "slice:repo.slices"
    path: internal/badfeat/http/handler.go
    contract: provides
    blame: provider
---
