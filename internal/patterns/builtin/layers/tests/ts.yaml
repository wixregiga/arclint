case: ts-clean
runtime: [ts]
files:
  src/main.ts: |
    import "./app/service";
    import "./infra/db";
  src/app/service.ts: |
    import "../domain/rules";
  src/domain/rules.ts: |
    export const rules = 1;
  src/infra/db.ts: |
    import "../domain/rules";
expect: []
---
case: ts-domain-imports-infra
runtime: [ts]
files:
  src/domain/bad.ts: |
    import "../infra/db";
  src/infra/db.ts: |
    export {};
expect:
  - rule: "layers:domain.consumes"
    path: src/domain/bad.ts
    line: 1
    contract: consumes
    blame: consumer
  - rule: "layers:infra-only-via-cmd"
    path: src/domain/bad.ts
    line: 1
---
case: ts-infra-imports-app
runtime: [ts]
files:
  src/infra/bad.ts: |
    import "../app/service";
  src/app/service.ts: |
    export {};
expect:
  - rule: "layers:infra.consumes"
    path: src/infra/bad.ts
    line: 1
