case: go-clean
runtime: [go]
files:
  cmd/main.go: |
    package main

    import (
    	_ "test.local/case/internal/app"
    	_ "test.local/case/internal/domain"
    	_ "test.local/case/internal/infra"
    )

    func main() {}
  internal/app/service.go: |
    package app

    import _ "test.local/case/internal/domain"
  internal/domain/rules.go: |
    package domain
  internal/infra/db.go: |
    package infra

    import _ "test.local/case/internal/domain"
expect: []
---
case: go-domain-imports-infra
runtime: [go]
files:
  internal/domain/bad.go: |
    package domain

    import _ "test.local/case/internal/infra"
  internal/infra/db.go: |
    package infra
expect:
  - rule: "layers:domain.consumes"
    path: internal/domain/bad.go
    line: 3
    contract: consumes
    blame: consumer
  - rule: "layers:infra-only-via-cmd"
    path: internal/domain/bad.go
    line: 3
---
case: go-app-imports-infra
runtime: [go]
files:
  internal/app/bad.go: |
    package app

    import _ "test.local/case/internal/infra"
  internal/infra/db.go: |
    package infra
expect:
  - rule: "layers:app.consumes"
    path: internal/app/bad.go
    line: 3
  - rule: "layers:infra-only-via-cmd"
    path: internal/app/bad.go
    line: 3
---
case: go-domain-imports-app
runtime: [go]
files:
  internal/domain/bad.go: |
    package domain

    import _ "test.local/case/internal/app"
  internal/app/service.go: |
    package app
expect:
  - rule: "layers:domain.consumes"
    path: internal/domain/bad.go
    line: 3
  - rule: "layers:spine"
    path: internal/domain/bad.go
    line: 3
---
case: go-domain-imports-thirdparty
runtime: [go]
files:
  go.mod: |
    module test.local/case

    go 1.24

    require example.com/lib v1.0.0
  internal/domain/bad.go: |
    package domain

    import _ "example.com/lib"
expect:
  - rule: "layers:domain.consumes"
    path: internal/domain/bad.go
    line: 3
    message: external
---
case: go-cmd-imports-unowned-internal-code
runtime: [go]
files:
  cmd/main.go: |
    package main

    import _ "test.local/case/internal/helpers"

    func main() {}
  internal/helpers/h.go: |
    package helpers
expect:
  - rule: "layers:cmd.consumes"
    path: cmd/main.go
    line: 3
---
case: go-infra-imports-app
runtime: [go]
files:
  internal/infra/bad.go: |
    package infra

    import _ "test.local/case/internal/app"
  internal/app/service.go: |
    package app
expect:
  - rule: "layers:infra.consumes"
    path: internal/infra/bad.go
    line: 3
---
case: go-cycle-app-domain
runtime: [go]
files:
  internal/app/service.go: |
    package app

    import _ "test.local/case/internal/domain"
  internal/domain/bad.go: |
    package domain

    import _ "test.local/case/internal/app"
expect:
  - rule: "layers:domain.consumes"
    path: internal/domain/bad.go
    line: 3
  - rule: "layers:spine"
    path: internal/domain/bad.go
    line: 3
  - rule: "layers:acyclic"
    path: internal/app/service.go
