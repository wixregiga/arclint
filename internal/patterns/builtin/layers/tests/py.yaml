case: py-clean
runtime: [py]
files:
  src/main.py: |
    import app.service
    import infra.db
  src/app/service.py: |
    import domain.rules
  src/domain/rules.py: |
    VALUE = 1
  src/infra/db.py: |
    import domain.rules
expect: []
---
case: py-domain-imports-infra
runtime: [py]
files:
  src/domain/bad.py: |
    import infra.db
  src/infra/db.py: |
    VALUE = 1
expect:
  - rule: "layers:domain.consumes"
    path: src/domain/bad.py
    line: 1
    contract: consumes
    blame: consumer
  - rule: "layers:infra-only-via-cmd"
    path: src/domain/bad.py
    line: 1
---
case: py-app-imports-infra
runtime: [py]
files:
  src/app/bad.py: |
    import infra.db
  src/infra/db.py: |
    VALUE = 1
expect:
  - rule: "layers:app.consumes"
    path: src/app/bad.py
    line: 1
  - rule: "layers:infra-only-via-cmd"
    path: src/app/bad.py
    line: 1
