# =============================================================================
# Hexagonal layers.
#
#   cmd     the composition root: builds infra, injects it into app, runs
#   app     use cases: orchestrate domain and ports; no technology
#   domain  business rules and port interfaces; depends on nothing
#   infra   technology adapters implementing domain ports
#
# Direction: cmd -> app -> domain. infra sees only domain (the ports it
# implements); only cmd may touch infra. Nothing imports cmd.
#
# ADJUST THE GLOBS to your tree (`arclint module ls` shows what each
# module matched). The defaults below assume Go-style layout; for a
# TypeScript or Python tree the same shape usually lives under src/.
# =============================================================================

runtime: [go]

scan:
  unknown_imports: warn

modules:
  cmd:
    paths: ["cmd/**", "src/main.*"]
    description: "Composition root: the only place that knows which technology runs."
  app:
    paths: ["internal/app/**", "src/app/**"]
    description: "Use cases: orchestration over domain rules and ports. No technology imports."
  domain:
    paths: ["internal/domain/**", "src/domain/**"]
    description: "Business rules, entities, and port interfaces. Depends on nothing."
  infra:
    paths: ["internal/infra/**", "src/infra/**"]
    description: "Adapters implementing domain ports: DB, HTTP clients, queues, mail."

# Rule ids carry the pattern's namespace (layers:) so requirements stay
# recognizable: `arclint rules show layers` lists the whole set, and
# `arclint rules test --pattern layers` proves each id against fixtures.
contracts:
  domain:
    consumes:
      id: "layers:domain.consumes"
      internal: []            # domain imports no other module
      external: forbid        # and no third-party libraries
  app:
    consumes:
      id: "layers:app.consumes"
      internal: [domain]      # orchestration sees rules and ports only
      external: forbid
  infra:
    consumes:
      id: "layers:infra.consumes"
      internal: [domain]      # adapters see the ports they implement
      external: allow
  cmd:
    consumes:
      id: "layers:cmd.consumes"
      internal: [app, infra, domain]
      external: allow

dependencies:
  - id: "layers:spine"
    kind: layers
    layers: [cmd, app, domain]      # imports flow downward only
  - id: "layers:infra-only-via-cmd"
    kind: protected
    module: infra
    allow: [cmd]                    # only the composition root builds adapters
  - id: "layers:acyclic"
    kind: acyclic
    modules: []                     # no cycles anywhere
