# arclint/hexagonal: ports and adapters around an isolated core.
#
# Adopt from rules.arclint.yaml:
#
#   extends:
#     - pattern: arclint/hexagonal@0.1.0-beta.2
#       bind:
#         domain: internal/domain/**
#         ...
#
# Bind every zone below; missing folders pass as empty.

pattern:
  namespace: arclint
  name: hexagonal
  version: 0.1.0-beta.2
  coverage: [go, ts, py]
  documentation: |
    Ports and adapters around an isolated core (domain and application).
    The core imports no other zone, no third-party package, no I/O, and
    no wire format; inbound (driving) adapters call application, outbound
    (driven) adapters implement ports, shared serves adapters, composition
    is outermost, and zone imports stay acyclic. Test files are skipped.

zones:
  domain:
    description: "The business model: aggregates, entities, value objects, domain services, and aggregate repository interfaces."
    paths: internal/domain/**
  application:
    description: "Use cases and non-domain outbound ports they call."
    paths: internal/application/**
  inbound:
    description: "Inbound (Cockburn: primary / driving) adapters that call the application: HTTP handlers, CLI commands, route files, consumers."
    paths: internal/adapters/inbound/**
  outbound:
    description: "Outbound (Cockburn: secondary / driven) adapters that implement ports: databases, clients, brokers."
    paths: internal/adapters/outbound/**
  shared:
    description: "Cross-cutting adapter code with no product meaning: logging, tracing, generated contracts."
    paths: internal/shared/**
  composition:
    description: "Wiring (Composition Root / Configurator): entry points that assemble outbound adapters, application, and inbound adapters."
    paths: cmd/**

rules:
  domain/depends-on-nothing-outside:
    rationale: "Domain imports no other zone and no third-party package."
    on: domain
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests wire fakes and adapters across zones."
    imports:
      internal: []
      external: forbid

  application/through-ports:
    rationale: "Application imports only the domain; external capabilities enter through ports."
    on: application
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests wire fakes and adapters across zones."
    imports:
      internal: [domain]
      external: allow

  application/core-libraries-only:
    rationale: "Application uses no third-party package; opt in by replacing this rule."
    on: application
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests wire fakes and adapters across zones."
    imports:
      external: forbid

  core/performs-no-io:
    rationale: "Core performs no I/O; move files, processes, networks, and databases behind a port."
    on: [domain, application]
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Test fixtures may use I/O."
    uses: hexagonal/forbidden-modules
    with:
      go: [crypto/tls, database/sql, io/ioutil, log/syslog, net, os, plugin, syscall]
      typescript: [child_process, cluster, dgram, dns, fs, http, http2, https, net, os, process, readline, sqlite, tls, tty, worker_threads]
      python: [dbm, fcntl, fileinput, ftplib, glob, http.client, http.server, imaplib, multiprocessing, os, pathlib, poplib, shelve, shutil, smtplib, socket, socketserver, sqlite3, ssl, subprocess, syslog, tempfile, urllib.request, wsgiref, xmlrpc]
      allow:
        go: [net/mail, net/netip, net/url]

  domain/no-wire-format:
    rationale: "Domain values carry no wire format; map payloads and rows in an adapter."
    on: domain
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests may encode values to compare them."
    uses: hexagonal/wire-format
    with:
      go: [encoding/csv, encoding/gob, encoding/json, encoding/xml]
      python: [csv, json, marshal, pickle, tomllib, xml]
      tags: [bson, csv, db, form, gorm, json, mapstructure, msgpack, protobuf, toml, xml, yaml]

  core/concept-named-files:
    rationale: "Core files are named for a concept, use case, or port, never a generic container."
    on: [domain, application]
    structure:
      forbid:
        - "**/util.go"
        - "**/utils.go"
        - "**/helper.go"
        - "**/helpers.go"
        - "**/common.go"
        - "**/misc.go"
        - "**/util.ts"
        - "**/utils.ts"
        - "**/helper.ts"
        - "**/helpers.ts"
        - "**/common.ts"
        - "**/misc.ts"
        - "**/util.tsx"
        - "**/utils.tsx"
        - "**/helper.tsx"
        - "**/helpers.tsx"
        - "**/common.tsx"
        - "**/misc.tsx"
        - "**/util.py"
        - "**/utils.py"
        - "**/helper.py"
        - "**/helpers.py"
        - "**/common.py"
        - "**/misc.py"

  inbound/calls-the-application:
    rationale: "Inbound adapters import application, domain, and shared, never outbound or composition."
    on: inbound
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests wire fakes and adapters across zones."
    imports:
      internal: [application, domain, shared]
      external: allow

  outbound/implements-ports:
    rationale: "Outbound adapters import application, domain, and shared, never inbound or composition."
    on: outbound
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests wire fakes and adapters across zones."
    imports:
      internal: [application, domain, shared]
      external: allow

  shared/product-free:
    rationale: "Shared code imports no other zone."
    on: shared
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests wire fakes and adapters across zones."
    imports:
      internal: []
      external: allow

  dependencies/acyclic:
    rationale: "Zone dependencies contain no import cycle."
    exclude:
      paths: ["**/*_test.go", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx", "**/test_*.py", "**/*_test.py"]
      reason: "Tests wire fakes and adapters across zones."
    acyclic: {}
