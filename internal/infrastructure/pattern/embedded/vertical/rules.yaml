# ArcLint architecture contracts: vertical slices with hexagonal layers inside.
# Each feature folder under internal/ owns its domain, application, and infra;
# internal/app wires transports, internal/shared holds cross-cutting mechanisms.
# Query commands: arclint rules [selector] · arclint context <path>

runtime: [go]

scan:
  # error | warn | ignore for imports that classify neither stdlib,
  # internal, nor declared in the dependency manifest.
  unknown_imports: warn

modules:
  domain:
    paths: ["internal/*/domain/**"]
    description: "Pure domain model per feature; stdlib-only."
  application:
    paths: ["internal/*/application/**"]
    description: "Use cases and ports per feature."
  infra:
    paths: ["internal/*/infra/**"]
    description: "Driven adapters implementing the feature's ports."
  app:
    paths: ["internal/app/**"]
    description: "Driving adapters and wiring, organized by transport."
  shared:
    paths: ["internal/shared/**"]
    description: "Cross-cutting mechanisms with no product meaning."
  composition:
    paths: ["cmd/**"]
    description: "Entrypoints; each main.go builds a binary."

contracts:
  domain:
    consumes:
      id: "vertical:domain/stdlib-only"
      internal: []
      external: forbid
    invariants:
      - id: "vertical:domain/no-context"
        kind: extension
        uses: vertical/forbid-imports
        with:
          packages: [context]
      - id: "vertical:domain/no-io"
        kind: extension
        uses: vertical/forbid-imports
        with:
          packages: [bufio, database/sql, io, log, net, os, syscall]
  application:
    consumes:
      id: "vertical:application/use-cases-through-ports"
      internal: [domain]
      external: forbid
    invariants:
      - id: "vertical:application/repository-context"
        kind: extension
        uses: vertical/repository-context
      - id: "vertical:application/usecase-contract"
        kind: extension
        uses: vertical/usecase
  infra:
    consumes:
      id: "vertical:infra/outbound-only"
      internal: [application, domain, shared]
  app:
    consumes:
      id: "vertical:app/driving-and-wiring"
      internal: [application, domain, infra, shared]
  shared:
    consumes:
      id: "vertical:shared/mechanism-only"
      internal: []
    invariants:
      - id: "vertical:shared/concerns"
        kind: extension
        uses: vertical/shared-concerns
        with:
          concerns: [logging, tracing, metrics, config, security, errors, cache, db, validation, events]
  composition:
    consumes:
      id: "vertical:composition/selects-adapters"
      internal: [app, infra, application, domain, shared]

repository:
  invariants:
    - id: "vertical:repositories/application-only"
      kind: extension
      uses: vertical/repository-location
      with:
        module: application

dependencies:
  - id: "vertical:dependencies/inward"
    kind: layers
    layers: [app, application, domain]
  - id: "vertical:infra/app-and-composition-only"
    kind: protected
    module: infra
    allow: [app, composition]
  - id: "vertical:features/independent"
    kind: independence
    folders: ["internal/*"]
  - id: "vertical:dependencies/acyclic"
    kind: acyclic
