# yaml-language-server: $schema=./docs/rules.schema.json
# ArcLint's own architecture contracts, self-hosted on the target
# domain model: Rule is the sole aggregate, use cases coordinate
# through ports, adapters stay outbound or inbound, and Cobra stays
# sealed behind the factory.

# go for the engine itself; ts for the embedded extension SDK sources.
runtime: [go, ts]

scan:
  unknown_imports: error
  exclude:
    - ".claude/worktrees/**"
    - ".wixregiga-ignore/**"
    - "**/generated/**"
    - "**/mock_*.go"

modules:
  domain:
    paths: ["internal/domain/**"]
    description: "Rule aggregate and domain values; stdlib-only."
  application:
    paths: ["internal/application/**"]
    description: "Action-named use cases coordinating domain objects through ports."
  infrastructure:
    paths: ["internal/infrastructure/**"]
    description: "Outbound technology adapters implementing inward-owned ports."
  delivery:
    paths: ["internal/delivery/**"]
    description: "Inbound adapters translating external input into application requests."
  cli_factory:
    paths: ["internal/delivery/cli/factory/**"]
    description: "Sealed CLI factory selecting an adapter by ArcLint-owned identity."
  cobra_adapter:
    paths: ["internal/delivery/cli/adapters/cobra/**"]
    description: "The only package permitted to import Cobra."
  composition:
    paths: ["cmd/**"]
    description: "Composition roots selecting and connecting concrete adapters."
  source:
    paths: ["internal/**"]
    description: "Common source invariants for internal packages."
  vocabulary:
    paths: ["ubiquitous-language.yaml"]
    description: "The project's recorded Ubiquitous Language vocabulary."

contracts:
  domain:
    consumes:
      id: "arclint:domain/stdlib-only"
      internal: []
      external: forbid
      stdlib: allow
    invariants:
      - id: "arclint:domain/rule-is-sole-aggregate"
        kind: structure
        require:
          - "internal/domain/rule/root.go"
        forbid:
          - "internal/domain/architecture/**"
          - "internal/domain/pattern/**"
          - "internal/domain/baseline/root.go"
          - "internal/domain/conformance/root.go"
      # The SDK showcase: content enforcement supplied by the
      # forbid-content extension under .arclint/extensions.
      - id: "arclint:domain/no-panic"
        kind: extension
        files: "internal/domain/**/*.go"
        uses: forbid-content
        with:
          pattern: '\bpanic\('
      # Domain directories talk through their file names: a domain
      # file is named for the vocabulary concept it holds, never for a
      # generic container.
      - id: "arclint:domain/files-speak-the-vocabulary"
        kind: structure
        forbid:
          - "internal/domain/**/model.go"
          - "internal/domain/**/types.go"
          - "internal/domain/**/util.go"
          - "internal/domain/**/utils.go"
          - "internal/domain/**/helpers.go"
          - "internal/domain/**/common.go"
      # Domain errors scream their subject: ErrDefinitionNotFound,
      # never a bare ErrNotFound the package qualifier cannot rescue.
      - id: "arclint:domain/errors-name-their-subject"
        kind: extension
        files: "internal/domain/**/*.go"
        uses: forbid-content
        with:
          pattern: '\bErr(NotFound|Invalid|Failed|Exists)\b'

  vocabulary:
    invariants:
      # The vocabulary showcase: an extension consumes the recorded
      # Ubiquitous Language through ctx.domain(). Inert until a
      # project records terms; a recorded term must carry a
      # definition.
      - id: "arclint:vocabulary/terms-carry-definitions"
        kind: extension
        files: "ubiquitous-language.yaml"
        uses: require-defined-terms

  application:
    consumes:
      id: "arclint:application/use-cases-through-ports"
      internal: [domain]
      external: forbid
      stdlib: allow
    invariants:
      - id: "arclint:application/core-actions-present"
        kind: structure
        require:
          - "internal/application/list_rules.go"
          - "internal/application/assess_conformance.go"
          - "internal/application/capture_baseline.go"
          - "internal/application/list_patterns.go"

  infrastructure:
    consumes:
      id: "arclint:infrastructure/outbound-only"
      internal: [application, domain]
      external: allow
      stdlib: allow
    invariants:
      # Every shipped language adapter embeds its generated stdlib
      # table: exact import classification, never heuristics. One
      # require per adapter; languages are a finite ArcLint enum, so
      # the parametric legacy correspondence rule is unnecessary.
      - id: "arclint:infrastructure/stdlib-table-present"
        kind: structure
        require:
          - "internal/infrastructure/language/golang/stdlib_gen.go"

  delivery:
    consumes:
      id: "arclint:delivery/inbound-only"
      internal: [application, domain]
      external: allow
      stdlib: allow
    invariants:
      - id: "arclint:delivery/cli-seal-present"
        kind: structure
        require:
          - "internal/delivery/cli/cli.go"
          - "internal/delivery/cli/factory/factory.go"
          - "internal/delivery/cli/adapters/cobra/cobra.go"

  cli_factory:
    consumes:
      id: "arclint:delivery/cli-factory-dependencies"
      # delivery is allowed because the neutral CLI Interface the
      # factory selects for lives in the delivery module.
      internal: [application, domain, cobra_adapter, delivery]
      external: forbid
      stdlib: allow

  cobra_adapter:
    consumes:
      id: "arclint:delivery/cobra-sealed"
      # delivery is allowed because the adapter translates the neutral
      # commands owned by the delivery module; the seal is enforced by
      # the cobra-factory-only protected rule, not by this allow-list.
      internal: [application, domain, delivery]
      external: allow
      stdlib: allow

  composition:
    consumes:
      id: "arclint:composition/selects-adapters"
      internal: [delivery, infrastructure, application, domain, cli_factory, cobra_adapter]
      external: allow
      stdlib: allow
    invariants:
      - id: "arclint:composition/main-present"
        kind: structure
        require: ["cmd/arclint/main.go"]

  source:
    invariants:
      - id: "arclint:source/snake-case"
        kind: naming
        files: "internal/**/*.go"
        case: snake_case

dependencies:
  - id: "arclint:dependencies/application-inward"
    kind: layers
    layers: [application, domain]
  - id: "arclint:infrastructure/composition-only"
    kind: protected
    module: infrastructure
    allow: [composition]
  - id: "arclint:delivery/cobra-factory-only"
    kind: protected
    module: cobra_adapter
    allow: [cli_factory, composition]
  - id: "arclint:dependencies/acyclic"
    kind: acyclic
    # cli_factory and cobra_adapter are excluded: their paths nest
    # inside delivery's, and overlapping membership lifts intra-delivery
    # imports into artificial module cycles.
    modules: [composition, delivery, infrastructure, application, domain]
