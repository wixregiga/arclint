# arclint's own architecture contracts (M1 gate 3: self-hosting).
# yaml-language-server: $schema=docs/rules.schema.json

runtime: [go]

modules:
  cmd:
    paths: ["cmd/**"]
    description: "CLI entrypoints: command wiring, output formatting, exit codes."
  config:
    paths: ["internal/config/**"]
    description: "rules.yaml data model, JSON Schema pipeline, and validation."
  engine:
    paths: ["internal/engine/**"]
    description: "Rule evaluation: walks the tree, runs every provider, collects violations."
  ext:
    paths: ["internal/ext/**"]
    description: "TypeScript extension runtime: esbuild transpile, sobek sandbox, SDK."
  golang:
    paths: ["internal/lang/golang/**"]
    description: "Exact Go import extraction and classification (go/parser)."
  langs:
    paths: ["internal/lang/**"]
    description: "Shared import model plus the per-language analyzers."
  oracle:
    paths: ["internal/oracle/**"]
    description: "Differential oracle against `go list` over pinned real repositories."
  tree:
    paths: ["internal/tree/**"]
    description: "Repository walker: exclusions, file metadata, deterministic order."
  report:
    paths: ["internal/report/**"]
    description: "The violation model and its stable JSON shape; stdlib-only."
  exprenv:
    paths: ["internal/exprenv/**"]
    description: "expr-lang environment and compile-time type checking for expr rules."
  patterns:
    paths: ["internal/patterns/**"]
    description: "Embedded architectural pattern bundles served by init and patterns."
  tools:
    paths: ["tools/**"]
    description: "Code generators: stdlib tables, JSON Schema, SDK type declarations."
  src: ["internal/**"]

contracts:
  report:
    consumes:
      internal: []
      external: forbid # the violation model stays stdlib-only
    invariants:
      - kind: content
        files: "internal/report/**/*.go"
        must_not: ['\bpanic\(']
  tree:
    consumes:
      internal: []
  exprenv:
    consumes:
      internal: []
  golang:
    consumes:
      internal: [tree, langs]
  config:
    consumes:
      internal: [exprenv]
  ext:
    consumes:
      internal: []
  engine:
    consumes:
      internal: [config, golang, langs, tree, report, exprenv, ext]
  patterns:
    consumes:
      internal: []
  cmd:
    consumes:
      internal: [config, engine, report, ext, patterns, langs, tree]
    invariants:
      - kind: structure
        require: ["cmd/arclint/main.go"]
  tools:
    consumes:
      internal: [config]
  langs:
    provides:
      # Every language target ships an embedded stdlib table: the M3
      # targets inherit this obligation automatically.
      - kind: correspondence
        of: { files: 'internal/lang/(?P<lang>[a-z]+)/analyze\.go', value: "{lang}" }
        in: { files: 'internal/lang/(?P<lang>[a-z]+)/stdlib_gen\.go', value: "{lang}" }
        relation: subset
  src:
    invariants:
      - kind: naming
        files: "internal/**/*.go"
        case: snake_case
      - kind: expr
        files: "internal/**/*.go"
        assert: "file.lines <= 900"
        message: "keep source files under 900 lines"

dependencies:
  - kind: layers
    layers: [cmd, engine, config, golang, tree]
  - kind: acyclic
    modules: [cmd, config, engine, ext, golang, tree, report, exprenv, tools, oracle, patterns]
  - kind: protected
    module: report
    allow: [engine, cmd]
