# Violating case: a recorded aggregate misses its tests, another has
# no home at all.
rule: "entities/aggregate-slices"
files:
  domain.arclint.yaml: |
    version: 1
    project: boxoffice
    contexts:
      catalog:
        definition: What is on sale.
        aggregates:
          Event:
            definition: One show an organizer puts on sale.
            identity: EventID
      capacity:
        definition: Whether one more promise fits the room.
        aggregates:
          Capacity:
            definition: The seat count for one event.
            identity: CapacityID
  internal/entities/event/event.go: |
    package event

    type Event struct{}
  internal/entities/event/repository.go: |
    package event

    type Repository interface {
        Find(id string) (Event, error)
    }
expect:
  - kind: violation
    path: internal/entities/event/event_test.go
    line: 0
    message: "Zone \"entities\" is missing a required file matching \"internal/entities/event/event_test.go\""
  - kind: violation
    path: internal/entities/capacity/capacity.go
    line: 0
    message: "Zone \"entities\" is missing a required file matching \"internal/entities/capacity/capacity.go\""
  - kind: violation
    path: internal/entities/capacity/repository.go
    line: 0
    message: "Zone \"entities\" is missing a required file matching \"internal/entities/capacity/repository.go\""
  - kind: violation
    path: internal/entities/capacity/capacity_test.go
    line: 0
    message: "Zone \"entities\" is missing a required file matching \"internal/entities/capacity/capacity_test.go\""
