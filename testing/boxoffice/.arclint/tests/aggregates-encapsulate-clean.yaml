# Conforming case: the aggregate's struct keeps every field
# unexported; value objects may export theirs.
rule: "entities/aggregates-encapsulate"
files:
  domain.arclint.yaml: |
    version: 1
    project: boxoffice
    contexts:
      catalog:
        definition: What is on sale.
        aggregates:
          Event:
            definition: One show an organizer puts on sale.
            identity: EventID
        value_objects:
          TicketTier:
            definition: One named offer within an event.
  internal/entities/event/event.go: |
    package event

    type TicketTier struct {
        Name string
    }

    type Event struct {
        id    string
        tiers []TicketTier
    }
expect: []
