# Conforming case: every recorded aggregate has its slice, its
# repository interface, and its tests.
rule: "entities/aggregate-slices"
files:
  domain.arclint.yaml: |
    version: 1
    contexts:
      - name: catalog
        entities:
          - name: Event
            definition: One show an organizer puts on sale.
            aggregate: true
  internal/entities/event/event.go: |
    package event

    type Event struct{}
  internal/entities/event/repository.go: |
    package event

    type Repository interface {
        Find(id string) (Event, error)
    }
  internal/entities/event/event_test.go: |
    package event

    import "testing"

    func TestEvent(t *testing.T) {}
expect: []
