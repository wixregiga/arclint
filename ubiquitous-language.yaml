# yaml-language-server: $schema=.agents/skills/domain-librarian/library.schema.json
version: 1
contexts:
  - name: rule
    entities:
      - name: Rule
        definition: >-
          One enforceable architecture claim configured in rules.yaml.
          A Rule keeps its RuleID while everything human-facing about
          it can be renamed. Aggregate evidence, from the rules.yaml
          header: "Rule is the sole aggregate". A Rule's identity, its
          Claim, its scope, and its Severity change together in one
          edit of rules.yaml.
        aggregate: true
      - name: Module
        definition: >-
          A named group of folders and files an architecture speaks
          about, such as domain or delivery. A Module keeps its
          ModuleName while the paths that belong to it change: a Rule
          says "on: domain" and never repeats a folder. A Pattern lists
          its Modules with descriptions and no paths; a repository
          ruleset gives every Module its paths, either directly or
          through a Binding.
      - name: Pattern
        definition: >-
          A named, namespaced collection of Rules and Modules published
          for other repositories to extend, with a documentation link
          and the Languages it covers. A Pattern keeps its namespace
          and name across versions; a repository always extends one
          exact version through a PatternReference. Every Rule a
          Pattern distributes carries the Pattern's namespace in its
          RuleID.
    value_objects:
      - name: RuleID
        definition: >-
          The stable, optionally namespace-qualified identity of a
          Rule, spelled explicitly in rules.yaml. Every record arclint
          keeps about a Rule over time keys on it, so it outlives
          renames of anything else about the Rule.
      - name: ModuleName
        definition: >-
          The lowercase name a ruleset spells for a Module, the only
          way a Rule, a Binding, or an Exclusion refers to one.
      - name: Claim
        definition: >-
          The architectural proposition a Rule states, either written
          by the author or derived from the Rule's parameters. The
          Claim of an expanded Rule says what it derives from, and
          says plainly when the vocabulary records nothing yet.
        aliases: [description]
      - name: Assertion
        definition: >-
          The one checkable proposition a Rule carries, written in
          rules.yaml as exactly one assertion key with its parameters:
          imports, structure, naming, invariants, layers, imported_by,
          independent, acyclic, content, or uses. The key alone decides
          how the Rule is evaluated; a Rule never carries two.
      - name: Severity
        definition: >-
          Gate importance of a finding: error, warning, or info.
          Described entirely by its value and validated at
          construction. Two equal spellings are interchangeable.
      - name: Language
        definition: >-
          A source language arclint recognizes and can analyze: go,
          typescript, or python. A repository ruleset states which
          Languages it runs under runtime, and a Pattern states which
          Languages it covers. Recognition does not promise that every
          Rule covers the Language.
      - name: PatternReference
        definition: >-
          The exact spelling namespace/name@version by which a
          repository extends one published version of a Pattern. A
          Rule a Pattern distributes carries the PatternReference as
          its provenance, and two references with the same spelling
          resolve to the same Pattern version.
      - name: Expansion
        definition: >-
          How a structure Rule's globs derive from one recorded
          vocabulary collection: an ExpansionSource plus authored
          globs whose {name:<case>} placeholders resolve once per
          recorded term. It is pure substitution, with no predicates,
          filters, or joins. Logic beyond substitution belongs in an
          extension. The Rule stays the sole aggregate: an expanded
          Rule is one Rule stating one universally quantified Claim.
      - name: ExpansionSource
        definition: >-
          The recorded collection an Expansion derives from, one of
          the closed set domain.aggregates, domain.entities,
          domain.value_objects, domain.events, domain.contexts,
          domain.invariants, domain.assertions,
          domain.specifications. A new source is a deliberate design
          act, never a syntax feature.
      - name: TermCase
        definition: >-
          One published rendering of a recorded term as a path or
          identifier segment: flatcase, snake_case, kebab-case,
          camelCase, or PascalCase. One producing implementation
          serves both surfaces, the rules.yaml {name:<case>}
          placeholders and the extension SDK's ctx.caseTerm, so
          whatever the ruleset grammar expresses an extension can
          see. A CaseSpec checks names; a TermCase produces them.
      - name: CaseSpec
        definition: >-
          The finite case vocabulary a naming Rule matches file stems
          against in rules.yaml: kebab-case, snake_case, camelCase,
          PascalCase, or a regex, combined as alternatives.
    invariants:
      - statement: >-
          A Severity must be one of error, warning, or info; any other
          spelling is rejected at construction, never stored.
        owner: Severity
      - statement: >-
          An Expansion must name a published ExpansionSource, declare
          at least one require or forbid glob, and use braces only as
          {name:<case>} placeholders with a published TermCase.
          Anything else is rejected at construction, never loaded.
        owner: Expansion
      - statement: >-
          A Rule may carry an Expansion only as a structure Rule, and
          its parameters must be exactly the Expansion's resolution
          against the recorded language. When nothing is recorded the
          parameters are empty and the Claim says so.
        owner: Rule
      - statement: >-
          A Rule carries exactly one Assertion; a Rule written with two
          assertion keys, or with none and no Override target, is
          rejected at load.
        owner: Rule
      - statement: >-
          Two Rules with the same qualified RuleID cannot both exist in
          one repository; a repository Rule spelled with the RuleID of a
          Rule an extended Pattern distributes is rejected at load.
        owner: Rule
      - statement: >-
          A Module in a repository ruleset has at least one path; a
          Module written with no paths is legal only in a Pattern file,
          where a Binding supplies them later.
        owner: Module
      - statement: >-
          A Pattern lists its Modules without paths, and every Rule the
          Pattern distributes names only Modules the Pattern lists.
        owner: Pattern
      - statement: >-
          A TermCase never renders an empty segment: a term without
          letters or digits is rejected at resolution.
        owner: TermCase
  - name: adoption
    value_objects:
      - name: Binding
        definition: >-
          The paths an adopting repository gives to one Module of a
          Pattern it extends, spelled under bind as one glob or a list
          of globs. A Binding is the only place a Pattern Module's
          paths live; the Pattern's Rules never change when the folders
          do.
      - name: Override
        definition: >-
          One adopting repository's decision applied onto a Rule an
          extended Pattern distributes, keyed by the Rule's qualified
          RuleID. An Override is not a second Rule: it only disables
          the Rule, changes its Severity, excludes subjects from it, or
          suppresses its findings.
      - name: Disablement
        definition: >-
          The decision to stop evaluating one Rule for the repository,
          with a reason. The Rule and its provenance stay inspectable
          and the reason is reported wherever the Rule is listed.
      - name: Exclusion
        definition: >-
          The decision removing selected paths or Modules from what one
          Rule judges, with a reason. Excluded subjects are reported as
          not applicable, never silently dropped.
      - name: Suppression
        definition: >-
          The decision keeping a finding one Rule produced at selected
          paths while removing its gate effect, with a reason. The
          finding is still reported as suppressed.
      - name: Installation
        definition: >-
          The decision to extend one Pattern, recorded in rules.yaml as
          one extends entry that names the PatternReference and carries
          a Binding for every Module the Pattern lists, drafted from
          the paths the Pattern suggests. Installing a Pattern the
          binary does not embed keeps a VendoredPattern first, so the
          repository resolves the PatternReference offline.
    invariants:
      - statement: >-
          An Installation of a Pattern whose namespace and name the
          repository already extends replaces the extended version and
          keeps every Binding; it never records a second extends entry
          for one namespace and name.
        owner: Installation
      - statement: >-
          A Binding names a Module the extended Pattern lists and gives
          it at least one path; a Binding for a Module the Pattern does
          not list is rejected at load.
        owner: Binding
      - statement: >-
          Every Module an extended Pattern lists has a Binding before
          the Pattern's Rules evaluate; a Module left unbound is
          rejected at load.
        owner: Binding
      - statement: >-
          An Override names a Rule an extended Pattern distributes; an
          Override whose RuleID matches no Pattern Rule is rejected at
          load.
        owner: Override
      - statement: >-
          An Override carries no Assertion and no Claim; adding either
          is rejected at load with the advice to add a new local Rule
          under a new RuleID.
        owner: Override
      - statement: >-
          A Disablement carries a reason; disabling without one is
          rejected at load.
        owner: Disablement
      - statement: >-
          An Exclusion names at least one path or Module and carries a
          reason; an Exclusion without either is rejected at load.
        owner: Exclusion
      - statement: >-
          A Suppression names at least one path and carries a reason;
          a Suppression without either is rejected at load.
        owner: Suppression
  - name: conformance
    value_objects:
      - name: Violation
        definition: >-
          One suspected breach of a Rule, anchored at a file and line
          and carrying the PatternReference of the Pattern that
          distributed the Rule when one did. It has no lifecycle: every
          assessment derives its Violations fresh, and two Violations
          with the same values are the same finding.
  - name: distribution
    value_objects:
      - name: Catalog
        definition: >-
          Every Pattern the resolving PatternSources carry, one entry
          per PatternReference in source order, with the agreeing
          copies of one reference kept beside the first. A listing
          reads the Catalog to say where a Pattern resolves from and
          what the repository carries of it; a check resolves the
          PatternReferences it extends through the Catalog.
      - name: Digest
        definition: >-
          The sha256 content hash, spelled sha256:<hex>, that identifies
          the exact bytes of one PatternFile, or of a whole Pattern
          through the sorted list of its PatternFile paths and their
          Digests. Two copies of one published version share one
          Digest.
      - name: Index
        definition: >-
          A Registry's complete listing of the Pattern versions it
          publishes, one entry per PatternReference carrying the
          version's Digest and documentation, ordered by namespace,
          name, then version. The Index is read before any Manifest or
          PatternFile, so a Registry is listed and a Selection resolved
          without fetching a Pattern.
      - name: Manifest
        definition: >-
          The record a published Pattern version travels with: its
          PatternReference, its Digest, and the path and Digest of
          every PatternFile it ships. A Manifest is written beside a
          VendoredPattern and read from a Registry before any
          PatternFile is fetched.
      - name: PatternFile
        definition: >-
          One file a Pattern ships: a forward-slash path relative to
          the Pattern's own directory and the file's bytes. The
          pattern.yaml file is always one of them, and every Extension
          the Pattern distributes lives under extensions/.
      - name: PatternSource
        definition: >-
          One place arclint resolves a PatternReference from: the
          Patterns embedded in the binary, the Patterns kept under
          .arclint/patterns in the repository, or a Registry. A check
          resolves through the first two only; a Registry is read when
          a command asks to vendor or install a Pattern.
      - name: Registry
        definition: >-
          A location, reachable by URL, that publishes Patterns by
          PatternReference: an index of every published reference and,
          per version, a Manifest beside the Pattern's files. The
          default Registry is arclint's own; a command may name
          another.
      - name: Selection
        definition: >-
          The spelling a command accepts to name one Pattern among the
          PatternReferences a source carries: an exact
          namespace/name@version, a namespace/name meaning its highest
          version, or a bare name meaning the highest version of the
          one namespace/name that carries it.
      - name: VendoredPattern
        definition: >-
          An exact copy of one published Pattern version kept under
          .arclint/patterns/<namespace>/<name>/ together with its
          Manifest, so the repository resolves the PatternReference
          offline. One name in one namespace has one vendored version.
    invariants:
      - statement: >-
          A Digest computed twice over the same PatternFiles is the
          same Digest; file order, platform, and time never enter it.
        owner: Digest
      - statement: >-
          A Manifest lists every PatternFile of the Pattern and none
          outside the Pattern's directory; a path that is absolute,
          escapes the directory, or appears twice is rejected at
          construction.
        owner: Manifest
      - statement: >-
          A Registry is never read while a check runs; a check resolves
          only embedded and vendored Patterns.
        owner: Registry
      - statement: >-
          Two PatternSources that carry one PatternReference must agree
          on its Digest; a disagreement is rejected at load, because a
          published version is immutable.
        owner: PatternSource
      - statement: >-
          A VendoredPattern whose PatternFiles no longer match its
          Manifest is rejected at load, never used silently.
        owner: VendoredPattern
      - statement: >-
          An Index lists one PatternReference at most once; a listing
          that repeats a reference is rejected at construction, because
          a published version is immutable.
        owner: Index
      - statement: >-
          A Pattern fetched from a Registry must carry the Digest its
          Index records; a fetched version whose Digest disagrees with
          the Index is rejected, never vendored.
        owner: Index
      - statement: >-
          A bare-name Selection carried by more than one namespace/name
          is rejected as ambiguous, with every matching reference
          spelled out; nothing is chosen on the caller's behalf.
        owner: Selection
relations:
  # conformance adopts the rule context's model as-is: assessments
  # consume Rule, Severity, and the rest of the rule model directly,
  # so dependence flows conformance -> rule and never back.
  - from: rule
    to: conformance
    kind: conformist
  # adoption speaks the rule context's model unchanged: a Binding
  # names a Module, an Override names a Rule, and neither redefines
  # them, so dependence flows adoption -> rule and never back.
  - from: rule
    to: adoption
    kind: conformist
  # distribution moves Patterns around without redefining them: a
  # Manifest names a PatternReference and a VendoredPattern carries a
  # Pattern as the rule context spells it, so dependence flows
  # distribution -> rule and never back.
  - from: rule
    to: distribution
    kind: conformist
  # adoption consumes the distribution model unchanged: an Installation
  # keeps a VendoredPattern and resolves through PatternSources, so
  # dependence flows adoption -> distribution and never back.
  - from: distribution
    to: adoption
    kind: conformist
