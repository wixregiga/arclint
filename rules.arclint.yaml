# yaml-language-server: $schema=.arclint/schemas/rules.arclint.schema.json
# ArcLint's own architecture contracts, self-hosted on the target
# domain model: Rule is the sole aggregate, use cases coordinate
# through ports, adapters stay outbound or inbound, Cobra stays
# sealed behind the CLI factory, and report renderers stay sealed
# behind the report factory (two distinct delivery seams).
#
# Every Rule is keyed by its id and carries exactly one constraint:
# imports, structure, naming, content, layers, imported_by,
# independent, acyclic, or uses. `on` names the Zone(s)
# it judges. Query commands: arclint rules [selector] · arclint context <path>

# go for the engine; ts for the extension SDK and Web frontend.
runtime: [go, ts]

scan:
  unknown_imports: error
  exclude:
    - ".claude/worktrees/**"
    - ".wixregiga-ignore/**"
    - "**/generated/**"
    - "**/mock_*.go"
    - "**/*_test.go"
    # The boxoffice proving ground is its own repository in spirit:
    # its own go.mod, rules.arclint.yaml, and vocabulary. It must not land
    # in this build or this scan.
    - "testing/**"
    # Vite output is a distribution artifact, never authored architecture.
    - "web/dist/**"

# The vocabulary rules are not written here: they are the built-in
# rules every recorded building block carries, exactly as any adopter
# receives them the moment domain.arclint.yaml records a term. Each is
# listed under the invariant's id (aggregate/root-declared,
# context_relation/imports-follow-influence, ...) and adjusted, when
# it must be, through an Override under that id.

zones:
  domain:
    paths: "internal/domain/**"
    description: "Rule aggregate and domain values; stdlib-only."
  application:
    paths: "internal/application/**"
    description: "Action-named use cases coordinating domain objects through ports."
  infrastructure:
    paths: "internal/infrastructure/**"
    description: "Outbound technology adapters implementing inward-owned ports."
  delivery:
    paths: "internal/delivery/**"
    description: "CLI adapters for inbound command translation and outbound Report rendering."
  cli_interface:
    paths: "internal/delivery/cli/*.go"
    description: "Framework-neutral CLI commands, reports, and adapter ports."
  cli_factory:
    paths: "internal/delivery/cli/factory/**"
    description: "Sealed CLI factory selecting an adapter by ArcLint-owned identity."
  cobra_adapter:
    paths: "internal/delivery/cli/adapters/cobra/**"
    description: "The only package permitted to import Cobra."
  report_factory:
    paths: "internal/delivery/cli/reportfactory/**"
    description: "Sealed report factory selecting a renderer by ArcLint-owned identity."
  plain_report:
    paths: "internal/delivery/cli/adapters/report/plain/**"
    description: "Plain-text report renderer adapter."
  json_report:
    paths: "internal/delivery/cli/adapters/report/json/**"
    description: "JSON report renderer adapter."
  lipgloss_report:
    paths: "internal/delivery/cli/adapters/report/lipgloss/**"
    description: "The only package permitted to import Lipgloss."
  composition:
    paths: "cmd/**"
    description: "Composition roots selecting and connecting concrete adapters."
  source:
    paths: "internal/**"
    description: "Common source invariants for internal packages."
  # Context-named zones: a bounded context recorded in
  # domain.arclint.yaml locates its code from the declarations that
  # spell its recorded terms, searched across the whole repository. A
  # Zone spelled with the context's name narrows that search to its
  # paths; these four give the built-in context rules the full extent
  # of each context's code. adoption names no Zone: its values are
  # declared directly in the rule package, found the same way.
  vocabulary:
    paths: "internal/domain/vocab/**"
    description: "The vocabulary bounded context: the recorded Ubiquitous Language and the meta-model it is checked against."
  rule:
    paths: "internal/domain/rule/**"
    description: "The rule bounded context: the Rule aggregate's home."
  conformance:
    paths: "internal/domain/conformance/**"
    description: "The conformance bounded context, downstream conformist of rule."
  distribution:
    paths: "internal/domain/distribution/**"
    description: "The distribution bounded context: Patterns travelling between repositories."

  # Web is a browser application with its own composition boundary.
  # These are technical Zones, not new bounded contexts or classifications
  # of the user's project domain. See docs/web-architecture.md.
  web:
    paths: "web/**"
    description: "Web frontend package, build configuration, and public assets."
  web_source:
    paths: "web/src/**"
    description: "Browser-portable Web source, organized by FSD responsibility."
  web_app:
    paths: "web/src/app/**"
    description: "Web composition, routes, providers, host adapters, and explicit launch entrypoints."
  web_pages:
    paths: "web/src/pages/**"
    description: "Screen slices owning their presentation and screen-specific behavior."
  web_widgets:
    paths: "web/src/widgets/**"
    description: "Optional reusable screen compositions; introduce only when pages or features do not own them."
  web_features:
    paths: "web/src/features/**"
    description: "Reusable user-action slices named for the behavior they provide."
  web_entities:
    paths: "web/src/entities/**"
    description: "Reusable Web concepts; an FSD entity slice does not classify a DDD Entity."
  web_shared:
    paths: "web/src/shared/**"
    description: "Purpose-named browser libraries, UI primitives, transport contracts, and configuration without project-domain policy."
  web_standalone:
    paths: "web/src/app/entrypoints/start-web.ts"
    description: "Standalone browser startup; chooses the mount target and opts into PWA lifecycle."
  web_pwa:
    paths: "web/src/app/pwa/**"
    description: "Standalone PWA registration, updates, and worker lifecycle; never implicit in an embedded mount."

rules:
  # ---- domain --------------------------------------------------------

  domain/stdlib-only:
    rationale: "The domain imports no other Zone and no third-party package."
    on: domain
    imports:
      internal: []
      external: forbid

  domain/rule-is-sole-aggregate:
    rationale: "Rule is the only aggregate: it has a root, and no other aggregate root exists."
    on: domain
    structure:
      require:
        - "internal/domain/rule/root.go"
      forbid:
        - "internal/domain/architecture/**"
        - "internal/domain/pattern/**"
        - "internal/domain/baseline/root.go"
        - "internal/domain/conformance/root.go"
        - "internal/domain/distribution/root.go"

  domain/no-panic:
    rationale: "Domain code never panics; a representation that cannot become a value is an error."
    on: domain
    files: "internal/domain/**/*.go"
    content:
      forbid: '\bpanic\('

  # Domain directories talk through their file names: a domain file is
  # named for the vocabulary concept it holds, never for a generic
  # container.
  domain/files-speak-the-vocabulary:
    rationale: "Domain files are named for the concept they hold, never for a generic container."
    on: domain
    structure:
      forbid:
        - "internal/domain/**/model.go"
        - "internal/domain/**/types.go"
        - "internal/domain/**/util.go"
        - "internal/domain/**/utils.go"
        - "internal/domain/**/helpers.go"
        - "internal/domain/**/common.go"

  # Domain errors scream their subject: ErrDefinitionNotFound, never a
  # bare ErrNotFound the package qualifier cannot rescue.
  domain/errors-name-their-subject:
    rationale: "Domain errors name their subject; a bare ErrNotFound or ErrInvalid is forbidden."
    on: domain
    files: "internal/domain/**/*.go"
    content:
      forbid: '\bErr(NotFound|Invalid|Failed|Exists)\b'

  # The vocabulary-expansion showcase: one universally quantified
  # structure Rule whose globs derive from the recorded aggregates:
  # every recorded aggregate owns a home declaring its root and its
  # Repository. Inert until a vocabulary is recorded; warning because
  # model-code drift is a conversation, not a broken build.
  domain-model/aggregate-skeleton:
    rationale: "Every recorded aggregate owns a home declaring its root and its Repository."
    severity: warning
    on: domain
    structure:
      each: domain.aggregates
      require:
        - "internal/domain/{name:flatcase}/root.go"
        - "internal/domain/{name:flatcase}/repository.go"

  # ---- application ---------------------------------------------------

  application/use-cases-through-ports:
    rationale: "Use cases import only the domain and no third-party package."
    on: application
    imports:
      internal: [domain]
      external: forbid

  application/core-actions-present:
    rationale: "The core use cases exist under their action names."
    on: application
    structure:
      require:
        - "internal/application/list_rules.go"
        - "internal/application/assess_conformance.go"
        - "internal/application/capture_baseline.go"
        - "internal/application/list_patterns.go"

  # ---- infrastructure ------------------------------------------------

  infrastructure/outbound-only:
    rationale: "Infrastructure imports only application and domain."
    on: infrastructure
    imports:
      internal: [application, domain]

  # Every shipped language adapter embeds its generated stdlib table:
  # exact import classification, never heuristics.
  infrastructure/stdlib-table-present:
    rationale: "The Go language adapter embeds its generated stdlib table."
    on: infrastructure
    structure:
      require:
        - "internal/infrastructure/language/golang/stdlib_gen.go"

  # ---- delivery ------------------------------------------------------

  delivery/dependencies:
    rationale: "Delivery imports only application and domain."
    on: delivery
    imports:
      internal: [application, domain]

  delivery/cli-seal-present:
    rationale: "The CLI seal and the report seal are both complete."
    on: delivery
    structure:
      require:
        - "internal/delivery/cli/cli.go"
        - "internal/delivery/cli/factory/factory.go"
        - "internal/delivery/cli/adapters/cobra/cobra.go"
        - "internal/delivery/cli/report.go"
        - "internal/delivery/cli/reportfactory/factory.go"
        - "internal/delivery/cli/adapters/report/plain/plain.go"
        - "internal/delivery/cli/adapters/report/json/json.go"
        - "internal/delivery/cli/adapters/report/lipgloss/lipgloss.go"

  delivery/cli-interface-dependencies:
    rationale: "The framework-neutral CLI imports only application and domain, and no third-party package."
    on: cli_interface
    imports:
      internal: [application, domain]
      external: forbid

  # delivery is allowed because the neutral CLI Interface the factory
  # selects for lives in the delivery zone.
  delivery/cli-factory-dependencies:
    rationale: "The CLI factory imports application, domain, the Cobra adapter, and delivery, and no third-party package."
    on: cli_factory
    imports:
      internal: [application, domain, cobra_adapter, delivery]
      external: forbid

  # delivery is allowed because the adapter translates the neutral
  # commands owned by the delivery zone; the seal is enforced by the
  # cobra-factory-only rule, not by this allow-list.
  delivery/cobra-sealed:
    rationale: "The Cobra adapter imports application, domain, and delivery."
    on: cobra_adapter
    imports:
      internal: [application, domain, delivery]

  # delivery is allowed because the sealed Report/Renderer port the
  # factory selects for lives in the delivery zone.
  delivery/report-factory-dependencies:
    rationale: "The report factory imports delivery and the three renderers, and no third-party package."
    on: report_factory
    imports:
      internal: [delivery, plain_report, json_report, lipgloss_report]
      external: forbid

  # Renderers consume the delivery-owned Report wrappers and their
  # inward application/domain values.
  delivery/plain-report-dependencies:
    rationale: "The plain renderer imports delivery, application, and domain, and no third-party package."
    on: plain_report
    imports:
      internal: [delivery, application, domain]
      external: forbid

  delivery/json-report-dependencies:
    rationale: "The JSON renderer imports delivery, application, and domain, and no third-party package."
    on: json_report
    imports:
      internal: [delivery, application, domain]
      external: forbid

  # External allow is the Lipgloss framework edge; the
  # lipgloss-report-factory-only rule seals who may import it.
  delivery/lipgloss-sealed:
    rationale: "The Lipgloss renderer imports delivery, application, and domain."
    on: lipgloss_report
    imports:
      internal: [delivery, application, domain]

  # ---- composition ---------------------------------------------------

  # Report adapters are deliberately absent: composition selects them
  # only through report_factory by RendererName.
  composition/selects-adapters:
    rationale: "Composition imports every Zone it wires except the report renderers."
    on: composition
    imports:
      internal: [delivery, infrastructure, application, domain, cli_factory, cobra_adapter, report_factory]

  composition/main-present:
    rationale: "The arclint binary has a main."
    on: composition
    structure:
      require: ["cmd/arclint/main.go"]

  # ---- source --------------------------------------------------------

  source/snake-case:
    rationale: "Go file names use snake_case."
    on: source
    files: "internal/**/*.go"
    naming: snake_case

  # ---- Web --------------------------------------------------------
  # The prospective contract applies before Web is implemented in this
  # checkout. Missing launch surfaces are findings, not baseline entries.
  # Layers are optional until needed; no empty slice scaffolds are required.

  web/launch-surfaces-present:
    rationale: "Web has separate standalone startup and host-controlled mounting entrypoints, plus an authored web app manifest; presence alone proves no runtime behavior."
    on: web
    structure:
      require:
        - "web/package.json"
        - "web/vite.config.ts"
        - "web/index.html"
        - "web/public/manifest.webmanifest"
        - "web/src/app/entrypoints/start-web.ts"
        - "web/src/app/entrypoints/mount-web.ts"

  web/source-layout:
    rationale: "A reader can find code by FSD layer, slice, and purposeful segment; implementation is not placed beside a slice's public interface."
    on: web_source
    uses: web-source-layout

  web/layers-point-downward:
    rationale: "Web dependencies run from app through pages, optional widgets, features, entities, and shared; lower layers never import higher layers."
    layers: [web_app, web_pages, web_widgets, web_features, web_entities, web_shared]

  web/slices-are-independent:
    rationale: "Sibling slices remain independently understandable; compose their behavior in a higher layer. Native independent skips Zone-owned folders, so this rule uses resolved imports in the selected Web source."
    on: web_source
    uses: web-slice-isolation

  web/public-interfaces:
    rationale: "Other modules depend on a slice or Shared module's explicit public entry, while its own implementation imports local files directly."
    on: web_source
    uses: web-public-interfaces

  web/browser-dependencies:
    rationale: "Browser source imports only Web source and declared third-party packages; Node builtins and build or engine implementation belong outside the browser graph. Package browser compatibility still requires review."
    on: web_source
    imports:
      internal: []
      stdlib: forbid

  web/standalone-is-an-entrypoint:
    rationale: "No module imports standalone startup; a host invokes mount-web without importing browser auto-start code."
    on: web_standalone
    imported_by: []

  web/pwa-lifecycle-is-opt-in:
    rationale: "Only standalone startup imports the PWA lifecycle; embedding Web must not implicitly install a service worker in the host's origin."
    on: web_pwa
    imported_by: [web_standalone]

  web/files-speak-their-purpose:
    rationale: "Implementation filenames identify the concept or action they hold; index.ts is reserved for a public interface, and model remains a segment name rather than a generic file."
    on: web_source
    structure:
      forbid:
        - "web/src/**/model.ts"
        - "web/src/**/model.tsx"
        - "web/src/**/types.ts"
        - "web/src/**/types.tsx"
        - "web/src/**/util.ts"
        - "web/src/**/util.tsx"
        - "web/src/**/utils.ts"
        - "web/src/**/utils.tsx"
        - "web/src/**/helper.ts"
        - "web/src/**/helper.tsx"
        - "web/src/**/helpers.ts"
        - "web/src/**/helpers.tsx"
        - "web/src/**/common.ts"
        - "web/src/**/common.tsx"
        - "web/src/**/constants.ts"
        - "web/src/**/constants.tsx"
        - "web/src/**/data.ts"
        - "web/src/**/data.tsx"
        - "web/src/**/service.ts"
        - "web/src/**/service.tsx"
        - "web/src/**/services.ts"
        - "web/src/**/services.tsx"
        - "web/src/**/component.ts"
        - "web/src/**/component.tsx"
        - "web/src/**/components.ts"
        - "web/src/**/components.tsx"
        - "web/src/**/hooks.ts"
        - "web/src/**/hooks.tsx"
        - "web/src/**/components/**"
        - "web/src/**/hooks/**"
        - "web/src/**/types/**"
        - "web/src/**/utils/**"
        - "web/src/**/helpers/**"
        - "web/src/**/common/**"
        - "web/src/**/services/**"
        - "web/src/**/index.tsx"
        - "web/src/**/index.test.ts"
        - "web/src/**/index.spec.ts"

  web/typescript-source:
    rationale: "Web executable source uses the TypeScript and TSX files ArcLint observes; JavaScript and alternate module extensions must not silently escape dependency checks."
    on: web_source
    structure:
      forbid: ["web/src/**/*.js", "web/src/**/*.jsx", "web/src/**/*.mjs", "web/src/**/*.cjs", "web/src/**/*.mts", "web/src/**/*.cts"]

  web/explicit-public-exports:
    rationale: "A public interface names its exports explicitly. This line check catches wildcard export statements; it does not judge semantic cohesion."
    on: web_source
    files:
      - "web/src/**/index.ts"
      - "web/src/app/entrypoints/mount-web.ts"
      - "web/src/shared/ui/*.ts"
      - "web/src/shared/ui/*.tsx"
      - "web/src/shared/lib/*.ts"
      - "web/src/shared/lib/*.tsx"
    content:
      forbid: '^\s*export\s+(type\s+)?\*'

  # ---- repository-wide -----------------------------------------------

  dependencies/application-inward:
    rationale: "Dependencies point inward: application, then domain."
    layers: [application, domain]

  infrastructure/composition-only:
    rationale: "Only composition imports infrastructure."
    on: infrastructure
    imported_by: [composition]

  delivery/cobra-factory-only:
    rationale: "Only the CLI factory imports the Cobra adapter."
    on: cobra_adapter
    imported_by: [cli_factory]

  delivery/plain-report-factory-only:
    rationale: "Only the report factory imports the plain renderer."
    on: plain_report
    imported_by: [report_factory]

  delivery/json-report-factory-only:
    rationale: "Only the report factory imports the JSON renderer."
    on: json_report
    imported_by: [report_factory]

  delivery/lipgloss-report-factory-only:
    rationale: "Only the report factory imports the Lipgloss renderer."
    on: lipgloss_report
    imported_by: [report_factory]

  # cli_interface, cli_factory, cobra_adapter, report_factory, and the
  # report adapters are excluded: their paths nest inside delivery's,
  # and overlapping membership lifts intra-delivery imports into
  # artificial zone cycles.
  dependencies/acyclic:
    rationale: "Dependencies among the top-level Zones contain no cycle."
    acyclic: [composition, delivery, infrastructure, application, domain]
